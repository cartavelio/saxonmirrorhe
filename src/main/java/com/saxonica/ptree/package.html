    <title>Package overview: com.saxonica.ptree</title>

<body>
<p>The package com.saxonica.ptree contains classes used to support the persistent
    tree model in Saxon, allowing binary storage of XML documents on disc.</p>

<p>The package includes the classes used to read PTree documents into memory,
    and to write documents to disk in PTree format.</p>
