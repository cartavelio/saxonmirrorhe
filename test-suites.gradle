// ============================================================
// This build file configures and runs the test drivers.
// It's entirely table driven.

testSuite.configure([
  // This maps options to command line arguments to the test driver.
  // If the value ends with a colon, the map value will be passed
  // with the option, otherwise it's just a flag. Use "on" as the
  // value for flags in the map.
  "optionMap": ["bytecode": "-bytecode:",
                "unfolded": "-unfolded",
                "export": "-export",
                "jit": "-jit",
                "summarizeresults": "-summarizeresults:"
  ],

  // This maps test suites to the directories that contain the tests.
  "directoryMap": ["qt3": testsuites.w3cQT3TestSuiteDir,
                   "qt3extra": "${projectDir}/src/test/extra/qt3",
                   "qt4": testsuites.w3cQT4TestSuiteDir,
                   "xslt30": testsuites.w3cXslt30TestSuiteDir,
                   "xslt30extra": "${projectDir}/src/test/extra/xslt30",
                   "xsd": testsuites.w3cXsdTestSuiteDir
  ]
])

