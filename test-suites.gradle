// Tasks to run XSLT3.0 test driver with a variety of options

task xslt30TestsJava() {
  // Just somewhere to hang dependencies
}

task xslt30TestsDotnet() {
  // Just somewhere to hang dependencies
}

task xslt30ExtraTestsJava() {
  // Just somewhere to hang dependencies
}

task xslt30ExtraTestsDotnet() {
  // Just somewhere to hang dependencies
}

["he", "pe", "ee"].each { rel ->
  def languages = ["XT30"]
  def bytecodes = [""]
  def exports = [""]
  def jits = [""]
  if (rel == "ee") {
    bytecodes = ["off", "on"]
    exports = ["", "on"]
    jits = ["", "on"]
  }

  languages.each { lang ->
    bytecodes.each { bc ->
      exports.each { expopt ->
        jits.each { jitopt ->
          def skipThisCombo = ((expopt == "-export" && bc == "on")
                               || (jitopt == "on" && bc == "off"))

          if (!skipThisCombo) {
            testSuite.xslt30 {
              language lang
              release rel
              directory testsuites.w3cXslt30TestSuiteDir
              if (bc != "" || rel == "ee") {
                bytecode (bc == "on")
              }
              if (expopt != "") {
                export (expopt == "on")
              }
              if (jitopt != "") {
                jit (jitopt == "on")
              }
            }

            if (rel == "ee" && bc == "off" && jitopt == "" && expopt == "") {
              testSuite.xslt30 {
                platform "dotnet"
                dotnet dotnetex
                language lang
                release rel
                directory testsuites.w3cXslt30TestSuiteDir
              }
            }

            testSuite.xslt30extra {
              language lang
              release rel
              directory "${projectDir}/src/test/extra/xslt30"
              if (bc != "" || rel == "ee") {
                bytecode (bc == "on")
              }
              if (expopt != "") {
                export (expopt == "on")
              }
              if (jitopt != "") {
                jit (jitopt == "on")
              }
            }
          }
        }
      }
    }
  }
}

