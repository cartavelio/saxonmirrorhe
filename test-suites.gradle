// ============================================================

def g0opt = [:]
testSuiteMatrix.keySet().findAll { it.startsWith("_") }.each { prop ->
  g0opt[prop.substring(1)] = testSuiteMatrix[prop]
}  

project.task("all_test_suites") {
  description "Runs all the test suites"
  doLast {
    testSuite.checkAccumulatedFailures()
  }
}

testSuiteMatrix.keySet().findAll { !it.startsWith("_") }.each { product ->
  def suites = testSuiteMatrix[product]
  def g1opt = ["product": product]
  suites.keySet().findAll { it.startsWith("_") }.each { prop ->
    g1opt[prop.substring(1)] = suites[prop]
  }  

  project.task("all_${product}_test_suites") {
    description "Runs all the test suites for ${product}"
    doLast {
      testSuite.checkAccumulatedFailures()
    }
  }

  suites.keySet().findAll { !it.startsWith("_") }.each { suite ->
    def languages = suites[suite]
    def g2opt = ["suite": suite]
    languages.keySet().findAll { it.startsWith("_") }.each { prop ->
      g2opt[prop.substring(1)] = languages[prop]
    }  

    project.task("all_${product}_${suite}_test_suites") {
      description "Runs all the ${suite} test suites for ${product}"
      doLast {
        testSuite.checkAccumulatedFailures()
      }
    }

    languages.keySet().findAll { !it.startsWith("_") }.each { lang ->
      def options = languages[lang]
      def g3opt = ["language": lang]
      options.keySet().findAll { it.startsWith("_") }.each { prop ->
        g3opt[prop.substring(1)] = options[prop]
      }

      options.keySet().findAll { !it.startsWith("_") }.each { optname ->
        def name = "${product}_${suite}_${lang}"
        if (optname != "") {
          name += "_${optname}"
        }
        def config = ["name": name,
                      "language": lang]
        config += options[optname] + g0opt + g1opt + g2opt + g3opt
        if (product.contains("dotnet")) {
          config["platform"] = "dotnet"
          config["dotnet"] = dotnetex
        } else {
          config["platform"] = "java"
        }

        testSuite.task(config)
      }
    }
  }
}

// ============================================================

["he", "pe", "ee"].each { release ->
  def RELEASE = release.toUpperCase()
  fileTree(dir: "src/test/exceptions").each { fn ->
    def pos = fn.toString().lastIndexOf(fileSeparator)
    def base = fn.toString().substring(pos + 1)
    base = base.substring(0, base.length() - 4)

    def schema11 = (base == "xsd11" || base == "xsd-extra11")
    def schema = schema11 || (base == "xsd" || base == "xsd-extra")
    if (schema11 && release == "ee") {
      // These are a special case, they need to be renamed 'exceptions11.xml'
      // in the corresponding base directory. See "dependsOn" below this loop.
      def bdir = "xsd"
      if (base == "xsd-extra11") {
        bdir = "xsd-extra"
      }
      task "${release}j_setup_${base}_TestResults"(
        type: Copy,
        description: "Sets up the test results directory the ${base} tests for ${RELEASE}"
      ) {
        into "${buildDir}/test-results/${release}j/${bdir}/${DSTAMP}"
        from "src/test/exceptions/${base}.xml"
        rename { "exceptions11.xml" }
      }
    } else {
      // The schema tests only run on EE
      if (!schema || release == "ee") {
        task "${release}j_setup_${base}_TestResults"(
          type: Copy,
          description: "Sets up the test results directory the ${base} tests for ${RELEASE}"
        ) {
          into "${buildDir}/test-results/${release}j/${base}/${DSTAMP}"
          from "src/test/exceptions/${base}.xml"
          rename { "exceptions.xml" }
        }
      }
    }
  }

  task "${release}j_compileTestDrivers"(
    type: JavaCompile,
    dependsOn: ["${release}j_copyTestDrivers", "${release}jCompile"],
    description: "Compile the test classes for ${RELEASE}"
  ) {
    classpath = configurations.testDrivers + files("${buildDir}/classes/${release}j")
    source = "${buildDir}/src/testdrivers/${release}j"
    destinationDirectory = new File("${buildDir}/testdriver_classes/${release}j")
  }
}
