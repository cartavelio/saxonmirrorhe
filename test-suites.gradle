// ============================================================
// Utility functions

def getAbsoluteReportFilename(computedName) {
    def reportFilename = computedName
    if (project.findProperty("tdOutput") != null) {
        def reportFile = file(project.findProperty("tdOutput"))
        reportFilename = reportFile.getAbsolutePath()
    }
    if (reportFilename.endsWith(".xml")) {
        reportFilename = reportFilename.substring(0, reportFilename.length() - 4)
    }

    return reportFilename
}

def getReportFilename(reportFilename) {
    pathSeparator = System.getProperty("file.separator")
    if (reportFilename.contains(pathSeparator)) {
        def pos = reportFilename.lastIndexOf(pathSeparator)
        return reportFilename.substring(pos + 1)
    } else {
        // This should never happen, the reportFilename should always be
        // absolute when this function is called.
        reportFilename
    }
}

def getReportDirectory(reportFilename) {
    pathSeparator = System.getProperty("file.separator")
    if (reportFilename.contains(pathSeparator)) {
        def pos = reportFilename.lastIndexOf(pathSeparator)
        return reportFilename.substring(0, pos)
    } else {
        // This should never happen, the reportFilename should always be
        // absolute when this function is called.
        return System.getProperty("user.dir")
    }
}

