task qt3TestsJava() {
  // Just somewhere to hang dependencies
}

task qt3TestsDotnet() {
  // Just somewhere to hang dependencies
}

["he", "pe", "ee"].each { rel ->
  def languages = ["XP31", "XQ30", "XQ31"]
  if (rel == "ee") {
    languages = ["XP30", "XP31", "XQ10", "XQ30", "XQ31"]
  }

  def bytecodes = [""]
  if (rel == "ee") {
    bytecodes = ["off", "on"]
  }

  languages.each { lang ->
    bytecodes.each { bc ->

      def unfolds = [""]
      if (rel == "ee" && (lang == "XQ30" || lang == "XQ31")) {
        unfolds = ["", "yes"]
      }

      unfolds.each { uoption ->
        if (bc == "off" && uoption != "") {
          // ignore this combination
        } else {
          testSuite.qt3 {
            language lang
            release rel
            directory testsuites.w3cQT3TestSuiteDir
            if (bc != "" || rel == "ee") {
              bytecode (bc == "on")
            }
            if (uoption != "") {
              unfolded (uoption == "yes")
            }
          }
        }

        if (rel == "ee" && bc == "off") {
          testSuite.qt3 {
            platform "dotnet"
            dotnet dotnetex
            language lang
            release rel
            directory testsuites.w3cQT3TestSuiteDir
            if (bc != "" || rel == "ee") {
              bytecode (bc == "on")
            }
            if (uoption != "") {
              unfolded (uoption == "yes")
            }
          }
        }
      }
    }
  }
}

