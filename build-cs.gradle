task eecs_preprocess(
  type: JavaExec,
  dependsOn: ["eecs_setupPreprocess"],
  description: "Preprocess EE sources"
) {
  inputs.files fileTree(dir: "${buildDir}/filtered/eecs")
  outputs.files fileTree(dir: "${buildDir}/preprocess/eecs")
  classpath = configurations.preprocessor
  mainClass = "com.igormaznitsa.jcp.JcpPreprocessor"
  args "/c",
    "/i:${buildDir}/filtered/eecs", "/o:${buildDir}/preprocess/eecs",
    "/p:EE=true", "/p:PE=false",
    "/p:SAXONC=false", "/p:BYTECODE=false", "/p:HOF=true",
    "/p:STREAM=true", "/p:SCHEMA=true", "/p:CSHARP=true"
  doFirst {
    mkdir "${buildDir}/preprocess/eecs"
  }
}

task eecs_resources(
  type: Copy,
  dependsOn: ["compile_function_library"],
  description: "Copy the SEF file for SaxonCS"
) {
  from "${buildDir}/resources/main/net/sf/saxon/data/sef/function-library.sef.xml"
  into "${buildDir}/cs/resources/sef"
}

task eecs_sources(
  type: Copy,
  dependsOn: ["eecs_preprocess"],
  description: "Collect the preprocessed EE sources for compilation"
) {
  from "${buildDir}/preprocess/eecs"
  into "${buildDir}/src/eecs"
  filter { line ->
    if (line.contains("net.sf.saxon.xpath.JAXPXPathStaticContext")
        || line.contains("import com.saxonica.ee.jaxp.SchemaFactoryImpl")
        || line.contains("import net.sf.saxon.stax")
        || line.contains("import net.sf.saxon.jaxp")) {
      null
    } else {
      line
    }
  }
  doFirst {
    mkdir "${buildDir}/src/eecs"
  }
}

task build_transpiler(
  type: JavaCompile,
  dependsOn: ["eecs_featureKeys", "eejJar"],
  description: "Compile the ToXml transpiler}"
) {
  inputs.files fileTree(dir: "${projectDir}/tools/transpiler/src")
  outputs.files fileTree(dir: "${buildDir}/transpiler")
  source("${projectDir}/tools/transpiler/src/ToXml.java")
  source("${projectDir}/tools/transpiler/src/XmlPrinterMHK.java")
  classpath = configurations.transpiler
  destinationDirectory = new File("${buildDir}/transpiler")
  doFirst {
    mkdir("build")
  }
}

task eecs_transpile_to_xml(
  type: JavaExec,
  dependsOn: ["eecs_sources", "build_transpiler"],
  description: "Transpile the EECS Java to XML"
) {
  inputs.files fileTree(dir: "${buildDir}/src/eecs")
  outputs.files fileTree(dir: "${buildDir}/ee_xmlout")
  classpath = configurations.transpiler
  mainClass = "ToXml"
  args "-j:${buildDir}/src/eecs",
    "-repo:${projectDir}",
    "-xml:${buildDir}/ee_xmlout",
    "-h:${projectDir}/src/main/java",
    "-src:${projectDir}/src/main/java",
    "-ee:${saxonVersion}",
    "-icu4j:${icu4jJar}"
  doFirst {
    mkdir("${buildDir}/ee_xmlout")
  }
}

task eecs_xml_digest(
  type: JavaExec,
  dependsOn: ["eecs_transpile_to_xml"],
  description: "Make a digest of the transpiled XML for EECS"
) {
  inputs.files fileTree(dir: "${buildDir}/ee_xmlout")
  inputs.files fileTree(dir: "${projectDir}/tools/transpiler/xslt")
  inputs.file "${projectDir}/tools/transpiler/xslt/xml-to-digest.xsl"
  outputs.files "${buildDir}/ee_digest.xml"
  classpath = configurations.preprocessor
  mainClass = "net.sf.saxon.Transform"
  args "-it",
    "-xsl:${projectDir}/tools/transpiler/xslt/xml-to-digest.xsl",
    "-o:${buildDir}/ee_digest.xml",
    "xmlDir=../../../build/ee_xmlout"
}

task eecs_refine_digest(
  type: JavaExec,
  dependsOn: ["eecs_xml_digest"],
  description: "Refine the digest of the transpiled XML for EECS"
) {
  inputs.file "${buildDir}/ee_digest.xml"
  inputs.file "${projectDir}/tools/transpiler/xslt/refine-digest.xsl"
  outputs.files "${buildDir}/ee_refined-digest.xml"
  classpath = configurations.preprocessor
  mainClass = "net.sf.saxon.Transform"
  args "-xsl:${projectDir}/tools/transpiler/xslt/refine-digest.xsl",
    "-s:${buildDir}/ee_digest.xml",
    "-o:${buildDir}/ee_refined-digest.xml",
    "xmlDir=${buildDir}/ee_xmlout"
}

task eecs_generateCSharp(
  type: JavaExec,
  dependsOn: ["eecs_refine_digest", "build_transpiler", "eecs_transpile_to_xml"],
  description: "Create the CS files for EE"
) {
  inputs.files fileTree(dir: "${buildDir}/ee_xmlout")
  inputs.file "${buildDir}/ee_refined-digest.xml"
  inputs.files fileTree(dir: "${projectDir}/tools/transpiler/xslt")
  outputs.files fileTree(dir: "${buildDir}/cs")
  classpath = configurations.transpiler
  mainClass = "ToXml"
  args "-cs:${buildDir}/cs",
    "-repo:${projectDir}",
    "-xml:${buildDir}/ee_xmlout",
    "-digest:${buildDir}/ee_refined-digest.xml",
    "-ee:${saxonVersion}",
    "-icu4j:${icu4jJar}"
    "-debug"
  doFirst {
    mkdir("${buildDir}/cs")
  }
}

task eecs_project_files (
  type: Copy,
  dependsOn: ["eecs_generateCSharp", "eecs_resources"],
  description: "Prepare the project files used for EECS build"
) {
  from "src/main/saxon-cs/csproj"
  into "${buildDir}/cs"
  include "*.csproj"
  filter { line ->
    line.replaceAll("@@optimize@@", csoptimize)
    .replaceAll("@@csrid@@", csrid)
  }
}

task eecs_dll(
  dependsOn: ["eecs_project_files"],
  description: "Compile SaxonCS DLL for EE"
) {
  inputs.files fileTree(dir: "${buildDir}/cs/Saxon")
  inputs.files fileTree(dir: "${projectDir}/src/main/saxon-cs")
  outputs.file "${buildDir}/cs/obj/Debug/net6.0/engine.dll"

  doLast {
    if (dotnetex == null) {
      throw new GradleException("Cannot build: failed to find dotnet[.exe] on path.")
    }

    exec {
        workingDir = "${buildDir}/cs"
        commandLine dotnetex, 'build', '--nologo', '-o', '../csout', 'engine.csproj'
    }
  }
}

task dotnetTestDrivers(
  dependsOn: ['dotnetRelease']
) {
  inputs.file "${buildDir}/cs/bin/Release/net6.0/${csrid}/SaxonCS.dll"
  inputs.files fileTree(dir: "${projectDir}/src/test/cstestrunner")
  outputs.file "${buildDir}/testdrivers/bin/Release/TestDrivers.${csver}.nupkg"

  doFirst {
    delete "${buildDir}/testdrivers/bin/Release/TestDrivers.${csver}.nupkg"
  }

  doLast {
    copy {
      from "${projectDir}/tools/saxon-cs"
      into "${buildDir}/testdrivers"
      include "TestDrivers.*"
      filter { line ->
        line.replaceAll("@@csrid@@", csrid)
      }
    }
  }

  doLast {
    exec {
      workingDir = "${projectDir}/build/testdrivers"
      commandLine dotnetex, 'restore', 'TestDrivers.sln', '--verbosity', 'Normal'
    }
  }

  doLast {
    exec {
      workingDir = "${projectDir}/build/testdrivers"
      commandLine dotnetex, 'build', 'TestDrivers.sln', '--verbosity', 'Normal',
        '--configuration', 'Release',  '/nodereuse:false', '--no-restore',
        "-p:Version=${csver}", "-p:PackageVersion=${csver}"
    }
  }

  doLast {
    if (!systemOs.isWindows()) {
      signExe("${buildDir}/testdrivers/bin/Release/TestDrivers.${csver}.nupkg")
    }
  }
}

task dotnetExamples(
  dependsOn: ['dotnetRelease']
) {
  inputs.file "${buildDir}/cs/bin/Release/net6.0/${csrid}/SaxonCS.dll"
  inputs.files fileTree(dir: "${projectDir}/src/samples/cs/Examples.cs")
  outputs.file "${buildDir}/examples/bin/Release/Examples.${csver}.nupkg"

  doFirst {
    delete "${buildDir}/examples/bin/Release/Examples.${csver}.nupkg"
  }

  doLast {
    copy {
      from "${projectDir}/tools/saxon-cs"
      into "${buildDir}/examples"
      include "Examples.*"
      filter { line ->
        line.replaceAll("@@csrid@@", csrid)
      }
    }
  }

  doLast {
    exec {
      workingDir = "${buildDir}/examples"
      commandLine dotnetex, 'restore', 'Examples.sln', '--verbosity', 'Normal'
    }
  }

  doLast {
    exec {
      workingDir = "${buildDir}/examples"
      commandLine dotnetex, 'build', 'Examples.sln', '--verbosity', 'Normal',
        '--configuration', 'Release',  '/nodereuse:false', '--no-restore',
        "-p:Version=${csver}", "-p:PackageVersion=${csver}"
    }
  }

  doLast {
    if (!systemOs.isWindows()) {
      signExe("${buildDir}/examples/bin/Release/Examples.${csver}.nupkg")
    }
  }
}

task dotnetRelease(
  dependsOn: ['eecs_dll']
) {
  inputs.files fileTree(dir: "${buildDir}/cs/Saxon")
  inputs.files fileTree(dir: "${projectDir}/src/main/saxon-cs")
  outputs.file "${buildDir}/cs/bin/Release/net6.0/${csrid}/SaxonCS.dll"
  outputs.file "${buildDir}/cs/bin/Release/SaxonCS.${csver}.nupkg"

  doFirst {
    // Delete them if they exist so that they always get rewritten
    // so that the subsequent attempt to sign them doesn't fail.
    delete "${buildDir}/cs/bin/Release/net6.0/${csrid}/SaxonCS.dll"
    delete "${buildDir}/cs/bin/Release/SaxonCS.${csver}.nupkg"
  }

  doLast {
    copy {
      // Copy the csproj and sln files, renaming them so that the release
      // build uses the names we want the packages to have
      from "${projectDir}/src/main/saxon-cs/csproj"
      into "${buildDir}/cs"
      rename { String filename ->
        filename.replace("engine", "SaxonCS")
      }
      filter { line ->
        line.replaceAll("@@optimize@@", csoptimize)
        .replaceAll("@@csrid@@", csrid)
      }
    }
  }
  doLast {
    copy {
      from "${projectDir}/tools/saxon-cs"
      into "${buildDir}/cs"
      include "SaxonCS.sln"
    }
  }

  doLast {
    exec {
      workingDir = "${buildDir}/cs"
      commandLine dotnetex, 'restore', 'SaxonCS.sln', '--verbosity', 'Normal',
        '-p:Configuration=Release', '-p:Platform=Any CPU'
    }
  }

  doLast {
    exec {
      workingDir = "${buildDir}/cs"
      commandLine dotnetex, 'build', 'SaxonCS.sln', '--verbosity', 'Normal',
        '--configuration', 'Release',  '/nodereuse:false', '--no-restore',
        '-p:SelfContained=true', '-p:PublishSingleFile=true',
        "-p:Version=${csver}", "-p:PackageVersion=${csver}",
        '-p:Configuration=Release', '-p:Platform=Any CPU'
    }
  }

  doLast {
    signExe("${buildDir}/cs/bin/Release/net6.0/${csrid}/SaxonCS.dll")
    if (systemOs.isWindows()) {
      signNuget("${buildDir}/cs/bin/Release/SaxonCS.${csver}.nupkg")
    } else {
      signExe("${buildDir}/cs/bin/Release/SaxonCS.${csver}.nupkg")
    }
  }
}

task copyNuGetPackage(
  dependsOn: ["dotnetRelease"],
  description: "Copy the architecture-independent .nupkg file"
) {
  inputs.file "${buildDir}/cs/bin/Release/SaxonCS.${csver}.nupkg"
  outputs.file "${buildDir}/distributions/SaxonCS.${csver}.nupkg"

  // This only works on the build/release machine, Wynngifu.
  def nugetsign = new File("/Users/norm/bin/nuget.exe").exists()

  doLast {
    if (nugetsign && jarsigner.makeSignedExes) {
      println("Creating signed NuGet package")
      exec {
        commandLine "/Users/norm/bin/nuget.exe", "sign",
          "${buildDir}\\cs\\bin\\Release\\SaxonCS.${csver}.nupkg",
          "-CertificatePath", "C:\\Users\\norm\\java\\saxonica_certificate.pfx",
          "-Timestamper", "http://timestamp.digicert.com",
          "-OutputDirectory", "${buildDir}\\distributions",
          "-Verbosity", "detailed", "-CertificatePassword",
          project.findProperty("saxonSignPassword")
      }
    } else {
      println("Creating UNSIGNED NuGet package")
      copy {
        from "${buildDir}/cs/bin/Release"
        into "${buildDir}/distributions"
        include "SaxonCS.${csver}.nupkg"
      }
    }
  }
}
dotnetRelease.finalizedBy copyNuGetPackage

task pushNuGetPackage(
  dependsOn: ["dotnetRelease", "copyNuGetPackage"],
  description: "Publish the NuGet package on nuget.org"
) {
  inputs.file "${buildDir}/distributions/SaxonCS.${csver}.nupkg"

  doLast {
    exec {
      commandLine "dotnet", "nuget", "push",
         "${buildDir}/distributions/SaxonCS.${csver}.nupkg",
         "-k", project.findProperty("nugetApiKey"),
         "-s", project.findProperty("nugetSource")
    }
  }
}

task dotnetPublish(
  dependsOn: ['dotnetRelease']
) {
  inputs.file "${buildDir}/cs/bin/Release/net6.0/${csrid}/SaxonCS.dll"
  outputs.files fileTree(dir: "${buildDir}/cs/bin/Release/net6.0/${csrid}/publish")

  def singleFile="true"
  if (systemOs.isMacOsX()) {
    singleFile="true"
  }

  doLast {
    exec {
      workingDir = "${buildDir}/cs"
      commandLine dotnetex, 'publish', 'SaxonCS.sln',
        '--configuration', 'Release', '-r', csrid,
        '--self-contained', 'true',
        "-p:PublishSingleFile=${singleFile}",
        "-p:Version=${csver}", "-p:PackageVersion=${csver}",
        '-p:Configuration=Release', '-p:Platform=Any CPU'
    }
  }
  doLast {
    println("Published SaxonCS release for ${csplatform}")
  }

/*
  doLast {
    signExe("${buildDir}/cs/bin/Release/net6.0/${csrid}/publish/SaxonCS", true)
  }
*/
}

task dotnetMakeApp(
  dependsOn: ['dotnetPublish'],
) {
  doLast {
    exec {
      workingDir "${buildDir}/cs"
      commandLine dotnetex, 'msbuild', '-t:BundleApp', '-p:Configuration=Release', 'SaxonCS.csproj'
    }
  }

  doLast {
    exec {
      workingDir "${buildDir}/cs"
      commandLine 'codesign', '--force', '--options', 'runtime',
        '--entitlements', "${projectDir}/tools/saxon-cs/entitlements.plist",
        '--deep', '--sign', 'Developer ID Application: Saxonica Limited',
        '--timestamp', "bin/Release/net6.0/${csrid}/publish/SaxonCS.app"
    }
  }
}

task dotnetPublishZip(
  dependsOn: ['dotnetPublish'],
  type: Zip
) {
  doFirst {
    copy {
      into "${buildDir}/cs/bin/Release/net6.0/${csrid}/publish/doc"
      from "${projectDir}/src/docs/doc"
    }
  }

  archiveFileName = "SaxonCS-${csver.replaceAll("\\.", "-")}-${csplatform}.zip"
  from "${buildDir}/cs/bin/Release/net6.0/${csrid}/publish"
  into "/SaxonCS-${saxonVersion}/"
}

task dotnetArchive(
  dependsOn: ["dotnetRelease", "dotnetTestDrivers", "dotnetExamples"],
  description: "Archives the generated CS sources"
) {
  doLast {
    copy {
      from "${buildDir}/cs/"
      into "${projectDir}/src/archive/csharp/build/cs"
      exclude "bin/**"
      exclude "obj/**"
    }
    copy {
      from "${projectDir}/src/main/saxon-cs/"
      into "${projectDir}/src/archive/csharp/src/main/saxon-cs/"
      exclude "not-yet-needed/**"
    }
    copy {
      from "${buildDir}/testdrivers/"
      into "${projectDir}/src/archive/csharp/build/testdrivers/"
      exclude "bin/**"
      exclude "obj/**"
    }
    copy {
      from "${projectDir}/src/test/cstestrunner/"
      into "${projectDir}/src/archive/csharp/src/test/cstestrunner/"
    }
    copy {
      from "${buildDir}/examples/"
      into "${projectDir}/src/archive/csharp/build/examples/"
      exclude "bin/**"
      exclude "obj/**"
    }
    copy {
      from "${projectDir}/src/samples/cs/"
      into "${projectDir}/src/archive/csharp/src/samples/cs/"
    }
  }
}

task eecs_hello_world(
  dependsOn: ["eecs_dll"],
  description: "Execute a Hello World query"
) {
  doLast {
    if (dotnetex == null) {
      throw new GradleException("Cannot run: failed to find dotnet[.exe] on path.")
    }

    exec {
        workingDir = "${buildDir}/csout"
        commandLine dotnetex, "engine.dll", "query", "-qs:'Hello World at ' || current-dateTime()", "-t" 
    }
  }
}
