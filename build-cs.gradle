task hecs_preprocess(
  type: JavaExec,
  dependsOn: ["hecs_setupPreprocess"],
  description: "Preprocess HE sources"
) {
  inputs.files fileTree(dir: "${buildDir}/filtered/hecs")
  outputs.files fileTree(dir: "${buildDir}/preprocess/hecs")
  classpath = configurations.preprocessor
  main = "com.igormaznitsa.jcp.JcpPreprocessor"
  args "/c",
    "/i:${buildDir}/filtered/hecs", "/o:${buildDir}/preprocess/hecs",
    "/p:EE=false", "/p:PE=false", "/p:DOTNET=true",
    "/p:SAXONC=false", "/p:BYTECODE=false", "/p:CSHARP=true"
  doFirst {
    mkdir "${buildDir}/preprocess/hecs"
  }
}

