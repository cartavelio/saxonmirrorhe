task hecs_sources(
  type: Copy,
  dependsOn: ["hecs_preprocess"],
  description: "Collect the preprocessed HE sources for compilation"
) {
  from "${buildDir}/preprocess/hecs"
  into "${buildDir}/src/hecs"
  filter { line ->
    if (line.contains("import com.saxonica")
        || line.contains("import net.sf.saxon.stax")
        || line.contains("import net.sf.saxon.jaxp")
        || line.contains("net.sf.saxon.xpath.JAXPXPathStaticContext")) {
      null    
    } else if (line.contains("//C#//")) {
      line.replace("//C#//", "")
    } else {
      line
    } 
  }
}

task pecs_sources(
  type: Copy,
  dependsOn: ["pecs_preprocess"],
  description: "Collect the preprocessed PE sources for compilation"
) {
  from "${buildDir}/preprocess/pecs"
  into "${buildDir}/src/pecs"
  filter { line ->
    if (line.contains("import com.saxonica.ee")
        || line.contains("import com.saxonica.config.ee")
        || line.contains("net.sf.saxon.xpath.JAXPXPathStaticContext")
        || line.contains("import net.sf.saxon.stax")
        || line.contains("import net.sf.saxon.jaxp")) {
      null
    } else {
      line
    }
  }
}

task eecs_sources(
  type: Copy,
  dependsOn: ["eecs_preprocess"],
  description: "Collect the preprocessed EE sources for compilation"
) {
  from "${buildDir}/preprocess/eecs"
  into "${buildDir}/src/eecs"
  filter { line ->
    if (line.contains("net.sf.saxon.xpath.JAXPXPathStaticContext")
        || line.contains("import com.saxonica.ee.jaxp.SchemaFactoryImpl")
        || line.contains("import net.sf.saxon.stax")
        || line.contains("import net.sf.saxon.jaxp")) {
      null
    } else {
      line
    }
  }
}

  task hecs_dll(
    dependsOn: ["generateCSharp"],
    description: "Compile Saxon-CS DLL for HE"
  ) {
    inputs.files("${buildDir}/src/hecs")
    outputs.file("${buildDir}/cs/bin/he/saxon-cs-${saxonMajorVersion}.${saxonMinorVersion}.dll")

    doLast {
      def args = [csharpCompiler,
                  "-out:${buildDir}/cs/bin/he/saxon-cs-${saxonMajorVersion}.${saxonMinorVersion}.dll",
                  "-target:library", 
                  "-doc:${buildDir}/cs/saxon-he-api-${saxonMajorVersion}.${saxonMinorVersion}.xml",
                  "-keyfile:${ikvmDir}/saxondotnet.snk"]
      //fileTree(dir: "${buildDir}/n/bin/he",
      //         include: "*.dll").each { dll ->
      //  args += ["-reference:${dll}"]
      //}
      fileTree(dir: "${buildDir}/cs/net",
               include: "**/*.cs").each { cs ->
        args += [cs]
      }
      fileTree(dir: "${projectDir}/src/main/saxon-cs/engine",
               include: "**/*.cs").each { cs ->
        args += [cs]
      }
      fileTree(dir: "${projectDir}/src/main/saxon-cs/javaglue",
               include: "**/*.cs").each { cs ->
        args += [cs]
      }

      exec {
        commandLine args
      }
    }
  }

  task hecs_exe_Transform(
    dependsOn: ["hecs_dll"],
    description: "Compile Transform.exe for Saxon-CS HE"
  ) {
    inputs.files("${buildDir}/src/hecs")
    inputs.files("${buildDir}/cs/bin/he/saxon-cs-${saxonMajorVersion}.${saxonMinorVersion}.dll")
    outputs.file("${buildDir}/cs/bin/he/Transform.exe")

    doLast {
      def args = [csharpCompiler,
                  "-out:${buildDir}/cs/bin/he/Transform.exe",
                  "-target:exe",
                  "-keyfile:${ikvmDir}/saxondotnet.snk"]
      fileTree(dir: "${buildDir}/cs/bin/he",
               include: "*.dll").each { dll ->
        args += ["-reference:${dll}"]
      }
      args += ["${buildDir}/cs/csharp\\cmd\\Transform.cs",
               "${buildDir}\\n\\csharp\\cmd\\AssemblyInfo.cs"]

      exec {
        commandLine args
      }
    }
  }

  task hen_csharpQuery(
    dependsOn: ["hecs_dll"],
    description: "Compile Query.exe for HE"
  ) {
    inputs.files("${buildDir}/n/build/dll/he")
    inputs.files("${buildDir}/n/csharp/cmd")
    outputs.file("${buildDir}/n/bin/he/Query.exe")

    doLast {
      def args = [csharpCompiler,
                  "-out:${buildDir}/n/bin/he/Query.exe",
                  "-target:exe",
                  "-keyfile:${ikvmDir}/saxondotnet.snk"]
      fileTree(dir: "${buildDir}/n/bin/he",
               include: "*.dll").each { dll ->
        args += ["-reference:${dll}"]
      }
      // This only runs on Windows, so make sure you use "\"
      args += ["${buildDir}\\n\\csharp\\cmd\\Query.cs",
               "${buildDir}\\n\\csharp\\cmd\\AssemblyInfo.cs"]

      exec {
        commandLine args
      }
    }
  }

