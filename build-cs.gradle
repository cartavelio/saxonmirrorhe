task hecs_sources(
  type: Copy,
  dependsOn: ["hecs_preprocess"],
  description: "Collect the preprocessed HE sources for compilation"
) {
  from "${buildDir}/preprocess/hecs"
  into "${buildDir}/src/hecs"
  filter { line ->
    if (line.contains("import com.saxonica")
        || line.contains("import net.sf.saxon.stax")
        || line.contains("import net.sf.saxon.jaxp")
        || line.contains("net.sf.saxon.xpath.JAXPXPathStaticContext")) {
      null    
    //} else if (line.contains("//C#//")) {
    //  line.replace("//C#//(.*)$", "net.sf.saxon.transpile.CSharp.emitCode()")
    } else {
      line
    } 
  }
  doFirst {
    mkdir "${buildDir}/src/hecs"
  }
}

task pecs_sources(
  type: Copy,
  dependsOn: ["pecs_preprocess"],
  description: "Collect the preprocessed PE sources for compilation"
) {
  from "${buildDir}/preprocess/pecs"
  into "${buildDir}/src/pecs"
  filter { line ->
    if (line.contains("import com.saxonica.ee")
        || line.contains("import com.saxonica.config.ee")
        || line.contains("net.sf.saxon.xpath.JAXPXPathStaticContext")
        || line.contains("import net.sf.saxon.stax")
        || line.contains("import net.sf.saxon.jaxp")) {
      null
    } else {
      line
    }
  }
  doFirst {
    mkdir "${buildDir}/src/pecs"
  }
}

task eecs_sources(
  type: Copy,
  dependsOn: ["eecs_preprocess"],
  description: "Collect the preprocessed EE sources for compilation"
) {
  from "${buildDir}/preprocess/eecs"
  into "${buildDir}/src/eecs"
  filter { line ->
    if (line.contains("net.sf.saxon.xpath.JAXPXPathStaticContext")
        || line.contains("import com.saxonica.ee.jaxp.SchemaFactoryImpl")
        || line.contains("import net.sf.saxon.stax")
        || line.contains("import net.sf.saxon.jaxp")) {
      null
    } else {
      line
    }
  }
  doFirst {
    mkdir "${buildDir}/src/eecs"
  }
}

task build_transpiler(
  type: JavaCompile,
  dependsOn: ["hecs_featureKeys", "eejJar"],
  description: "Compile the ToXml transpiler}"
) {
  inputs.files fileTree(dir: "${projectDir}/tools/transpiler/src")
  outputs.files fileTree(dir: "${buildDir}/transpiler")
  source("${projectDir}/tools/transpiler/src/ToXml.java")
  source("${projectDir}/tools/transpiler/src/XmlPrinterMHK.java")
  classpath = configurations.transpiler
  destinationDirectory = new File("${buildDir}/transpiler")
  doFirst {
    mkdir("build")
  }
}

task hecs_transpile_to_xml(
  type: JavaExec,
  dependsOn: ["hecs_sources", "build_transpiler"],
  description: "Transpile the HECS Java to XML"
) {
  inputs.files fileTree(dir: "${buildDir}/src/hecs")
  outputs.files fileTree(dir: "${buildDir}/he_xmlout")
  classpath = configurations.transpiler
  main = "ToXml"
  args "-j:${buildDir}/src/hecs",
    "-xml:${buildDir}/he_xmlout",
    "-h:${projectDir}/src/main/java"
    "-src:${projectDir}/src/main/java"
  doFirst {
    mkdir("${buildDir}/he_xmlout")
  }
}

task eecs_transpile_to_xml(
  type: JavaExec,
  dependsOn: ["eecs_sources", "build_transpiler"],
  description: "Transpile the EECS Java to XML"
) {
  inputs.files fileTree(dir: "${buildDir}/src/eecs")
  outputs.files fileTree(dir: "${buildDir}/ee_xmlout")
  classpath = configurations.transpiler
  main = "ToXml"
  args "-j:${buildDir}/src/eecs",
    "-xml:${buildDir}/ee_xmlout",
    "-h:${projectDir}/src/main/java"
    "-src:${projectDir}/src/main/java"
  doFirst {
    mkdir("${buildDir}/ee_xmlout")
  }
}


task hecs_xml_digest(
  type: JavaExec,
  dependsOn: ["hecs_transpile_to_xml"],
  description: "Make a digest of the transpiled XML for HECS"
) {
  inputs.files fileTree(dir: "${buildDir}/he_xmlout")
  inputs.files fileTree(dir: "${projectDir}/tools/transpiler/xslt")
  inputs.file "${projectDir}/tools/transpiler/xslt/xml-to-digest.xsl"
  outputs.files "${buildDir}/he_digest.xml"
  classpath = configurations.preprocessor
  main = "net.sf.saxon.Transform"
  args "-it",
    "-xsl:${projectDir}/tools/transpiler/xslt/xml-to-digest.xsl",
    "-o:${buildDir}/he_digest.xml",
    "xmlDir=../../../build/he_xmlout"
}

task eecs_xml_digest(
  type: JavaExec,
  dependsOn: ["eecs_transpile_to_xml"],
  description: "Make a digest of the transpiled XML for EECS"
) {
  inputs.files fileTree(dir: "${buildDir}/ee_xmlout")
  inputs.files fileTree(dir: "${projectDir}/tools/transpiler/xslt")
  inputs.file "${projectDir}/tools/transpiler/xslt/xml-to-digest.xsl"
  outputs.files "${buildDir}/ee_digest.xml"
  classpath = configurations.preprocessor
  main = "net.sf.saxon.Transform"
  args "-it",
    "-xsl:${projectDir}/tools/transpiler/xslt/xml-to-digest.xsl",
    "-o:${buildDir}/ee_digest.xml",
    "xmlDir=../../../build/ee_xmlout"
}

task hecs_refine_digest(
  type: JavaExec,
  dependsOn: ["hecs_xml_digest"],
  description: "Refine the digest of the transpiled XML for HECS"
) {
  inputs.file "${buildDir}/he_digest.xml"
  inputs.file "${projectDir}/tools/transpiler/xslt/refine-digest.xsl"
  outputs.files "${buildDir}/he_refined-digest.xml"
  classpath = configurations.preprocessor
  main = "net.sf.saxon.Transform"
  args "-xsl:${projectDir}/tools/transpiler/xslt/refine-digest.xsl",
    "-s:${buildDir}/he_digest.xml",
    "-o:${buildDir}/he_refined-digest.xml",
    "xmlDir=${buildDir}/he_xmlout"
}

task eecs_refine_digest(
  type: JavaExec,
  dependsOn: ["eecs_xml_digest"],
  description: "Refine the digest of the transpiled XML for EECS"
) {
  inputs.file "${buildDir}/ee_digest.xml"
  inputs.file "${projectDir}/tools/transpiler/xslt/refine-digest.xsl"
  outputs.files "${buildDir}/ee_refined-digest.xml"
  classpath = configurations.preprocessor
  main = "net.sf.saxon.Transform"
  args "-xsl:${projectDir}/tools/transpiler/xslt/refine-digest.xsl",
    "-s:${buildDir}/ee_digest.xml",
    "-o:${buildDir}/ee_refined-digest.xml",
    "xmlDir=${buildDir}/ee_xmlout"
}


task hecs_generateCSharp(
  type: JavaExec,
  dependsOn: ["hecs_refine_digest"],
  description: "Create the CS files for HE"
) {
  inputs.file "${buildDir}/he_refined-digest.xml"
  inputs.files fileTree(dir: "${projectDir}/tools/transpiler/xslt")
  outputs.files fileTree(dir: "${buildDir}/cs")
  classpath = configurations.transpiler
  main = "ToXml"
  args "-cs:${buildDir}/cs",
    "-xml:${buildDir}/he_xmlout",
    "-digest:${buildDir}/he_refined-digest.xml",
    "-debug"
  doFirst {
    mkdir("${buildDir}/cs")
  }
}

task eecs_generateCSharp(
  type: JavaExec,
  dependsOn: ["eecs_refine_digest"],
  description: "Create the CS files for EE"
) {
  inputs.file "${buildDir}/ee_refined-digest.xml"
  inputs.files fileTree(dir: "${projectDir}/tools/transpiler/xslt")
  outputs.files fileTree(dir: "${buildDir}/cs")
  classpath = configurations.transpiler
  main = "ToXml"
  args "-cs:${buildDir}/cs",
    "-xml:${buildDir}/ee_xmlout",
    "-digest:${buildDir}/ee_refined-digest.xml",
    "-debug"
  doFirst {
    mkdir("${buildDir}/cs")
  }
}


task hecs_project_files (
  type: Copy,
  dependsOn: ["hecs_generateCSharp"],
  description: "Prepare the project files used for HECS build"
) {
  from "src/main/saxon-cs/csproj"
  into "${buildDir}/cs"
  include "*.csproj"
}

task eecs_project_files (
  type: Copy,
  dependsOn: ["eecs_generateCSharp"],
  description: "Prepare the project files used for EECS build"
) {
  from "src/main/saxon-cs/csproj"
  into "${buildDir}/cs"
  include "*.csproj"
}


task hecs_dll(
  dependsOn: ["hecs_project_files"],
  description: "Compile Saxon-CS DLL for HE"
) {
  doLast {
    if (dotnet == null) {
      throw new GradleException("Cannot build: failed to find dotnet[.exe] on path.")
    }

    exec {
        workingDir = "${buildDir}/cs"
        commandLine dotnet, 'build', '--nologo', '-o', '../csout', 'engine.csproj'
    }
  }
}

task eecs_dll(
  dependsOn: ["eecs_project_files"],
  description: "Compile Saxon-CS DLL for EE"
) {
  doLast {
    if (dotnet == null) {
      throw new GradleException("Cannot build: failed to find dotnet[.exe] on path.")
    }

    exec {
        workingDir = "${buildDir}/cs"
        commandLine dotnet, 'build', '--nologo', '-o', '../csout', 'engine.csproj'
    }
  }
}

task hecs_hello_world(
  dependsOn: ["hecs_dll"],
  description: "Execute a Hello World query"
) {
  doLast {
    if (dotnet == null) {
      throw new GradleException("Cannot run: failed to find dotnet[.exe] on path.")
    }

    exec {
        workingDir = "${buildDir}/csout"
        commandLine dotnet, "engine.dll", "query", "-qs:'Hello World'", "-t" 
    }
  }
}

task eecs_hello_world(
  dependsOn: ["eecs_dll"],
  description: "Execute a Hello World query"
