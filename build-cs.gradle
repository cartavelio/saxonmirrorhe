// Find C# compiler: the first path that exists in this list
// will be used as the C# compiler.
//
def csharpCompiler = null
["C:/Windows/Microsoft.net/Framework/${dotNetFrameworkVersion}/csc.exe",
 "/Library/Frameworks/Mono.framework/Versions/Current/Commands/csc"].each { csc ->
  // This only makes sense on Windows, so always using file:/// is ok
  if (csharpCompiler == null && pathExists(csc)) {
    csharpCompiler = csc
  }
}

task build_transpiler(
  type: JavaCompile,
  dependsOn: ["hecs_featureKeys", "hejJar"],
  description: "Compile the ToXml transpiler}"
) {
  inputs.files fileTree(dir: "${projectDir}/tools/transpiler/src")
  outputs.files fileTree(dir: "${buildDir}/transpiler")
  source("${projectDir}/tools/transpiler/src/ToXml.java")
  source("${projectDir}/tools/transpiler/src/XmlPrinterMHK.java")
  classpath = configurations.transpiler
  destinationDirectory = new File("${buildDir}/transpiler")
  doFirst {
    mkdir("build")
  }
}

task transpile_to_xml(
  type: JavaExec,
  dependsOn: ["hecs_preprocess", "build_transpiler"],
  description: "Transpile the Java to XML"
) {
  inputs.files fileTree(dir: "${buildDir}/preprocess/hecs")
  outputs.files fileTree(dir: "${buildDir}/xmlout")
  classpath = configurations.transpiler
  main = "ToXml"
  args "-j:${buildDir}/preprocess/hecs",
    "-xml:${buildDir}/xmlout",
    "-src:${projectDir}/src/main/java"
  doFirst {
    mkdir("${buildDir}/xmlout")
  }
}

task xml_digest(
  type: JavaExec,
  dependsOn: ["transpile_to_xml"],
  description: "Make a digest of the transpiled XML"
) {
  inputs.files fileTree(dir: "${buildDir}/xmlout")
  inputs.files fileTree(dir: "${projectDir}/tools/transpiler/xslt")
  inputs.file "${projectDir}/tools/transpiler/xslt/xml-to-digest.xsl"
  outputs.files "${buildDir}/digest.xml"
  classpath = configurations.preprocessor
  main = "net.sf.saxon.Transform"
  args "-it",
    "-xsl:${projectDir}/tools/transpiler/xslt/xml-to-digest.xsl",
    "-o:${buildDir}/digest.xml",
    "xmlDir=../../../build/xmlout"
}

task refine_digest(
  type: JavaExec,
  dependsOn: ["xml_digest"],
  description: "Refine the digest of the transpiled XML"
) {
  inputs.file "${buildDir}/digest.xml"
  inputs.file "${projectDir}/tools/transpiler/xslt/refine-digest.xsl"
  outputs.files "${buildDir}/refined-digest.xml"
  classpath = configurations.preprocessor
  main = "net.sf.saxon.Transform"
  args "-xsl:${projectDir}/tools/transpiler/xslt/refine-digest.xsl",
    "-s:${buildDir}/digest.xml",
    "-o:${buildDir}/refined-digest.xml",
    "xmlDir=${buildDir}/xmlout"
}

task generateCSharp(
  type: JavaExec,
  dependsOn: ["refine_digest"],
  description: "Create the CS files"
) {
  inputs.file "${buildDir}/refined-digest.xml"
  inputs.files fileTree(dir: "${projectDir}/tools/transpiler/xslt")
  outputs.files fileTree(dir: "${buildDir}/cs")
  classpath = configurations.transpiler
  main = "ToXml"
  args "-cs:${buildDir}/cs",
    "-xml:${buildDir}/xmlout",
    "-digest:${buildDir}/refined-digest.xml",
    "-debug"
  doFirst {
    mkdir("${buildDir}/cs")
  }
}

task hecs_featureKeys(
  type: JavaExec,
  description: "Construct the feature keys for HE"
) {
  inputs.files fileTree(dir: "${projectDir}/tools/featureKeys")
  outputs.file "${projectDir}/src/main/saxon-cs/engine/Saxon/Api/Feature.cs"
  outputs.file "${projectDir}/src/main/saxon-cs/engine/Saxon/Api/FeatureKeys.cs"
  classpath = configurations.preprocessor
  main = "net.sf.saxon.Transform"
  args "${projectDir}/tools/featureKeys/FeatureKeys.xml",
    "-xsl:${projectDir}/tools/featureKeys/FeatureKeysForSaxonCS.xsl",
    "-o:${projectDir}/src/main/saxon-cs/engine/Saxon/Api/establish-an-output-base-uri"
}

