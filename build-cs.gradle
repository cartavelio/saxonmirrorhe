  description: "Construct the feature keys for Saxon-CS"
) {
  // Task name is misleading: the output is used unchanged for HE and PE
  inputs.files fileTree(dir: "${projectDir}/tools/featureKeys")
  outputs.file "${projectDir}/src/main/saxon-cs/engine/Saxon/Api/Feature.cs"
  outputs.file "${projectDir}/src/main/saxon-cs/engine/Saxon/Api/FeatureKeys.cs"
  classpath = configurations.preprocessor
  main = "net.sf.saxon.Transform"
  args "${projectDir}/tools/featureKeys/FeatureKeys.xml",
    "-xsl:${projectDir}/tools/featureKeys/FeatureKeysForSaxonCS.xsl",
    "-o:${projectDir}/src/main/saxon-cs/engine/Saxon/Api/establish-an-output-base-uri"
}

