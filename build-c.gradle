// Find Excelsior Jet to build the SaxonC releases
def excelsiorJetHome = null
["${excelsiorJet}",
 "/opt/jet15.3-ent-amd64",
 "/usr/local/jet15.3-ent-amd64",
 "/usr/local/jet15.3-ent-x86",
 "/usr/local/jet",
 "c:/jet15.3-ent-amd64",
 "c:/jet15.3-ent-x86"].each { jet ->
  if (excelsiorJetHome == null && jet != "" && pathExists(jet)) {
    excelsiorJetHome = jet
  }
}

task test_jetHome(
  description: "Test that excelsiorJetHome is configured"
) {
  doLast {
    if (excelsiorJetHome == null) {
      throw new GradleException("Cannot build SaxonC, cannot find ExcelsiorJet")
    } else {
      println("Running ExcelsiorJet from ${excelsiorJetHome}")
    }
  }
}

// ============================================================
// Tasks to rejar ICU

task unjar_ICU4jJar(
  type: Copy,
  description: "Unjar ICU"
) {
  inputs.file(icu4jJar)
  outputs.files(fileTree("${buildDir}/icu"))
  from zipTree(file(icu4jJar))
  into "${buildDir}/icu"
}

// ============================================================
// Tasks to rejar Xerces and XML Resolver

task unjar_XercesImpl(
  type: Copy,
  description: "Unjar XercesImpl"
) {
  inputs.file("lib/xercesImpl.jar")
  outputs.files(fileTree("${buildDir}/xerces/org/apache/xerces"))
  from zipTree(file("lib/xercesImpl.jar"))
  into "${buildDir}/xerces"
}

task unjar_XmlResolver(
  type: Copy,
  description: "Unjar XML Resolver"
) {
  inputs.file(resolverJar)
  from zipTree(file(resolverJar))
  into "${buildDir}/xerces"
}
// This task is always out of date because we're overwriting
// files from different jars.
// Skip this if it doesn't seem to be necessary
unjar_XmlResolver.onlyIf {
  !file("${buildDir}/xerces/org/xmlresolver/XMLCatalogResolver.class").exists()
}

task unjar_XmlResolverData(
  type: Copy,
  description: "Unjar XML Resolver data"
) {
  inputs.file(resolverDataJar)
  from zipTree(file(resolverDataJar))
  into "${buildDir}/xerces"
}
// This task is always out of date because we're overwriting
// files from different jars.
// Skip this if it doesn't seem to be necessary
unjar_XmlResolver.onlyIf {
  !file("${buildDir}/xerces/org/xmlresolver/cat-xhtml.xml").exists()
}

task rejar_Xerces(
  type: Jar,
  dependsOn: ["unjar_XercesImpl", "unjar_XmlResolver", "unjar_XmlResolverData"],
  description: "Unjar Xerces and Resolver for .NET build"
) {
  inputs.files fileTree("${buildDir}/xerces/org")
  outputs.file "${buildDir}/xerces/xerces.jar"
  archiveBaseName = "xerces"
  destinationDirectory = file("${buildDir}/xerces")
  from ("${buildDir}/xerces") {
    include "**/*.class"
    include "**/*.properties"
    exclude "org.w3c.dom.html.HTMLDOMImplementation.class"
    exclude "META-INF/MANIFEST.MF"
  }
}

// ============================================================

["h", "p", "e"].each { initial ->
  def release = initial + "e"
  def Release = initial.toUpperCase() + "e"
  def RELEASE = release.toUpperCase()

  task "${release}c_copyJet"(
    type: Copy,
    dependsOn: ["${release}c_jar", "${release}c_copyAncillary"],
    description: "Copy the JET project file for ${RELEASE}"
  ) {
    from "${projectDir}/src/jet/libsaxon${release}c.prj"
    into "${buildDir}/jet"
  }

  task "${release}c_setupJet"(
    dependsOn: ["${release}c_copyJet"],
    description: "Create JET libsaxon${release}c.jprof for ${RELEASE}"
  ) {
    outputs.file("${buildDir}/jet/libsaxon${release}c.jprof")
    doLast {
      new File("${buildDir}/jet/libsaxon${release}c.jprof")
        .withWriter("utf-8") { writer ->
          writer.write("")
        }
    }
  }

  task "${release}c_copyLibs"(
    type: Copy,
    description: "Copy library jar files into JET build directory"
  ) {
    into "${buildDir}/c/jars/${release}c"
    from "${resolverJar}"
    from "${mailJar}"
  }

  task "${release}c_jet"(
    dependsOn: ["${release}c_setupJet", "${release}c_copyLibs", "test_jetHome"],
    description: "Run JET on ${RELEASE}"
  ) {
    inputs.file("${buildDir}/jet/libsaxon${release}c.prj")
    inputs.file("${buildDir}/jet/libsaxon${release}c.jprof")
    inputs.files("${buildDir}/c/jars/${release}c")
    outputs.file("${buildDir}/c/${release}c/libsaxon${release}c.so")

    doLast {
      exec {
	workingDir "${buildDir}/jet"
        commandLine "${excelsiorJetHome}/bin/jc",
          "=p", "libsaxon${release}c"
      }
    }
  }

  task "${release}c_copyCommonAncillaryFiles"(
    description: "Copy ancillary C files common to all architectures into the ${RELEASE} release build directory"
  ) {
    doLast {
      copy {
        into "${buildDir}/c/${release}c"
        from("${projectDir}/src/main/c") {
          include "Saxon.C.API/*.h"
          include "Saxon.C.API/*.c"
          include "Saxon.C.API/*.cpp"
          include "Saxon.C.API/jni/**/*.h"
          include "Saxon.C.API/readme.md"
          exclude "Saxon.C.API/config.m4"
          exclude "Saxon.C.API/SaxonCGlue.c"
          exclude "Saxon.C.API/Makefile"
          exclude "Saxon.C.API/PHP7-Build/config.m4"
          exclude "Saxon.C.API/PHP7-Build/config.w32"
          exclude "Saxon.C.API/config.h"
          exclude "Saxon.C.API/config.w32"
          exclude "Saxon.C.API/dllmain.cpp"
          exclude "Saxon.C.API/readme.txt"
          exclude "Saxon.C.API/targetver.h"
          include "Saxon.C.API/python-saxon/*.py"
          include "Saxon.C.API/python-saxon/cat.xml"
          include "Saxon.C.API/python-saxon/test.xsl"
          include "Saxon.C.API/python-saxon/*.pxd"
          include "Saxon.C.API/python-saxon/*.pyx"
          include "Saxon.C.API/python-saxon/readme.txt"
          include "samples/cppTests/*.cpp"
          include "samples/cppTests/*.h"
          include "samples/cTests/*.h"
          include "samples/cTests/*.c"
          include "samples/php/*.php"
          include "samples/php/xsl/**/*"
          include "samples/php/xml/**/*"
          include "samples/php/query/*"
          include "samples/php/trax/**/*"
          exclude "samples/cppTests/build*"
          exclude "samples/cppTests/bin"
          exclude "samples/cppTests/build64-mac.sh"
          exclude "samples/cppTests/build32-linux.sh"
          exclude "samples/cppTests/build64-linux.sh"
          exclude "samples/cppTests/buildCPPSaxonEE.bat"
          exclude "samples/cppTests/buildCPPSaxonHE.bat"
          exclude "samples/cppTests/buildCPPSaxonPE.bat"
          exclude "samples/cppTests/buildpec.sh"
          exclude "samples/cTests/build-linux.sh"
          exclude "samples/cTests/build.sh"
          exclude "samples/cTests/build64-linux.sh"
          exclude "samples/cTests/buildhec.sh"
          exclude "samples/cTests/buildpec.sh"
          include "samples/data/**/*"
          exclude "samples/data/config_file.xml"
          exclude "samples/data/package*"
          include "saxon-data/**/*"
          include "command/*.c"
          include "command/jni/**/*"
        }
        filter { line ->
          line.replaceAll("@@VERSION@@", saxonVersion)
        }
      }

      copy {
        into "${buildDir}/c/${release}c"
        from("${projectDir}/src/docs") {
          include "notices/JAMESCLARK.txt"
          include "notices/CERN.txt"
          include "notices/LICENSE.txt"
        }
      }
    }
  }

  if (systemOs.isWindows()) {
    task "${release}c_copyAncillary"(
      description: "Copy ancillary C files for Windows into the ${RELEASE} release build directory",
      dependsOn: ["${release}c_copyCommonAncillaryFiles"]
    ) {
      doLast {
        copy {
          into "${buildDir}/c/${release}c/Saxon.C.API"
          from("${projectDir}/src/main/c/Saxon.C.API") {
            include "SaxonCGlue.c"
          }
          filter { line ->
            line.replaceAll("@@VERSION@@", saxonVersion)
            .replaceAll("@@release@@", release)
            .replaceAll("@@RELEASE@@", RELEASE)
          }
        }
        copy {
          into "${buildDir}/c/${release}c/Saxon.C.API"
          from("${projectDir}/src/main/c/Saxon.C.API/PHP7-Build/config.w32")
        }
        copy {
          into "${buildDir}/c/${release}c/samples/cppTests"
          from("${projectDir}/src/main/c/samples/cppTests/build-windows.bat")
        }
        copy {
          into "${buildDir}/c/${release}c/command"
          from("${projectDir}/src/main/c/command/build${release}c-command.bat")
        }

      }
    }

    task "${release}cRelease"(
      type: Exec,
      dependsOn: ["${release}c_jet", "${release}c_copyAncillary"],
      description: "Make the ${RELEASE} release for SaxonC"
    ) {
      commandLine "${excelsiorJetHome}/bin/xpack",
        "-backend", "excelsior-installer",
        "-source", "${buildDir}/c/${release}c",
        "-target", "${buildDir}/releases/libsaxon-${RELEASE}C-${saxonVersion}.exe",
        "-company", "Saxonica",
        "-product", "SaxonC ${RELEASE}",
        "-version", saxonVersion
      doLast {
        signExe("${buildDir}/releases/libsaxon-${RELEASE}C-${saxonVersion}.exe")
      }
    }
  } else if (systemOs.isMacOsX()) {
    task "${release}c_copyAncillary"(
      description: "Copy ancillary C files for MacOS into the ${RELEASE} release build directory",
      dependsOn: ["${release}c_copyCommonAncillaryFiles"]
    ) {
      doLast {
        copy {
          into "${buildDir}/c/${release}c/Saxon.C.API"
          from("${projectDir}/src/main/c/Saxon.C.API") {
            include "SaxonCGlue.c"
          }
          filter { line ->
            line.replaceAll("@@VERSION@@", saxonVersion)
            .replaceAll("@@release@@", release)
            .replaceAll("@@RELEASE@@", RELEASE)
          }
        }
        copy {
          into "${buildDir}/c/${release}c/Saxon.C.API"
          from("${projectDir}/src/main/c/Saxon.C.API/PHP7-Build/config.m4")
        }
        copy {
          into "${buildDir}/c/${release}c/samples/cppTests"
          from("${projectDir}/src/main/c/samples/cppTests/build64-mac.sh")
        }
        copy {
          into "${buildDir}/c/${release}c/samples/cTests"
          from("${projectDir}/src/main/c/samples/cTests/build64-mac.sh")
        }
        copy {
          into "${buildDir}/c/${release}c/command"
          from("${projectDir}/src/main/c/command/build${release}c-command.sh")
        }
      }
    }

    task "${release}c_releaseSetup"(
      type: Exec,
      dependsOn: ["${release}c_jet", "${release}c_copyAncillary"],
      description: "Make the ${RELEASE} release package for SaxonC"
    ) {
      commandLine "${excelsiorJetHome}/bin/xpack",
        "-source", "${buildDir}/c/${release}c",
        "-target", "${buildDir}/releases/libsaxon-${RELEASE}C-${saxonVersion}"
    }

    task "${release}cRelease"(
      type: Zip,
      dependsOn: ["${release}c_releaseSetup"],
      description: "Make the ${RELEASE} release ZIP file for SaxonC"
    ) {
      from "${buildDir}/releases/libsaxon-${RELEASE}C-${saxonVersion}"
      into "libsaxon-${RELEASE}C-${saxonVersion}"
      archiveFileName = "libsaxon-${RELEASE}C-mac-setup-v${saxonVersion}.zip"
    }
  } else if (systemOs.isLinux()) {
    task "${release}c_copyAncillary"(
      description: "Copy ancillary C files for Linux into the ${RELEASE} release build directory",
      dependsOn: ["${release}c_copyCommonAncillaryFiles"]
    ) {
      doLast {
        copy {
          into "${buildDir}/c/${release}c/Saxon.C.API"
          from("${projectDir}/src/main/c/Saxon.C.API") {
            include "SaxonCGlue.c"
          }
          filter { line ->
            line.replaceAll("@@VERSION@@", saxonVersion)
            .replaceAll("@@release@@", release)
            .replaceAll("@@RELEASE@@", RELEASE)
          }
        }
        copy {
          into "${buildDir}/c/${release}c/Saxon.C.API"
          from("${projectDir}/src/main/c/Saxon.C.API/PHP7-Build/config.m4")
        }
          copy {
            into "${buildDir}/c/${release}c/samples/cppTests"
            from("${projectDir}/src/main/c/samples/cppTests/build64-linux.sh")
          }
        copy {
          into "${buildDir}/c/${release}c/samples/cTests"
          from("${projectDir}/src/main/c/samples/cTests/build64-linux.sh")
        }
        copy {
          into "${buildDir}/c/${release}c/command"
          from("${projectDir}/src/main/c/command/build${release}c-command.sh")
        }
      }
    }

    task "${release}c_releaseSetup"(
      type: Exec,
      dependsOn: ["${release}c_jet", "${release}c_copyAncillary"],
      description: "Make the ${RELEASE} release package for SaxonC"
    ) {
      commandLine "${excelsiorJetHome}/bin/xpack",
        "-source", "${buildDir}/c/${release}c",
        "-target", "${buildDir}/releases/libsaxon-${RELEASE}C-${saxonVersion}"
    }

    task "${release}cRelease"(
      type: Zip,
      dependsOn: ["${release}c_releaseSetup"],
      description: "Make the ${RELEASE} release ZIP file for SaxonC"
    ) {
      from "${buildDir}/releases/libsaxon-${RELEASE}C-${saxonVersion}"
      into "libsaxon-${RELEASE}C-${saxonVersion}"
      archiveFileName = "libsaxon-${RELEASE}C-setup64-v${saxonVersion}.zip"
    }
  } else {
    throw new GradleException("Unexpected architecture: apprently not Windows, MacOS, or Linux")
  }
}

task hec_setupPreprocess(
  type: Copy,
  dependsOn: ["hej_featureKeys"],
  description: "Copy HE sources for preprocessing HE"
) {
  into "${buildDir}/filtered/hec"
  from("${projectDir}/src/main/java") {
    include "net/sf/saxon/**/*.java"
    include "net/sf/saxon/data/**"
    exclude "javax/xml/xquery/*.java"
    exclude "**/dotnet/**"
    include "net/sf/saxon/**/package.html"
    exclude "net/sf/saxon/testdriver/**"
    exclude "net/sf/saxon/option/axiom/**"
    exclude "net/sf/saxon/option/dom4j/**"
    exclude "net/sf/saxon/option/jdom/**"
    exclude "net/sf/saxon/option/jdom2/**"
    exclude "net/sf/saxon/option/xom/**"
    exclude "net/sf/saxon/option/sql/**"
