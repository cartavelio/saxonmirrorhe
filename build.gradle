// Find dotnet
// Laboriously construct a search path that includes some default locations
// plus the users actual path.
def spath = ["/usr/local/share/dotnet", "/usr/local/share/dotnet/x64"]
System.getenv("PATH").split(System.getProperty("path.separator")).each { dir ->
  spath += [dir]
}
spath.each { dir ->
  if (dotnetex == null) {
    def fn = new File(dir + "/dotnet")
    if (fn.exists() && fn.canExecute()) {
      dotnetex = fn.toString()
    } else {
      fn = new File(dir + "/dotnet.exe")
      if (fn.exists() && fn.canExecute()) {
        dotnetex = fn.toString()
      }
    }
  }
}

if (dotnetex == null) {
  println("WARNING: Failed to find dotnet[.exe]!")
}

// Set saxonLicenseDir in gradle.properties, or from the
// command line if you have a license in some other place.
if (!hasProperty("saxonLicenseDir")) {
  if (System.getenv("SAXON_LICENSE_DIR") != null) {
    ext.saxonLicenseDir=System.getenv('SAXON_LICENSE_DIR')
  } else {
    ext.saxonLicenseDir=System.getenv('HOME') + "/java"
  }
}

println("Building with Java version ${System.getProperty('java.version')}")
println("Expecting Saxon license file to be in ${saxonLicenseDir}")
if (jarsigner.makeSignedJars && jarsigner.makeSignedExes) {
  println("Build is configured to sign jar files and executables")
} else {
  if (jarsigner.makeSignedJars) {
    println("Build is configured to sign jar files")
  } else {
    println("Build is not configured to sign jar files")
    if (project.findProperty("releaseBuild") == "true") {
      throw new GradleException("Release builds must be able to sign jar files")
    }
  }
  if (jarsigner.makeSignedExes) {
    println("Build is configured to sign executable files")
  } else {
    println("Build is not configured to sign executable files")
    if (project.findProperty("releaseBuild") == "true") {
      throw new GradleException("Release builds must be able to sign executable files")
    }
  }
}

