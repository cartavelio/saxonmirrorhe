// The jar Class-Path allows the jar to find dependent libraries
// locally. These are for the libraries we ship with the product.
def heJarClassPath = "lib/xmlresolver-${xmlresolverVersion}.jar lib/xmlresolver.jar "
heJarClassPath += "lib/xmlresolver-${xmlresolverVersion}-data.jar lib/xmlresolverdata-data.jar "
