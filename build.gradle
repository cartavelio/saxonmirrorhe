// ============================================================
// One of the features of Gradle is that you can construct tasks
// dynamically during the "configure" phase. This is a feature because
// it avoids a lot of tedious repetition of nearly identical tasks. It
// has the unfortunate consequence that understanding the tasks
// involved becomes harder. I've tried to use this feature sparingly.

["h", "p", "e"].each { initial ->
  def release = initial + "e"
  def Release = initial.toUpperCase() + "e"
  def RELEASE = release.toUpperCase()

  Task libs = task "${release}j_extras"(
    description: "Copy extra files for the ${RELEASE} release"
  ) {
    doLast {
      copy {
        into "${buildDir}/releases/${release}j/lib"
        from jlineJar
      }
    }
    doLast {
      copy {
        into "${buildDir}/releases/${release}j/lib"
        from resolverJar
      }
    }
    doLast {
      copy {
        into "${buildDir}/releases/${release}j/lib"
        from resolverDataJar
      }
    }
    doLast {
      copy {
        into "${buildDir}/releases/${release}j/doc"
        from "${projectDir}/src/docs/doc"
      }
    }
    doLast {
      copy {
        into "${buildDir}/releases/${release}j/notices"
        from "${projectDir}/src/docs/notices"
        include "JAMESCLARK.txt"
        include "JLINE2.txt"
        include "LICENSE.txt"
      }
    }
    if (release == "pe" || release == "ee") {
      doLast {
        copy {
          into "${buildDir}/releases/${release}j/notices"
          from "${projectDir}/src/docs/notices"
          include "ICU-J.txt"
        }
      }
      doLast {
        copy {
          from "${icu4jJar}"
          into "${buildDir}/releases/${release}j/lib"
        }
      }
    }
    if (release == "ee") {
      doLast {
        copy {
          into "${buildDir}/releases/${release}j/notices"
          from "${projectDir}/src/docs/notices"
          include "ASM.txt"
        }
      }
    }
  }

  task "${release}jZip"(
    type: Zip,
    dependsOn: ["${release}jRelease"]
  ) {
    from "${buildDir}/releases/${release}j"
    archiveFileName = "Saxon${RELEASE}${saxonVersion.replace('.', '-')}J.zip"
  }
}

