task sendriaServerStart() {
  def dockerOk = true

  doFirst {
    try {
      DockerContainer.assertDockerAvailable()
      DockerContainer.assertDockerComposeAvailable()
    } catch (Exception e) {
      dockerOk = false
    }
  }

  doLast {
    if (dockerOk) {
      if (!DockerContainer.running(c_sendria)) {
        try {
          exec {
            workingDir "tools/docker"
            if (DockerContainer.dockerCompose() == "docker") {
              commandLine DockerContainer.docker(),
                "compose", "-f", "sendria-compose.yml",
                "up", "-d", "sendriasmtp"
            } else {
              commandLine DockerContainer.dockerCompose(),
                "-f", "sendria-compose.yml",
                "up", "-d", "sendriasmtp"
            }
          }
        } catch (Exception e) {
          println("***************************************************************")
          println("Failed to start sendriaserver; saxon:send-mail tests will fail.")
          println("***************************************************************")
        }
      }
      try {
        exec {
          commandLine DockerContainer.docker(), "ps", "-a", "--format={{.ID}} {{.Names}} {{.Status}}"
        }
      } catch (Exception e) {
        // nop
      }
    } else {
      println("****************************************************")
      println("Docker unavailable; saxon:send-mail tests will fail.")
      println("***************************************************")
    }
  }
}

task sendriaServerLogs(dependsOn: ["docker-sendria-up"]) {
  def id = "NA"
  doFirst {
    id = DockerContainer.id(c_sendria)
  }
  doLast {
    exec {
      commandLine DockerContainer.docker(), "logs", id
    }
  }
}

task sendriaServerWatch(dependsOn: ["docker-sendria-up"]) {
  def id = "NA"
