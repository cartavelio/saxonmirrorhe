resolverJar = "${fileSeparator}xmlresolver-${xmlresolverVersion}.jar"
resolverDataJar = "${fileSeparator}xmlresolver-${xmlresolverVersion}-data.jar"
configurations.compileClasspath.each { cp ->
  if (cp.toString().endsWith(icu4jJar)) {
    icu4jJar = cp.toString()
  }
  if (cp.toString().endsWith(tagsoupJar)) {
    tagsoupJar = cp.toString()
  }
  if (cp.toString().endsWith(mailJar)) {
    mailJar = cp.toString()
  }
  if (cp.toString().endsWith(resolverJar)) {
    resolverJar = cp.toString()
  }
  if (cp.toString().endsWith(resolverDataJar)) {
    resolverDataJar = cp.toString()
  }
  if (cp.toString().endsWith(jlineJar)) {
    jlineJar = cp.toString()
  }
}

