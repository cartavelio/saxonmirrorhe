// Docker tasks related to running an SQL server

task "docker-sql-up"() {
  doLast {
    DockerContainer.assertRunning(c_sqlserver)
  }
}

task "docker-sql-down"() {
  doLast {
    DockerContainer.assertNotRunning(c_sqlserver)
  }
}

task sqlServerStart(dependsOn: ["docker-sql-up"]) {
  doFirst {
    DockerContainer.assertDockerAvailable()
    DockerContainer.assertDockerComposeAvailable()
    mkdir "${buildDir}/sql/${sqlServer}/data"
  }

  doLast {
    exec {
      workingDir "tools/docker"
      commandLine DockerContainer.dockerCompose(), "--file", "${sqlServer}-compose.yml", "up", "-d"
    }
    exec {
      def id = DockerContainer.containerid(c_sqlserver)
      commandLine "${projectDir}/tools/docker/wait-for-${sqlServer}", id
    }
  }

  if (sqlServer == "mysql") {
    doLast {
      exec {
        def id = DockerContainer.containerid(c_sqlserver)
        commandLine DockerContainer.docker(), "exec", "-i",
          id, "sh", "-c", "mysql --user=root --password=admin < /app/sql/setup.sql"
      }
    }
  } else {
    doLast {
      exec {
        def id = DockerContainer.containerid(c_sqlserver)
        commandLine DockerContainer.docker(), "exec", "-i", "-u", "postgres",
          id, "psql", "-f", "/app/sql/setup.sql"
      }
    }
  }

  doLast {
    exec {
      commandLine DockerContainer.docker(), "ps", "-a", "--format={{.ID}} {{.Names}} {{.Status}}"
    }
  }
}

task sqlServerSetup(dependsOn: ["docker-sql-up"]) {
  doFirst {
    DockerContainer.assertDockerAvailable()
    DockerContainer.assertDockerComposeAvailable()
  }

  if (sqlServer == "mysql") {
    doLast {
      exec {
        def id = DockerContainer.containerid(c_sqlserver)
        commandLine DockerContainer.docker(), "exec", "-i",
          id, "sh", "-c", "mysql --user=root --password=admin < /app/sql/setup.sql"
      }
    }
  } else {
    doLast {
      exec {
        def id = DockerContainer.containerid(c_sqlserver)
        commandLine DockerContainer.docker(), "exec", "-i", "-u", "postgres",
          id, "psql", "-f", "/app/sql/setup.sql"
      }
    }
  }
  doLast {
    exec {
      commandLine DockerContainer.docker(), "ps", "-a", "--format={{.ID}} {{.Names}} {{.Status}}"
    }
  }
}

task sqlServerLogs(dependsOn: ["docker-sql-up"]) {
  def id = "NA"
  doFirst {
    id = DockerContainer.containerid(c_sqlserver)
  }
  doLast {
    exec {
      commandLine DockerContainer.docker(), "logs", id
