// ============================================================
// Some utility functions

def pathExists(pathname) {
  // Returns true iff pathame is an existing file or directory
  try {
    // This may throw an error for a Windows pathname, c:/path/to/thing
    if (file(pathname).exists()) {
      return true;
    }
  } catch (GradleException e) {
    // I don't care
  }

  if (OperatingSystem.current().isWindows()) {
    try {
      // If we're on Windows, try to make c:/path/to/thing work
      if (file("file:///${pathname}").exists()) {
        return true;
      }
    } catch (GradleException e) {
      // I don't care
    }
  }

  return false
}

def copySourceName(File src, String targetDir) {
  // There are lots of preprocessing steps that copy files from
  // src directories to directories under build. This function
  // handles the renaming. Given
  // ${projectDir}/src/main/java/blah/blah/file.ext and out/hej,
  // this function returns
  // ${buildDir}/out/hej/blah/blah/file.ext
  int srcLength = "${projectDir}/src/main/java/".length()
  String base = src.getAbsolutePath().substring(srcLength)
  if (targetDir.endsWith("/")) {
    return new File("${buildDir}/${targetDir}${base}")
  } else {
    return new File("${buildDir}/${targetDir}/${base}")
  }
}

def signJar(String jarfile) {
  // It's convenient to leave this in build.gradle because of the exec closure.
  if (jarsigner.makeSignedJars) {
    println("Signing ${jarfile}...")
    exec {
      commandLine jarsigner.signJarCommand(jarfile)
    }
  }
}

def signExe(String binfile, boolean exefile) {
  // It's convenient to leave this in build.gradle because of the exec closure.
  if (exefile && systemOs.isWindows()) {
    binfile += ".exe"
  }
  if (jarsigner.makeSignedExes) {
    println("Signing ${binfile}...")
    exec {
      commandLine jarsigner.signExeCommand(binfile)
    }
  }
}

def signExe(String binfile) {
  signExe(binfile, false)
}

def signNuget(String nupkgfile) {
  // It's convenient to leave this in build.gradle because of the exec closure.
  if (jarsigner.makeSignedNuget) {
    println("Signing ${nupkgfile}...")
    mkdir "${buildDir}/distributions"
    exec {
      commandLine jarsigner.signNugetCommand(nupkgfile)
    }
  }
}

