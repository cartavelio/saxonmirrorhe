  exclude "**/dotnet/**"
  include "net/sf/saxon/**/package.html"
  exclude "net/sf/saxon/testdriver/**"
  exclude "net/sf/saxon/option/cpp/**"
  exclude "net/sf/saxon/jetonnet/**"
