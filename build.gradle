  include "saxon-pe-${saxonVersion}.jar"
  include "saxon-pe-sql-${saxonVersion}.jar"
  include "saxon-pe-test-${saxonVersion}.jar"
  rename { filename ->
    if (filename.startsWith("saxon-pe-sql")) {
      filename.replace("saxon-pe-sql", "saxon-sql")
    } else {
      filename
    }
  }
}

task eejRelease(
