task hej_copyTestDrivers(
  description: "Copy test driver sources and resources for HE"
) {
  // This is a little complicated because I want to get the inputs and
  // outputs exactly correct. Starting in Gradle 7.0, if the output is
  // a directory, then any file that is read from that directory is
  // implicitly dependent on this step. That's not always what we want
  // so I'm trying to be careful. I wonder if there's a better way?
  def fileMap = [:]
  files("${projectDir}/src/main/java")
    .asFileTree
    .matching { include "net/sf/saxon/testdriver/*.java" }
    .files
    .each { fileMap[it] = copySourceName(it, 'src/testdrivers/hej') }

  inputs.files fileMap.keySet()
  outputs.files fileMap.values()

  doLast {
    fileMap.keySet().each { source ->
      copy {
        from source
        into fileMap[source].getParent()
      }
    }
  }
}

