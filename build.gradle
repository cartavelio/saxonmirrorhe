def jarClasses(String release) {
  // We build jar files for our own release and we build jar files
  // for Maven releases. This function assures that we put the
  // same classes in both jar files!

  return copySpec {
    from ("${buildDir}/services/saxon-${release}") {
      include "META-INF/**"
    }

    if (release == "he") {
      from ("${buildDir}/classes/${release}j") {
        include "net/**/*.class"
        exclude "net/sf/saxon/option"
      }
    } else if (release == "pe") {
      from ("${buildDir}/classes/${release}j") {
        include "net/**/*.class"
        include "com/saxonica/**/*.class"
        include "javax/xml/xquery/*.class"
        exclude "**/sql"
        exclude "com/saxonica/CompileStylesheet.class"
        exclude "com/saxonica/CompileStylesheet\$TracingObjectOutputStream.class"
        exclude "com/saxonica/Validate.class"
        exclude "com/saxonica/config/EnterpriseConfiguration.class"
        exclude "com/saxonica/config/EnterpriseConfiguration\$SurrogateSchema.class"
        exclude "com/saxonica/config/EnterpriseTransformerFactory.class"
        exclude "com/saxonica/config/EnterpriseXPathFactory.class"
        exclude "com/saxonica/config/StreamingTransformerFactory.class"
        exclude "com/saxonica/ee"
        exclude "com/saxonica/expr/CastToList.class"
        exclude "com/saxonica/expr/CastToUnion.class"
        exclude "com/saxonica/expr/CastableToList.class"
        exclude "com/saxonica/expr/CastableToUnion.class"
      }
    } else if (release == "ee") {
      from ("${buildDir}/classes/${release}j") {
        include "net/**/*.class"
        include "com/saxonica/**/*.class"
        include "javax/xml/xquery/*.class"
        exclude "**/sql"
        exclude "com/saxonica/StatsTransform*.class"
      }
    } else {
      throw new GradleException("Unexpected release: ${release}")
    }

    from ("${buildDir}/resources/main") {
      include "net/sf/saxon/data/**"
    }
  }
}

def compareManifests(File jarfile, File jargold) {
  boolean releaseBuild = (project.findProperty("releaseBuild") == "true")
  def jarmanifest = []
  ZipInputStream zs = new ZipInputStream(new BufferedInputStream(new FileInputStream(jarfile)))
  println("COMPARE: $jarfile")
  println("       : $jargold")
  ZipEntry entry
  while ((entry = zs.getNextEntry()) != null) {
    if (!entry.getName().contains('$')) {
      jarmanifest.add(entry.getName())
    }
  }
  
  def goldmanifest = []
  BufferedReader reader = new BufferedReader(new InputStreamReader(new FileInputStream(jargold)))
  String line
  while ((line = reader.readLine()) != null) {
    goldmanifest.add(line)
  }

  jarmanifest.each { fn ->
    if (!goldmanifest.contains(fn)) {
      if (releaseBuild) {
        println("New file: ${fn}")
      }
    }
  }

  boolean missing = false;
  goldmanifest.each { fn ->
    if (!jarmanifest.contains(fn)) {
      println("Missing file: ${fn}")
      missing = true;
    }
  }

  if (releaseBuild && missing) {
    throw new GradleException("Jar file appears to be incomplete")
  }
}

