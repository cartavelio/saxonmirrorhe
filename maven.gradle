// ============================================================
// The following tasks exist to build jar files that will be
// published on Maven. They're saved in build/maven so that
// they're distinct from the other jar files

task mavenHe(dependsOn: ['mavenHeXqjJar', 'mavenHeXqjSourcesJar']) {
  // Just a container to hang dependencies on
}

task mavenPe() {
  // Just a container to hang dependencies on
}
task mavenEe() {
  // Just a container to hang dependencies on
}

["h", "p", "e"].each { initial ->
  def release = initial + "e"
  def Release = initial.toUpperCase() + "e"
  def RELEASE = release.toUpperCase()

  def containerTask = tasks.findByName("maven${Release}")

  Task t = task "maven${Release}JavadocJar"(
    type: Jar,
    dependsOn: ["${release}_javadoc"]
  ) {
    archiveBaseName = "Saxon-${RELEASE}"
    archiveVersion = saxonVersion
    classifier = 'javadoc'
    destinationDirectory = project.file("${buildDir}/maven")
    from "${buildDir}/${release}_javadoc"
    doLast {
      signJar("${buildDir}/maven/Saxon-${RELEASE}-${saxonVersion}-javadoc.jar")
    }
  }
  containerTask.dependsOn t

  t = task "maven${Release}SaxonJar"(
    type: Jar,
    dependsOn: ["${release}jJar", "compile_function_library"]) {
    archiveBaseName = "Saxon-${RELEASE}"
    archiveVersion = saxonVersion
    destinationDirectory = project.file("${buildDir}/maven")
    with jarClasses(release)
    manifest {
      attributes "Project-Name": "Saxon-${RELEASE}"
      attributes "Main-Class": "net.sf.saxon.Transform"
    }
    doLast {
      signJar("${buildDir}/maven/Saxon-${RELEASE}-${saxonVersion}.jar")
    }
  }
  containerTask.dependsOn t

  task "testMaven${Release}SaxonJar"(dependsOn: ["maven${Release}SaxonJar"]) {
    Task jartask = tasks.findByName("maven${Release}SaxonJar")
    def jarfile = jartask.outputs.getFiles().getSingleFile()
    def jargold = project.file("${projectDir}/tools/java-manifests/saxon-${release}.list")
    doLast {
      compareManifests(jarfile, jargold)
    }
  }
  t.finalizedBy(tasks.findByName("testMaven${Release}SaxonJar"))

  t = task "maven${Release}SourceJar"(
    type: Jar,
    dependsOn: ["${release}j_preprocess", "eej_preprocess", "compile_function_library"]) {
    archiveBaseName = "Saxon-${RELEASE}"
    classifier = 'sources'
    archiveVersion = saxonVersion
    destinationDirectory = project.file("${buildDir}/maven")
    from ("${buildDir}/src/${release}j") {
      include "**/*.java"
    }
    from ("${buildDir}/resources/main") {
      include "net/sf/saxon/data/**"
    }
    doLast {
      signJar("${buildDir}/maven/Saxon-${RELEASE}-${saxonVersion}-sources.jar")
    }
  }
  containerTask.dependsOn t

  if (release != 'he') {
    t = task "maven${Release}SqlJar"(
      type: Jar,
      dependsOn: ["${release}jCompile"]
    ) {
      archiveBaseName = "Saxon-${RELEASE}"
      classifier = 'sql'
      archiveVersion = saxonVersion
      destinationDirectory = project.file("${buildDir}/maven")
      from ("${buildDir}/classes/${release}j") {
        include "net/sf/saxon/option/sql/*.class"
        include "com/saxonica/functions/sql/*.class"
      }
      doLast {
        signJar("${buildDir}/maven/Saxon-${RELEASE}-${saxonVersion}-sql.jar")
      }
    }
    containerTask.dependsOn t

    task "testMaven${Release}SqlJar"(dependsOn: ["maven${Release}SqlJar"]) {
      Task jartask = tasks.findByName("maven${Release}SqlJar")
      def jarfile = jartask.outputs.getFiles().getSingleFile()
      def jargold = project.file("${projectDir}/tools/java-manifests/saxon-${release}-sql.list")
      doLast {
        compareManifests(jarfile, jargold)
      }
    }
    t.finalizedBy(tasks.findByName("testMaven${Release}SqlJar"))

    t = task "maven${Release}SqlSourcesJar"(
      type: Jar, dependsOn: ["${release}jCompile"]
    ) {
      archiveBaseName = "Saxon-${RELEASE}"
      classifier = 'sql-sources'
      archiveVersion = saxonVersion
      destinationDirectory = project.file("${buildDir}/maven")
      from ("${projectDir}/src/main/java") {
        include "net/sf/saxon/option/sql/*.class"
        include "com/saxonica/functions/sql/*.class"
      }
      doLast {
        signJar("${buildDir}/maven/Saxon-${RELEASE}-${saxonVersion}-sql-sources.jar")
      }
    }
    containerTask.dependsOn t
  }
}

task mavenHeXqjJar(type: Jar, dependsOn: ["eejCompile"]) {
  archiveBaseName = "Saxon-HE"
  classifier = 'xqj'
  archiveVersion = saxonVersion
  destinationDirectory = project.file("${buildDir}/maven")
  from ("${buildDir}/classes/eej") {
    include "com/saxonica/xqj/**/*.class"
    include "javax/xml/xquery/**/*.class"
  }
  doLast {
    signJar("${buildDir}/maven/Saxon-HE-${saxonVersion}-xqj.jar")
  }
}

task testMavenHeXqjJar(type: Jar, dependsOn: ["mavenHeXqjJar"]) {
  Task jartask = tasks.findByName("mavenHeXqjJar")
  def jarfile = jartask.outputs.getFiles().getSingleFile()
  def jargold = project.file("${projectDir}/tools/java-manifests/saxon-he-xqj.list")
  doLast {
    compareManifests(jarfile, jargold)
  }
}
mavenHeXqjJar.finalizedBy(testMavenHeXqjJar)

task mavenHeXqjSourcesJar(type: Jar, dependsOn: ["eejCompile"]) {
  archiveBaseName = "Saxon-HE"
  classifier = 'xqj-sources'
  archiveVersion = saxonVersion
  destinationDirectory = project.file("${buildDir}/maven")
  from ("${projectDir}/src/main/java") {
    include "com/saxonica/xqj/**/*.java"
    include "javax/xml/xquery/**/*.java"
  }
  doLast {
    signJar("${buildDir}/maven/Saxon-HE-${saxonVersion}-xqj-sources.jar")
  }
}
