services:
    sqlserver:
      image: mysql:latest
      container_name: sqlserver
      ports:
        - 3306:3306
      volumes:
        - db_data:/var/lib/mysql/data
        - ../sql/mysql:/app/sql
      environment:
        MYSQL_ROOT_PASSWORD: admin
      networks:
        - external_net

networks:
  external_net: {}

volumes:
  db_data:
