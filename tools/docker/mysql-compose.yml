version: '3.8'

services:
    sqlserver:
      image: mysql:latest
      container_name: sqlserver
      ports:
        - 3306:3306
      volumes:
        - ../../build/sql/mysql/data:/var/lib/postgresql/data
        - ../sql/mysql:/app/sql
      environment:
        MYSQL_ROOT_PASSWORD: admin
      networks:
        - external_net

networks:
  external_net: {}
