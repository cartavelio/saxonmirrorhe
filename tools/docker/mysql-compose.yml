version: '3.8'

services:
    sqlserver:
      image: saxonica/sqltests-mysql
      build:
        context: .
        additional_contexts:
          bootstrap: ../sql
        dockerfile: ./mysql.Dockerfile
      ports:
        - 3306:3306
      volumes:
        - mysql-data:/var/lib/mysql
      environment:
        MYSQL_ROOT_PASSWORD: admin
      networks:
        - external_net

networks:
  external_net: {}

volumes:
  mysql-data:
