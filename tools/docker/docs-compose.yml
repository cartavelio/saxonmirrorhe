version: '3.8'

services:
    saxonicadocs_server:
      image: httpd:2.4
      container_name: saxonicadocs
      ports:
        - 8123:80
      working_dir: /src
      volumes:
        - ../../build/website/:/usr/local/apache2/htdocs
      stdin_open: true
      tty: true
      networks:
        - external_saxonicadocs

networks:
  external_saxonicadocs: {}
