    sqlserver:
      image: postgres:13.2-alpine
      container_name: sqlserver
      ports:
        - 5432:5432
      volumes:
        - ../../build/sql/data:/var/lib/postgresql/data
        - ../postgresql:/app/sql
      environment:
        POSTGRES_PASSWORD: admin
      networks:
        - external_net

networks:
  external_net: {}
