version: '3.8'

services:
    sqlserver:
      image: postgres:13.2-alpine
      container_name: sqlserver
      ports:
        - 5432:5432
      volumes:
        - postgresql-data:/var/lib/postgresql/data
        - ../sql/postgresql:/app/sql
      environment:
        POSTGRES_PASSWORD: admin
      networks:
        - external_net

networks:
  external_net: {}

volumes:
  postgresql-data:
    external: true
