version: '3.8'

services:
    sqlserver:
      image: saxonica/sqltests-postgres
      build:
        context: .
        additional_contexts:
          bootstrap: ../sql
        dockerfile: ./postgresql.Dockerfile
      ports:
        - 5432:5432
      volumes:
        - postgresql-data:/var/lib/postgresql/data
      environment:
        POSTGRES_PASSWORD: admin
      networks:
        - external_net

networks:
  external_net: {}

volumes:
  postgresql-data:
