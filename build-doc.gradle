// Find pydocex
def pydocex = null
System.getenv("PATH").split(System.getProperty("path.separator")).each { dir ->
  if (pydocex == null) {
    def fn = new File(dir + "/pydoc3")
    if (fn.exists() && fn.canExecute()) {
      pydocex = fn.toString()
    } else {
      fn = new File(dir + "/pydoc")
      if (fn.exists() && fn.canExecute()) {
        pydocex = fn.toString()
      }
    }
  }
}

if (pydocex == null) {
  println("WARNING: Failed to find pydoc!")
}

