  args "-s:${buildDir}/javadoc-xml/javadoc-types.xml",
    "-xsl:${projectDir}/tools/docs/javadoc/check-tag-links.xsl",
    "-o:${buildDir}/javadoc-tag-check.xml"
}

task dotnet_doc_parsecs(
  type: JavaExec,
  dependsOn: ["een_csharpApi"],
