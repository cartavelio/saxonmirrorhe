task gen_prod_desc_pdf(
  description: "Creates the PDF versions of the product descriptions"
) {
  // Just a place to hang dependencies
}

def variants = ["JS"]
["J", "C"].each {plat ->
  ["EEQ", "EET", "EEV", "EE", "PE", "HE"].each { pk ->
    variants.push("${plat}-${pk}")
  }
}
["EEQ", "EET", "EEV", "EE"].each { pk ->
  variants.push("CS-${pk}")
}
variants.each { ds ->
  Task t = task "gen_${ds}_desc_pdf"(
    type: JavaExec,
    dependsOn: ["setup_fop", "gen_prod_desc_fo"],
    description: "Creates the PDF version of the ${ds} product description"
  ) {
    inputs.file "${buildDir}/proddesc/PD/fo/${ds}.fo"
    outputs.file "${buildDir}/proddesc/PD/pdf/Saxon${ds}.pdf"
    classpath = configurations.documentation
    mainClass = "org.apache.fop.cli.Main"
    args "-q", "${buildDir}/proddesc/PD/fo/${ds}.fo", "-pdf", "${buildDir}/proddesc/PD/pdf/Saxon${ds}.pdf"
  }
  gen_prod_desc_pdf.dependsOn t
}

task copy_prod_desc_pdf(
  type: Copy,
  dependsOn: ["gen_prod_desc_pdf"],
  description: "Copy the generated product descriptions to the website"
) {
  into("${buildDir}/website/products/PD${saxonMajorVersion}")
  from("${buildDir}/proddesc/PD/pdf")
}

