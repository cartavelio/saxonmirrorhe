task saxonc_documentation(
  type: Copy,
  dependsOn: ["copy_saxonc_doc", "copy_saxonc_css", "saxonc_doc_sef",
              "saxonc_api_doc"],
  description: "Build the SaxonC documentation for website"
) {
    into "${buildDir}/website/saxon-c"
    from ("${buildDir}/saxonc-doc") {
        exclude "documentation${saxonMajorVersion}/*.css"
    }
}

task copy_saxonc_doc(
  type: Copy,
  description: "Copy the SaxonC documentation source"
) {
  into "${buildDir}/saxonc-doc/documentation${saxonMajorVersion}"
  from ("${projectDir}/src/docs/saxonc-doc") {
    exclude "xsl/*.xsl"
  }
}

task copy_saxonc_css(
  type: Copy,
  description: "Copy SaxonC documentation CSS"
) {
  into "${buildDir}/website/saxon-c/documentation${saxonMajorVersion}"
  from "${projectDir}/src/docs/saxonc-doc/jstree.css"
  filter { line ->
    line.contains("url('saxon-base.css')")
            ? line.replace("saxon-base.css", "../../saxon-base.css")
            : line
  }
}

task saxonc_doc_sef(
  type: JavaExec,
  description: "Compile the viewer_app stylesheet for the SaxonC documentation"
) {
  inputs.files fileTree(dir: "${projectDir}/src/docs/saxonc-doc/xsl")
  outputs.file "${buildDir}/saxonc-doc/documentation${saxonMajorVersion}/xsl/jstree.sef.json"
  classpath = configurations.documentation
  mainClass = "com.saxonica.Transform"
  args "-xsl:${projectDir}/src/docs/saxonc-doc/xsl/jstree.xsl",
          "-export:${buildDir}/saxonc-doc/documentation${saxonMajorVersion}/xsl/jstree.sef.json",
          "-target:JS", "-nogo", "-relocate:on", "-ns:##html5",
          "--generateByteCode:off"
}

task saxonc_api_doc(
  dependsOn: ["saxonc_doxygen", "saxonc_pydoc3"],
  description: "Build the SaxonC API documentation for website"
) {
  inputs.files fileTree(dir: "${buildDir}/doc_pypi/documentation")
  inputs.file "${buildDir}/doc_pypi/saxoncee.html"
  outputs.files fileTree("${buildDir}/saxonc-doc")

  doLast {
    copy {
      into "${buildDir}/saxonc-doc/doc${saxonMajorVersion}"
      from "${buildDir}/doc_pypi/documentation"
    }
  }
  doLast {
    copy {
      into "${buildDir}/saxonc-doc/doc${saxonMajorVersion}/html"
      from "${buildDir}/doc_pypi"
      include "saxoncee.html"
      rename {
        "saxonc.html"
      }
      filter { line ->
        line.replaceAll('@@VERSION@@', saxonVersion)
          .replace('@@edition@@', 'ee')
          .replace('@@EDITION@@', 'EE')
          .replace("saxoncee.html", "saxonc.html")
      }
    }
  }
}

// ============================================================
// These tasks assume that the build will be run in the
// saxonica-docbuild container.

task saxonc_doc_pypi(type: Copy, dependsOn: ['saxon_eec_pypi']) {
  into "${buildDir}/doc_pypi"
  from "${buildDir}/eec_pypi"
}

task saxonc_doxygen(dependsOn: ['saxonc_doc_pypi']) {
  inputs.files fileTree(dir: "${projectDir}/src/main/c/Saxon.C.API")
  outputs.files fileTree(dir: "${buildDir}/doc_pypi/documentation")
  doLast {
    copy {
      into "${buildDir}/doc_pypi/Saxon.C.API"
      from "${projectDir}/src/main/c/Saxon.C.API"
      include "Doxyfile"
      include "README.md"
      filter { line ->
        line.replaceAll('@@VERSION@@', saxonVersion)
          .replace('@@LOGO@@', "${projectDir}/src/docs/doc/img/saxonica_logo.gif")
          .replace('@@OUTPUT@@', 'documentation')
      }
    }
  }

  doLast {
    exec {
      workingDir "${buildDir}/doc_pypi"
      commandLine 'doxygen', 'Saxon.C.API/Doxyfile'
    }
  }
}

task saxonc_pydoc3(dependsOn: ['saxonc_doc_pypi', 'saxonc_doxygen']) {
  inputs.files fileTree(dir: "${buildDir}/doc_pypi", exclude: "*.html")
  outputs.file "${buildDir}/doc_pypi/saxoncee.html"

  doLast {
    exec {
      workingDir "${buildDir}/doc_pypi"
      commandLine 'python3', '-m', 'pip', 'install', '-r', 'requirements.txt'
    }
  }

  doLast {
    exec {
      workingDir "${buildDir}/doc_pypi"
      commandLine 'python3', 'setup.py', 'build_ext', '-if'
    }
  }

  doLast {
    exec {
      workingDir "${buildDir}/doc_pypi"
      commandLine pydocex, '-w', 'saxoncee'
    }
  }
}
