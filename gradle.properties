org.gradle.jvmargs=-Xmx1g

releaseBuild=false

javaVersion=11
#saxonTestJava=/Library/Java/JavaVirtualMachines/jdk1.8.0_121.jdk/Contents/Home/bin/java

# saxonVersion should be X.Y if the patch version is 0
# and X.Y.Z if the patch version Z is not 0
saxonVersion=13.0

# saxonVersion3 should always be the three part version
saxonVersion3=13.0.0

saxonMajorVersion=13
saxonMinorVersion=0
saxonPatchVersion=0
saxonMajorReleaseDate=2023-01-12

saxonEdition=ee

asmVersion=5.0.3
icu4jVersion=72.1
tagsoupVersion=1.2.1
mailVersion=1.6.2
singulinkBigDecimalVersion=0.9.2
jlineVersion=2.14.6
vavrVersion=0.10.5
xmlresolverVersion=6.0.9
graalVersion = 22.3.1
htmlparserVersion = 1.4.16
ninemlVersion = 3.2.6

# SaxonC Python
manylinuxTarget = manylinux_2_24
pythonVersion = 3.12.2

# For JUnit testing
junitExcludeTags=missingfiles,mikeonly,bytecode,expectedtofail,performance

# For SQL testing
#sqlServer=mysql
#sqlDriverGroup=mysql
#sqlDriverName=mysql-connector-java
#sqlDriverVersion=8.0.24

sqlServer=postgresql
sqlDriverGroup=org.postgresql
sqlDriverName=postgresql
sqlDriverVersion=42.2.19

# See also "Find C# compiler" in build.gradle
csDir=cs

docbuildImage=ghcr.io/saxonica/saxon-docbuild
docbuildImageTag=v0001
