org.gradle.jvmargs=-Xmx1g

releaseBuild=false

javaVersion=1.8

saxonVersion=11.1
saxonMajorVersion=11
saxonMinorVersion=1
saxonPatchVersion=1

excelsiorJetVersion=15.3

saxonEdition=ee

asmVersion=5.0.3
icu4jVersion=59.2
tagsoupVersion=1.2.1
mailVersion=1.6.2
singulinkBigDecimalVersion=0.9.2
jlineVersion=2.14.6
xmlresolverVersion=4.1.2

# For JUnit testing
junitExcludeTags=missingfiles,mikeonly,bytecode,expectedtofail,performance

# For SQL testing
#sqlServer=mysql
#sqlDriverGroup=mysql
#sqlDriverName=mysql-connector-java
#sqlDriverVersion=8.0.24

sqlServer=postgresql
sqlDriverGroup=org.postgresql
sqlDriverName=postgresql
sqlDriverVersion=42.2.19

# See also "Find C# compiler" in build.gradle
excelsiorJet=/usr/local/jet15.3
csDir=cs

docbuildImage=ghcr.io/saxonica/saxon-docbuild
docbuildImageTag=v0001
