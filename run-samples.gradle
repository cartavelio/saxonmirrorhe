task ee_samples {}

def eeSampleConfigurations = ["JDOM2Example",
                              "PullExamples",
                              "QuickValidator",
                              "SchemaValidatorExample_1",
                              "SchemaValidatorExample_2",
                              "SchemaValidatorHandlerExample_1",
                              "SchemaValidatorHandlerExample_2",
                              "XPathExampleSA",
                              "XQJExamples"]

// The XMarkBenchmark runs slowly, so only add it on request
if (project.findProperty("xmark") == "true") {
  eeSampleConfigurations += ["XMarkBenchmark_1"]
}

// FIXME: Automate testing of SaxonSAServlet

// Only necessary if the configuration key is not the class name
def eeSampleMainClass = ["SchemaValidatorExample_1": "SchemaValidatorExample",
                         "SchemaValidatorExample_2": "SchemaValidatorExample",
                         "SchemaValidatorHandlerExample_1": "SchemaValidatorHandlerExample",
                         "SchemaValidatorHandlerExample_2": "SchemaValidatorHandlerExample",
                         "XMarkBenchmark_1": "XMarkBenchmark"]

def eeSampleArgs = ["JDOM2Example": ["data/books.xml", "styles/books.xsl"],
                    "PullExamples": [],
                    "QuickValidator": ["data/books.xml", "data/books.xsd"],
                    "SchemaValidatorExample_1": ["data/books.xsd", "data/books.xml"],
                    "SchemaValidatorExample_2": ["--", "data/books.xml"],
                    "SchemaValidatorHandlerExample_1": ["data/books.xsd", "data/books.xml"],
                    "SchemaValidatorHandlerExample_2": ["--", "data/books.xml"],
                    "XMarkBenchmark_1": ["-dir:${buildDir}/tests/extra/data/xmark/"],
                    "XPathExampleSA": ["data/books.xml", "data/books.xsd"],
                    "XQJExamples": ["all"]]

["run", "debug"].each { tver ->
  task "${tver}_eej_samples_ee"(
    type: JavaCompile,
  ) {
    description "Compile the HE samples with EE for ${tver} testing"
    if (tver == "run") {
      dependsOn "eej_setup_samples", "eejCompile", "${tver}_eej_samples_he", "copySaxonExtraTestSuites"
      classpath = configurations.samples \
      + files("${buildDir}/samples/classes/${tver}/ee") \
      + files("${buildDir}/classes/eej")
    } else {
      dependsOn "eej_setup_samples", "compileJava", "${tver}_eej_samples_he"
      classpath = configurations.samples \
      + files("${buildDir}/samples/classes/${tver}/ee") \
      + project.files("${buildDir}/classes/java/main") \
      + files("${projectDir}/src/main/resources")
    }

    source = "${buildDir}/samples/java/ee"
    destinationDirectory = new File("${buildDir}/samples/classes/${tver}/ee")
    doFirst {
      mkdir "${buildDir}/samples/classes/${tver}/ee"
    }
  }

  eeSampleConfigurations.each { sample ->
    def sampleClass = "ee.${sample}"
    if (eeSampleMainClass.containsKey(sample)) {
      sampleClass = "ee.${eeSampleMainClass[sample]}"
    }
    def sampleArgs = eeSampleArgs[sample]

    task "${tver}_ee_samples_${sample}"(
      type: JavaExec,
    ) {
      def resdir = "${buildDir}/samples/results/ee"

      if (tver == "run") {
        dependsOn "${tver}_eej_samples_ee", "${tver}_eej_samples_he", "eejJar"
        description "Run test of EE ${sample} with EE"
        outputs.file "${resdir}/${sample}.txt"

        classpath = configurations.samples \
        + files("${buildDir}/samples/classes/${tver}/ee") \
        + files("${buildDir}/libs/saxon-ee-${saxonVersion}.jar")
      } else {
        dependsOn "${tver}_eej_samples_ee", "${tver}_eej_samples_he", "compileJava"
        description "Debug test of EE ${sample} with EE"

        classpath = configurations.samples \
        + files("${buildDir}/samples/classes/${tver}/ee") \
        + project.files("${buildDir}/classes/java/main") \
        + files("${projectDir}/src/main/resources")
      }

      inputs.files fileTree(dir: "${buildDir}/samples/java/ee/classes")
      inputs.files "${projectDir}/src/samples/java/ee"
      workingDir = "${buildDir}/output/ee/resources/samples"

      doFirst {
        if (tver == "run") {
          mkdir resdir
          standardOutput = new FileOutputStream(new File("${resdir}/${sample}.txt"))
        }
      }

      systemProperties = ["javax.xml.transform.TransformerFactory": "net.sf.saxon.TransformerFactoryImpl"]

      mainClass = sampleClass
      args sampleArgs
    }

    if (tver == "run") {
      Task t = task "check_ee_samples_${sample}"(
        type: Exec,
        dependsOn: ["run_ee_samples_${sample}"],
        description: "Check the results of run_ee_samples_${sample}"
      ) {
        workingDir "${buildDir}/samples/results/ee"

        def args = ["python3", "${projectDir}/tools/sample-check.py",
                    "--sample", sample, "--edition", "ee"]
        if (project.findProperty("ignoreSampleErrors") != null) {
          args.add("--ignore-errors")
        }
        args.add("${sample}.txt")

        commandLine args
      }
      tasks.findByName("ee_samples").dependsOn t
    }
  }
}

