// These tests of generated configuration files are intended to check for consistency between
// ConfigurationReader and the FeatureKeys source. If the tests fail, then there is some
// inconsistency to resolve.
// The generated configuration files are not actually included in the samples in saxon-resources
// (see run_config_samples below for testing of the sample configuration files.)

task run_config_tests(
        description: "Test generated configuration files"
) {}

["he", "pe", "ee"].each { edition ->
  def EDITION = edition.toUpperCase()
  ["all", "current"].each { features ->
    def includeObsolete = "true()"
    if (features == "current") {
      includeObsolete = "false()"
    }
    def options = "${EDITION}-${features}"
    Task t = task "gen_config_file_${options}"(
            type: JavaExec,
            description: "Generate test configuration file for ${EDITION}"
    ) {
      inputs.files fileTree(dir: "${projectDir}/tools/featureKeys")
      outputs.file "${buildDir}/samples/config/generated-config-${options}.xml"
      classpath = configurations.preprocessor
      mainClass = "net.sf.saxon.Transform"
      args "-xsl:${projectDir}/tools/featureKeys/FeatureKeysToConfigFile.xsl",
              "-s:${projectDir}/tools/featureKeys/config-base.xml",
              "-o:${buildDir}/samples/config/generated-config-${options}.xml",
              "edition=${EDITION}",
              "platform=J",
              "?include-obsolete=${includeObsolete}"
    }
    run_config_tests.dependsOn t

    Task t2 = task "validate_generated-config-${options}"(
            type: JavaExec,
            dependsOn: ["gen_config_file_${options}", "ee_samples_common", "eejJar"],
            description: "Validate the generated-config-${options}.xml test configuration file"
    ) {
      inputs.files "${buildDir}/samples/config/generated-config-${options}.xml"
      inputs.files "${buildDir}/output/ee/resources/samples/config/config.xsd"
      workingDir = "${buildDir}/output/ee/resources/samples"

      classpath = configurations.samples \
        + files("${buildDir}/libs/saxon-ee-${saxonVersion}.jar")

      mainClass = "com.saxonica.Validate"
      args "-t",
              "-s:${buildDir}/samples/config/generated-config-${options}.xml",
              "-xsd:${buildDir}/output/ee/resources/samples/config/config.xsd",
              "-report:${buildDir}/samples/config/reportfile-${options}.xml"

      // All validation tests should result in "Validation successful"
      // (without -quit:off, the task will fail if validation fails)
    }
    run_config_tests.dependsOn t2

    def dependencies = ["gen_config_file_${options}", "ee_samples_common", "${edition}jJar"]
    if (edition != "he") {
      dependencies += "${edition}jJarSql"
    }

    Task t3 = task "run_with_generated-config-${options}"(
            type: JavaExec,
            dependsOn: dependencies,
            description: "Run a transform using the generated-config-${options}.xml sample configuration file"
    ) {
      doFirst {
        mkdir "${buildDir}/samples/results/config/"
      }
      inputs.files "${buildDir}/samples/config/generated-config-${options}.xml"
      workingDir = "${buildDir}/output/ee/resources/samples"

      classpath = configurations.samples \
        + files("${buildDir}/libs/saxon-${edition}-${saxonVersion}.jar")

      if (edition != "he") {
        classpath += files("${buildDir}/libs/saxon-${edition}-sql-${saxonVersion}.jar")
      }

      mainClass = "net.sf.saxon.Transform"
      args "-t",
              "-config:${buildDir}/samples/config/generated-config-${options}.xml",
              "-s:data/books.xml",
              "-xsl:styles/books.xsl",
              "-o:${buildDir}/samples/results/config/books-with-generated-config-${options}.html",
              "--traceListenerOutputFile:${buildDir}/samples/results/config/traceOutput-${options}.log"

      // Running the generated-config-${edition}-current.xml configuration files should not produce any warnings.

      // Should only get warnings for obsolete features when running the generated-config-${edition}-all.xml
      // configuration files.
      // e.g. Warning
      //   Obsolete configuration property global/@lazyConstructionMode
    }
    run_config_tests.dependsOn t3

    Task t4 = task "validate_report_for_generated-config-${options}"(
            type: JavaExec,
            dependsOn: ["validate_generated-config-${options}"],
            description: "Validate the validation report for generated-config-${options}.xml"
    ) {
      inputs.files "${buildDir}/samples/config/generated-config-${options}.xml"
      inputs.files "${buildDir}/output/ee/resources/samples/config/config.xsd"
      workingDir = "${buildDir}/output/ee/resources/samples"

      classpath = configurations.samples \
        + files("${buildDir}/libs/saxon-ee-${saxonVersion}.jar")

      mainClass = "com.saxonica.Validate"
      args "-t",
              "-s:${buildDir}/samples/config/reportfile-${options}.xml",
              "-xsd:${buildDir}/output/ee/resources/samples/schemas/validation-reports.xsd"

      // All validation tests should result in "Validation successful"
      // (without -quit:off, the task will fail if validation fails)
    }
    run_config_tests.dependsOn t4

  }
}

