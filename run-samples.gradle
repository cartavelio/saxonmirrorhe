                         "SchemaValidatorExample_2": "SchemaValidatorExample",
                         "SchemaValidatorHandlerExample_1": "SchemaValidatorHandlerExample",
                         "SchemaValidatorHandlerExample_2": "SchemaValidatorHandlerExample",
                         "XMarkBenchmark_1": "XMarkBenchmark"]

def eeSampleArgs = ["JDOM2Example": ["data/books.xml", "styles/books.xsl"],
                    "PullExamples": [],
                    "QuickValidator": ["data/books.xml", "data/books.xsd"],
                    "SchemaValidatorExample_1": ["data/books.xsd", "data/books.xml"],
