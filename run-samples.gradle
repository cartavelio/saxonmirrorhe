task run_cmd_samples(
        description: "Run command line samples",
        dependsOn: ["run_config_samples",
                    "run_cmd_books_sample_tests",
                    "run_cmd_tour_sample_tests",
                    "run_cmd_shakespeare_sample_tests",
                    "run_cmd_bible_sample_tests"]
) {}

// TODO still need to check the output of running the command line samples

task run_config_samples(
        description: "Test validation of the sample configuration files"
) {}

["config", "config-HE"].each {configFile ->
  Task t = task "run_${configFile}"(
          type: JavaExec,
          dependsOn: ["gen_config_schema", "copy_samples", "eejJar"],
          description: "Validate the ${configFile}.xml sample configuration file"
  ) {
    inputs.files "${buildDir}/saxon-resources/samples/config/${configFile}.xml"
    inputs.files "${buildDir}/saxon-resources/samples/config/config.xsd"
    workingDir = "${buildDir}/saxon-resources/samples"

    classpath = configurations.samples \
        + files("${buildDir}/libs/saxon-ee-${saxonVersion}.jar") \
        + files(saxonLicenseDir)
    mainClass = "com.saxonica.Validate"
    args "-t",
            "-s:${buildDir}/saxon-resources/samples/config/${configFile}.xml",
            "-xsd:${buildDir}/saxon-resources/samples/config/config.xsd"
  }
  run_config_samples.dependsOn t
}

def booksTests = ["ee": ["Transform_1", "Transform_2", "Transform_3", "Query_1", "Query_2", "Validate"],
                  "pe": ["Transform_1", "Transform_2", "Transform_3", "Query_1", "Query_2"],
                  "he": ["Transform_1", "Transform_2", "Transform_3", "Query_1"]]
def booksSampleArgs = ["Transform_1": ["-s:data/books.xml", "-xsl:styles/books.xsl", "-t"],
                       "Transform_2": ["-s:data/books.xml", "-xsl:styles/books.xsl", "top-author=Thomas Hardy"],
                       "Transform_3": ["-s:data/books.xml", "-xsl:styles/books-csv.xsl"],
                       "Query_1": ["-s:data/books.xml", "-q:query/books.xq"],
                       "Query_2": ["-s:data/books.xml", "-qs:saxon:line-number((//*)[last()])", "-l:on"],
                       "Validate": ["-s:data/books.xml", "-xsd:data/books.xsd"]]

task run_cmd_books_sample_tests(
        description: "Run the command line books sample tests"
) {}

["he", "pe", "ee"].each { edition ->
  def tests = booksTests[edition]
  tests.each { test ->
    def call = test.split("_")[0]
    Task t = task "run_books_${test}_${edition}"(
            type: JavaExec,
            dependsOn: ["${edition}jJar", "${edition}_samples_common"],
            description: "Run the cmd books sample with ${edition}, test ${test}"
    ) {
      def resdir = "${buildDir}/samples/results/cmd/${edition}"
      doFirst {
        mkdir resdir
        if ((test != "Transform_1") && (test != "Transform_2")) {
          standardOutput = new FileOutputStream(new File("${resdir}/books_${test}.txt"))
        }
      }

      def outputfile = "books_${test}.html"
      outputs.file "${resdir}/${outputfile}"
      workingDir = "${buildDir}/output/${edition}/resources/samples"

      def jclass = "net.sf.saxon.Transform"
      if (call == "Query") {
        jclass = "net.sf.saxon.Query"
      } else {
        if (call == "Validate") {
          jclass = "com.saxonica.Validate"
        }
      }

      classpath = configurations.samples \
        + files("${buildDir}/libs/saxon-${edition}-${saxonVersion}.jar") \
        + files(saxonLicenseDir)
      mainClass = jclass
      def testargs = booksSampleArgs[test]
      if ((test == "Transform_1") || (test == "Transform_2")) {
        testargs += ["-o:${resdir}/${outputfile}"]
      }
      //println (testargs)
      args testargs

    }
    run_cmd_books_sample_tests.dependsOn t
  }
}

