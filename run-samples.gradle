["run", "debug"].each { tver ->
  ["he", "pe", "ee"].each { edition ->
    task "${tver}_${edition}j_samples_he"(
      type: JavaCompile,
    ) {
      description "Compile the HE samples with ${edition} for ${tver} testing"
      if (tver == "run") {
        dependsOn "hej_setup_samples", "${edition}jCompile"
        classpath = configurations.samples + files("${buildDir}/classes/${edition}j")
      } else {
        dependsOn "hej_setup_samples", "compileJava"
        classpath = configurations.samples \
        + project.files("${buildDir}/classes/java/main") \
        + files("${projectDir}/src/main/resources") \
      }
      
      source = "${buildDir}/samples/java/he"
      destinationDirectory = new File("${buildDir}/samples/classes/${tver}/${edition}")
      doFirst {
        mkdir "${buildDir}/samples/classes/${tver}/${edition}"
      }
    }

    heSampleConfigurations.each { sample ->
      def ignoreThisCombination = (
        (edition == "he" && (sample.endsWith("_pe") || sample.endsWith("_ee")))
        || (edition == "pe" && (sample.endsWith("_he") || sample.endsWith("_ee")))
        || (edition == "ee" && (sample.endsWith("_he") || sample.endsWith("_pe")))
      )

      if (!ignoreThisCombination) {
        def sampleClass = "he.${sample}"
        if (heSampleMainClass.containsKey(sample)) {
          sampleClass = "he.${heSampleMainClass[sample]}"
        }
        def sampleArgs = heSampleArgs[sample]

        task "${tver}_he_samples_${sample}_${edition}"(
          type: JavaExec,
          dependsOn: ["${edition}_samples_common"]
        ) {
          def resdir = "${buildDir}/samples/results/he"

          if (tver == "run") {
            dependsOn "${tver}_${edition}j_samples_he", "${edition}jJar"
            description "Run test of HE ${sample} with ${edition}"
            outputs.file "${resdir}/${sample}_${edition}.txt"

            classpath = configurations.samples \
            + files("${buildDir}/samples/classes/${tver}/${edition}") \
            + files("${buildDir}/libs/saxon-${edition}-${saxonVersion}.jar")

          } else {
            dependsOn "${tver}_${edition}j_samples_he", "compileJava"
            description "Debug test of HE ${sample} with ${edition}"

            classpath = configurations.samples \
            + files("${buildDir}/samples/classes/${tver}/${edition}") \
            + project.files("${buildDir}/classes/java/main") \
            + files("${projectDir}/src/main/resources")
          }

          inputs.files fileTree(dir: "${buildDir}/samples/classes/${tver}/${edition}")
          inputs.files "${projectDir}/src/samples/java/he"
          workingDir = "${buildDir}/output/he/resources/samples"

          doFirst {
            if (tver == "run") {
              mkdir resdir
              standardOutput = new FileOutputStream(new File("${resdir}/${sample}_${edition}.txt"))
            }
          }

          systemProperties = ["javax.xml.transform.TransformerFactory": "net.sf.saxon.TransformerFactoryImpl"]

          mainClass = sampleClass
          args sampleArgs
        }

        if (tver == "run") {
          Task t = task "check_he_samples_${sample}_${edition}"(
            type: Exec,
            dependsOn: ["run_he_samples_${sample}_${edition}"],
            description: "Check the results of run_he_samples_${sample}_${edition}"
          ) {
            workingDir "${buildDir}/samples/results/he"

            def args = ["python3", "${projectDir}/tools/sample-check.py",
                        "--sample", sample, "--edition", edition]
            if (project.findProperty("ignoreSampleErrors") != null) {
              args.add("--ignore-errors")
            }
            args.add("${sample}_${edition}.txt")

            commandLine args
          }

          tasks.findByName("he_samples_${edition}").dependsOn t
        }
      }
    }
  }
}

