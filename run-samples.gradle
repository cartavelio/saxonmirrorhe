task run_shakespeare_Transform_cs(
        dependsOn: ["dotnetPublish", "ee_samples_common"],
        description: "Run the cmd shakespeare sample transform with SaxonCS"
) {
  def resdir = "${buildDir}/samples/results/cmd/cs"
  doFirst {
    mkdir "${resdir}/playhtml/"
  }
  doLast {
    if (dotnetex == null) {
      throw new GradleException("Cannot run: failed to find dotnet[.exe] on path.")
    }

    exec {
      workingDir = "${buildDir}/output/ee/resources/samples"
      commandLine "${buildDir}/cs/bin/${csconfiguration}/net6.0/${csrid}/publish/SaxonCS", "transform",
              "-s:data/othello.xml", "-xsl:styles/play.xsl", "dir=file://${resdir}/playhtml"
    }
  }
}

