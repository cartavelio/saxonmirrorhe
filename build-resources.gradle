task resources(
  dependsOn: ["resources_notices",
              "resources_userdoc_xml",
              "resources_userdoc_html",
              //"resources_drivers", // exclude Java only stuff for now
              "samples_common",
              //"samples_j", // exclude Java only stuff for now
              "samples_n",
              "gen_readme"],
  description: "Build the saxon-resources download"
) {
  // Just a place to hang dependencies
}

task releaseResources(
        type: Zip,
        dependsOn: ["resources"],
        description: "Build the saxon-resources release"
) {
    from "${buildDir}/resources"
    archiveFileName = "saxon-resources-${saxonMajorVersion}.zip"
}


// ============================================================

task resources_notices(
        type: Copy,
        description: "Copies the notices for saxon-resources"
) {
    into "${buildDir}/resources/notices"
    from ("${projectDir}/src/docs/notices") {
        include "ASM.txt"
        include "ICU-J.txt"
        include "JAMESCLARK.txt"
        include "JLINE2.txt"
        include "LICENSE.txt"
        include "THAI.txt"
        include "UNICODE.txt"
    }
}

task resources_userdoc_html(
        dependsOn: ["resources_html_docs", "resources_html_javadoc", "resources_html_dotnetdoc"],
        description: "Copy HTML docs into the resources folder"
) {
    // Just a place to hang dependencies
}

task resources_html_docs(
        type: Copy,
        description: "Copy docs base files into the resources folder"
) {
    into "${buildDir}/resources/doc"
    from "${projectDir}/src/docs/resources/fixed"
}

task resources_html_javadoc(
        type: Copy,
        dependsOn: ["userdoc_publish_html"],
        description: "Copy HTML javadoc into the resources folder"
) {
    into "${buildDir}/resources/doc/javadoc"
    from "${buildDir}/javadoc"
    doFirst {
        mkdir "${buildDir}/resources/doc/javadoc"
    }
}

task resources_html_dotnetdoc(
        type: Copy,
        dependsOn: ["userdoc_publish_html"],
        description: "Copy HTML dotnetdoc into the resources folder"
) {
    into "${buildDir}/resources/doc/dotnetdoc"
    from "${buildDir}/dotnetdoc-html"
    doFirst {
        mkdir "${buildDir}/resources/doc/dotnetdoc"
    }
}

task source_userdoc_zip(
        type: Zip,
        dependsOn: ["userdoc_viewer_appJS"]
) {
    from ("${buildDir}/userdoc") {
        exclude "expanded/**"
        exclude "html/**"
        exclude "src/**"
        exclude "tmp/**"
    }
    archiveFileName = "source-userdoc.zip"
}

task resources_userdoc_xml(
        type: Copy,
        dependsOn: ["source_userdoc_zip"],
        description: "Copy zipped userdoc source into the resources folder"
) {
    into "${buildDir}/resources"
    from "${buildDir}/distributions/source-userdoc.zip"
}

task resources_drivers_src(
        dependsOn: ["hej_compileTestDrivers", "pej_compileTestDrivers", "eej_compileTestDrivers"],
        description: "Copy test drivers into the resources folder"
) {
  doLast {
    copy {
      into "${buildDir}/resources/drivers/java"
      from ("${buildDir}/src/testdrivers/eej") {
        exclude "com/saxonica/js"
      }
    }
  }
  doLast {
    copy {
      into "${buildDir}/resources/drivers/java"
      from ("src/main/java/") {
        include "com/saxonica/testdriver/gui/images/*"
      }
    }
  }
}

task resources_drivers(
        type: Copy,
        dependsOn: ["resources_drivers_src"],
        description: "Copy test drivers into the resources folder"
) {
    into "${buildDir}/resources/drivers/java/classes"
    from ("${buildDir}/testdriver_classes/eej") {
        exclude "com/saxonica/js"
    }
}

task samples_common(
        type: Copy,
        dependsOn: ["copy_usecases", "copy_samples", "gen_config_schema"],
        description: "Assemble Cross-Platform Samples and Use-Cases"
) {
    // Just a place to hang dependencies
}

task copy_usecases(
        type: Copy,
        description: "Copy use-cases into the resources folder"
) {
    into "${buildDir}/resources/use-cases"
    from "${projectDir}/src/use-cases"
}

task copy_samples(
        type: Copy,
        description: "Copy samples into the resources folder"
) {
    into "${buildDir}/resources/samples"
    from ("${projectDir}/src/samples") {
        include "config/config.xml"
        include "config/config-HE.xml"
        include "config/saxon-attributes.xsd"
        include "data/books.xml"
        include "data/books-invalid.xml"
        include "data/more-books.xml"
        include "data/othello.xml"
        include "data/books.xsd"
        include "data/books.dtd"
        include "data/play.dtd"
        include "query/tour.xq"
        include "query/books.xq"
        include "query/books-to-html.xq"
        include "scm/scmschema.*"
        include "schemas/validation-reports.xsd"
        include "styles/add-ids.xsl"
        include "styles/bible.xsl"
        include "styles/books.xsl"
        include "styles/books.txt"
        include "styles/play.xsl"
        include "styles/identity.xsl"
        include "styles/books-csv.xsl"
        include "styles/books-sql.xsl"
        include "styles/rename-to-lowercase.xsl"
        include "styles/total.xsl"
        include "styles/tour.xsl"
        include "styles/summarize.xsl"
    }
}

task gen_config_schema(
        type: JavaExec,
        dependsOn: ["hej_featureKeys"],
        description: "Generate the configuration file schema"
) {
    inputs.files fileTree(dir: "${projectDir}/tools/featureKeys")
    inputs.files "${projectDir}/src/samples/config/config-raw.xsd"
    outputs.file "${buildDir}/resources/samples/config/config.xsd"
    classpath = configurations.preprocessor
    main = "net.sf.saxon.Transform"
    args "-xsl:${projectDir}/tools/featureKeys/FeatureKeysToSchema.xsl",
            "-o:${buildDir}/resources/samples/config/config.xsd",
            "-it:main",
            "FeatureKeys=FeatureKeys.xml",
            "AdditionalFeatures=AdditionalFeatures.xml",
            "ConfigSchema=${projectDir}/src/samples/config/config-raw.xsd"
}

task samples_j_src(
        type: Copy,
        description: "Copy Java samples into the resources folder"
) {
    into "${buildDir}/resources/samples/java"
    from "${projectDir}/src/samples/java"
}

task samples_j(
        type: Copy,
        dependsOn: ["samples_j_src", "run_eej_samples_ee"],
        description: "Copy compiled Java samples into the resources folder"
) {
    into "${buildDir}/resources/samples/java/classes"
    from "${buildDir}/samples/classes/run/ee"
}

task samples_n(
        type: Copy,
        description: "Copy .NET samples into the resources folder"
) {
    into "${buildDir}/resources/samples/cs"
    from "${projectDir}/src/samples/cs"
}

task gen_readme(
        type: JavaExec,
        description: "Generate readme.txt for saxon-resources download"
) {
    inputs.file "${projectDir}/src/docs/resources/readme.xsl"
    outputs.file "${buildDir}/resources/readme.txt"
    classpath = configurations.documentation
    main = "com.saxonica.Transform"
    args "-xsl:${projectDir}/src/docs/resources/readme.xsl",
            "-it:main",
            "-o:${buildDir}/resources/readme.txt"
}
