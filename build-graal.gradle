}

["he", "pe", "ee"].each { edition ->
  //def graalEdition = edition == "he" ? "ce" : "ee"
  def graalEdition = "ce"
  
  task "setup_${edition}c_graalJar"(
    dependsOn: ["graal_${edition}c_jar"],
    description: "Setup the ${edition.toUpperCase()} jar file for GraalVM"
  ) {
    inputs.file "${buildDir}/c/jars/${edition}c/saxon-${edition}-${saxonVersion}.jar"
    inputs.files fileTree(dir: "${projectDir}/src/graalvm/META-INF")
    outputs.files fileTree(dir: "${buildDir}/graalvm/${edition}/META-INF");

    doLast {
      mkdir("${buildDir}/graalvm/${edition}");
    }
    doLast {
      copy {
        def zipFile = file("${buildDir}/c/jars/${edition}c/saxon-${edition}-${saxonVersion}.jar")
        def outputDir = "${buildDir}/graalvm/${edition}"
        from(zipTree(zipFile)) {
          exclude "META-INF/TE*"
        }
        into outputDir
      }
    }
    doLast {
      copy {
        from("${projectDir}/src/graalvm/META-INF")
        into("${buildDir}/graalvm/${edition}/META-INF")
      }
    }
  }

  task "${edition}c_graalJar"(
    type: Jar,
    dependsOn: ["setup_${edition}c_graalJar"],
    description: "Build the ${edition.toUpperCase()} jar file for GraalVM"
  ) {
    inputs.files fileTree(dir: "${buildDir}/graalvm/${edition}")
    outputs.file "${buildDir}/libs/libsaxon-${edition}c-${saxonVersion}.jar"

    def prefixLen = "${buildDir}/graalvm/${edition}".length()

    archiveBaseName = "libsaxon-${edition}c-${saxonVersion}"
    manifest {
      from "${buildDir}/graalvm/${edition}/META-INF/MANIFEST.MF"
    }
    from("${buildDir}/graalvm/${edition}")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  }

  task "${edition}c_graalImage"(
    dependsOn: ["${edition}c_graalJar", "graal_${graalEdition}_home"],
    description: "Builds the GraalVM native image, add '-g' and \"-H:Log=registerResource:3\" option for debugging, \"-J-Dfile.encoding=UTF-8\",  Next options for heap size: -R:MaxHeapSize=1000000, -H:+AllowVMInspection"
  ) {
    inputs.file "${buildDir}/libs/libsaxon-${edition}c-${saxonVersion}.jar"
    outputs.file "libsaxon-${edition}c-${saxonVersion}.o"

    doLast {
      def image = nativeImage(graalEdition)
      exec {
        commandLine image,
          "-cp", "${buildDir}/libs/libsaxon-${edition}c-${saxonVersion}.jar",
          "-o","${buildDir}/c/libsaxon-${edition}c-${saxonVersion}",
          "--no-fallback", "-H:Path=${buildDir}/c",
          "-H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.msg.SAXMessages",
          "-H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.msg.XMLMessages",
          "-H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.msg.XMLMessages",
          "-H:+ReportExceptionStackTraces",
          "--trace-class-initialization=javax.xml.parsers.FactoryFinder",
          "--trace-class-initialization=net.sf.saxon.s9api.streams.Steps",
          "--trace-class-initialization=jdk.xml.internal.SecuritySupport",
          "--enable-url-protocols=https",
          "--enable-url-protocols=http",
          "--shared"
      }
    }
  }

  task "${edition}c_graalImageExe"(
    dependsOn: ["${edition}c_graalJar", "graal_${graalEdition}_home"],
    description: "Builds the GraalVM native image, add '-g' and \"-H:Log=registerResource:3\" option for debugging add :${icu4jJar} for icu"
  ) {
    doLast {
      def image = nativeImage(graalEdition)
      exec {
        commandLine image,
          "-cp", "${buildDir}/libs/libsaxon-${edition}c-${saxonVersion}.jar",
          "net.sf.saxon.Transform", "-o","${buildDir}/c/saxon-${edition}c-${saxonVersion}",
          "--no-fallback", "-H:Path=${buildDir}/c",
          "-H:+AllowVMInspection",
          "-H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.msg.SAXMessages",
          "-H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.msg.XMLMessages",
          "-H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.msg.XMLMessages",
          "-H:+ReportExceptionStackTraces",
          "--trace-class-initialization=javax.xml.parsers.FactoryFinder",
          "--trace-class-initialization=net.sf.saxon.s9api.streams.Steps",
          "--trace-class-initialization=jdk.xml.internal.SecuritySupport"
      }
    }
  }
}

