    libVersionedName = "libsaxon-${edition}c-${saxonVersion3}"
    outputDir = layout.buildDirectory.dir("${edition}c/libsaxon")
    debug = true
  }


  task "${edition}c_graalImageExe"(
          dependsOn: ["${edition}c_graalJar", "graal_${graalEdition}_home"],
          description: "Builds the GraalVM native image, add '-g' and \"-H:Log=registerResource:3\" option for Fcppging add :${icu4jJar} for icu"
  ) {
    doLast {
      def image = nativeImage(graalEdition)
      exec {
        commandLine image,
                "-cp", "${buildDir}/libs/libsaxon-${edition}c-${saxonVersion3}.jar",
                "net.sf.saxon.Transform", "-o", "${buildDir}/${edition}c/saxon-${edition}c-${saxonVersion3}",
                "--no-fallback", "-H:Path=${buildDir}/${edition}c",
                "-H:+AllowVMInspection",
                "-H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.msg.SAXMessages",
                "-H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.msg.XMLMessages",
                "-H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.msg.XMLMessages",
                "-H:+ReportExceptionStackTraces",
                "--trace-class-initialization=javax.xml.parsers.FactoryFinder",
                "--trace-class-initialization=net.sf.saxon.s9api.streams.Steps",
                "--trace-class-initialization=jdk.xml.internal.SecuritySupport"
      }
    }
  }
