def saxonApiDir = "${buildDir}/../src/main/c/Saxon.C.API"
def commandDir = "${buildDir}/../src/main/c/command"
def sharedLibDir = "${buildDir}/c"

task buildSaxonGlue(
  type: Exec,
  dependsOn: ["graal_ce_home"]
) {
  workingDir "${commandDir}"
  commandLine "/usr/bin/gcc", "-m64", "-fPIC", "-I${saxonApiDir}/graalvm", "-c", "${saxonApiDir}/SaxonCGlue.c", "-o", "${commandDir}/SaxonCGlue.o"
  doLast {
    println "built Saxon glue"
  }
}

task buildTransform(type: Exec) {
  dependsOn 'buildSaxonGlue'
  workingDir "${commandDir}"
  commandLine "/usr/bin/gcc", "-m64", "-fPIC", "-I${saxonApiDir}/graalvm", "${commandDir}/Transform.c", "-o", "${commandDir}/transform", "-ldl", "-lc", "-DEEC", "${commandDir}/SaxonCGlue.o", "-L${sharedLibDir}", "-lsaxon-eec-${saxonVersion}"
  doLast {
    println "built transform wrapper"
  }
}

task buildQuery(type: Exec) {
  dependsOn 'buildSaxonGlue'
  workingDir "${commandDir}"
  commandLine "/usr/bin/gcc", "-m64", "-fPIC", "-I${saxonApiDir}/graalvm", "${commandDir}/Query.c", "-o", "${commandDir}/query", "-ldl", "-lc", "-DEEC", "${commandDir}/SaxonCGlue.o", "-L${sharedLibDir}", "-lsaxon-eec-${saxonVersion}"
  doLast {
    println "built query wrapper"
  } 
}

task buildValidate(type: Exec) {
  dependsOn 'buildSaxonGlue'
  workingDir "${commandDir}"
  commandLine "/usr/bin/gcc", "-m64", "-fPIC", "-I${saxonApiDir}/graalvm", "${commandDir}/Validate.c", "-o", "${commandDir}/validate", "-ldl", "-lc", "-DEEC", "${commandDir}/SaxonCGlue.o", "-L${sharedLibDir}", "-lsaxon-eec-${saxonVersion}"
  doLast {
    println "built validate wrapper"
  }
}

