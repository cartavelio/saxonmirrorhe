  tasks.register("graal_setup_${edition}c_jar", Copy) {
    from(zipTree(tasks.named("graal_${edition}c_jar").map { it.archiveFile })) {
      exclude "META-INF/TE*"
    }
    from(layout.projectDirectory.dir("src/graalvm/")) {
      include "META-INF/**/*"
    }
    into layout.buildDirectory.dir("graalvm/${edition}")
  }

  tasks.register("${edition}c_graalJar", Jar) {
    description "Build the ${edition.toUpperCase()} jar file for GraalVM"

    archiveBaseName = "libsaxon-${edition}c-${saxonVersion3}"
    destinationDirectory = layout.buildDirectory.dir("libs")

    def jarSrcDirProvider = tasks.named("graal_setup_${edition}c_jar").map {it.destinationDir }

    manifest {
      from file("${jarSrcDirProvider.get()}/META-INF/MANIFEST.MF")
    }
    from jarSrcDirProvider

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  }

  tasks.register("${edition}c_build_graal_image", GraalNativeImageTask) {
    sourceJar = tasks.named("${edition}c_graalJar").flatMap { it.archiveFile }
    libVersionedName = "libsaxon-${edition}c-${saxonVersion3}"
    outputDir = layout.buildDirectory.dir("${edition}c/libsaxon")
  }

  tasks.register("${edition}c_build_graal_debug_image", GraalNativeImageTask) {
    sourceJar = tasks.named("${edition}c_graalJar").flatMap { it.archiveFile }
    libVersionedName = "libsaxon-${edition}c-${saxonVersion3}"
    outputDir = layout.buildDirectory.dir("${edition}c/libsaxon-debug")
    debug = true
  }
}

task all_saxonc_releases() {
  // Just somewhere to hang dependencies
}

["he", "pe", "ee"].each { edition ->
  def EDITION = edition.toUpperCase()

  def arch = System.getProperty("os.arch") 
  def saxoncReleaseName = "libsaxon-${EDITION}C-${systemOsName}-${arch}-v${saxonVersion3}"
  def saxoncReleasePath = "releases/${saxoncReleaseName}"

  ["debug", "release"].each { releaseKind ->
    def graalTaskNameFragment = releaseKind == "debug" ? "_debug" : ""
    def releasePath = "${saxoncReleasePath}${releaseKind == "debug" ? "-debug" : ""}"

    tasks.register("${edition}c_${releaseKind}_graal_shared_libs", Copy) {
      def libdir = (systemOs.isMacOsX()
              ? "libs/darwin"
              : (systemOs.isLinux()
              ? "libs/nix"
              : "libs/win"))

      from tasks.named("${edition}c_build_graal${graalTaskNameFragment}_image").map { it.sharedLibraryFiles }
      into layout.buildDirectory.dir("${releasePath}/${libdir}")
    }

    tasks.register("${edition}c_${releaseKind}_graal_headers", Copy) {
      from tasks.named("${edition}c_build_graal${graalTaskNameFragment}_image").map { it.headerFiles }
      into layout.buildDirectory.dir("${releasePath}/Saxon.C.API/graalvm")
    }

    tasks.register("${edition}c_${releaseKind}_c_files", Copy) {
      into layout.buildDirectory.dir(releasePath)
      from(layout.projectDirectory.dir("src/main/c")) {
        include "README.md"
        include "samples/**"
        include "command/**"
        include "pypi/**"
        include "Saxon.C.API/*.h"
        include "Saxon.C.API/*.c"
        include "Saxon.C.API/*.cpp"
        include "Saxon.C.API/config.m4"
        include "Saxon.C.API/config.w32"
        exclude "pypi/python_saxon/**"
        if (edition != "ee") {
          exclude "command/Validate.c"
        }

        filter textReplacementFilter(edition)
      }

      from(layout.projectDirectory.dir("src/main/c")) {
        include "pypi/python_saxon/**"
        filter textReplacementFilter(edition, '../../')
      }

      from(layout.projectDirectory.dir("src/docs")) {
        include "notices/JAMESCLARK.txt"
        include "notices/JLINE2.txt"
        include "notices/LICENSE.txt"
      }
    }

    tasks.register("${edition}c_${releaseKind}_dir") {
      inputs.files(tasks.named("${edition}c_${releaseKind}_graal_shared_libs").map { it.outputs.files })
      inputs.files(tasks.named("${edition}c_${releaseKind}_graal_headers").map { it.outputs.files })
      inputs.files(tasks.named("${edition}c_${releaseKind}_c_files").map { it.outputs.files })

      outputs.dir(layout.buildDirectory.dir(releasePath))

      if (systemOs.isMacOsX()) {
        doLast {
          exec {
            workingDir layout.buildDirectory.dir("${saxoncReleasePath}/libs/darwin")
            executable "/usr/bin/install_name_tool"
            args "-id", "@rpath/libsaxon-${edition}c-${saxonVersion3}.dylib", "libsaxon-${edition}c-${saxonVersion3}.dylib"
          }
        }
      }
    }
  }

  def t = tasks.register("zip_${edition}c_release", Zip) {
    dependsOn "${edition}c_release_dir"

    from layout.buildDirectory.dir("releases")
    include "${saxoncReleaseName}/**"
    archiveFileName = "${saxoncReleaseName}.zip"
  }
  all_saxonc_releases.dependsOn t

  tasks.register("buildCPP_${edition}") {
    dependsOn "${edition}c_release_dir"

    def buildCPPScript = (systemOs.isMacOsX()
            ? "./build64-mac.sh"
            : (systemOs.isLinux()
            ? "./build64-linux.sh"
            : ".\\build-windows.bat"))

    doLast {
      exec {
        workingDir layout.buildDirectory.dir("${saxoncReleasePath}/samples/cppTests")
        if(systemOs.isLinux() || systemOs.isMacOsX()) {
          commandLine "${buildCPPScript}", "-L${file(layout.buildDirectory.file("${edition}c"))}"
        } else {
          commandLine "cmd","/c","${buildCPPScript}"
        }
        println "built C++ Wrappers"
      }
    }
  }

  ["XSLT30", "XPath", "XQuery", "Validator"].each { proc ->
    tasks.register("runCPP_${edition}_${proc}") {
      dependsOn "buildCPP_${edition}"

      doLast {
        exec {
          workingDir layout.buildDirectory.dir("${saxoncReleasePath}/samples/cppTests")
          commandLine "./test${proc}"
          println "built C++ Wrappers"
        }
      }
    }
  }
}

Provider<Directory> pythonBuildRootPath(String edition, Boolean debug = false) {
  layout.buildDirectory.dir("${edition}c/python${debug ? "-debug" : ""}")
}

Provider<Directory> pythonPackageDirPath(String edition, Boolean debug = false) {
  pythonBuildRootPath(edition, debug).map { it.dir("saxonc${edition}${debug ? "-debug" : ""}") }
}

