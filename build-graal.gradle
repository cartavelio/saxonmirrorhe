import java.security.MessageDigest

static String wheelShaDigest(File file) {
  def digest = MessageDigest.getInstance("sha1")
  def inputstream = file.newInputStream()
  def buffer = new byte[16384]
  def len
  while((len=inputstream.read(buffer)) > 0) {
    digest.update(buffer, 0, len)
  }
  def sha1sum = digest.digest()
  BigInteger bigInt = new BigInteger(1, sha1sum)
  return bigInt.toString(16).padLeft(32, '0')
}

private String findGraalBin(String edition) {
  String home = System.getenv("GRAALVM_${edition.toUpperCase()}_HOME")
  if (home == null) {
    String prefix = "graalvm-${edition.toLowerCase()}"
    // Where might we find GraalVM?
    ["/Library/Java/JavaVirtualMachines", "/lib/jvm", "/opt", "C:/GraalVM"].each { root ->
      File rdir = new File(root)
      if (rdir.exists() && rdir.isDirectory()) {
        rdir.list().each { fn ->
          if (fn.startsWith(prefix) && fn.contains(graalVersion)) {
            home = "${root}/${fn}"
          }
          if (fn.startsWith(prefix) && fn.contains(graalVersion)) {
            home = "${root}/${fn}"
          }
        }
      }
    }
  }

  if (home == null) {
    return null;
  }

  File bin = new File("${home}/bin")
  if (! bin.exists()) {
    bin = new File("${home}/Contents/Home/bin")
    if (! bin.exists()) {
      return null
    }
  }

  return bin.toString().replace("\\", "/")
}

private String nativeImage(String edition) {
  def bin = findGraalBin(edition)
  if (bin == null) {
    throw new GradleException("Cannot build SaxonC, cannot find Graal CE")
  }
  File image = new File("${bin}/native-image")
  if (!image.exists()) {
    // For Windows
    image = new File("${bin}/native-image.cmd") 
  }
  if (!image.exists()) {
    return null
  }
  return image.toString()
}

def graalCeBin = findGraalBin("ce")
def graalEeBin = findGraalBin("ee")

tasks.register("graal_ce_home") {
