    def libdir = (systemOs.isMacOsX()
            ? "libs/darwin"
            : (systemOs.isLinux()
            ? "libs/nix"
            : "libs/win"))

    from tasks.named("${edition}c_build_graal_image").map { it.sharedLibraryFiles }
    into layout.buildDirectory.dir("${saxoncReleasePath}/${libdir}")
  }

  tasks.register("${edition}c_release_graal_headers", Copy) {
    from tasks.named("${edition}c_build_graal_image").map { it.headerFiles }
    into layout.buildDirectory.dir("${saxoncReleasePath}/Saxon.C.API/graalvm")
  }

  tasks.register("${edition}c_release_c_files", Copy) {
    into layout.buildDirectory.dir(saxoncReleasePath)
    from(layout.projectDirectory.dir("src/main/c")) {
      include "README.md"
      include "samples/**"
      include "command/**"
      include "pypi/**"
      include "Saxon.C.API/*.h"
      include "Saxon.C.API/*.c"
      include "Saxon.C.API/*.cpp"
      include "Saxon.C.API/config.m4"
      include "Saxon.C.API/config.w32"
      exclude "pypi/python_saxon/**"
      if (edition != "ee") {
        exclude "command/Validate.c"
      }

      filter textReplacementFilter(edition)
    }

    from(layout.projectDirectory.dir("src/main/c")) {
      include "pypi/python_saxon/**"
      filter textReplacementFilter(edition, '../../')
    }

    from(layout.projectDirectory.dir("src/docs")) {
      include "notices/JAMESCLARK.txt"
      include "notices/JLINE2.txt"
      include "notices/LICENSE.txt"
    }
  }

  tasks.register("${edition}c_release_dir") {
    inputs.files(tasks.named("${edition}c_release_graal_shared_libs").map { it.outputs.files })
    inputs.files(tasks.named("${edition}c_release_graal_headers").map { it.outputs.files })
    inputs.files(tasks.named("${edition}c_release_c_files").map { it.outputs.files })

    outputs.dir(layout.buildDirectory.dir(saxoncReleasePath))
  }

  def t = tasks.register("${edition}c_release_zip", Zip) {
    dependsOn "${edition}c_release_dir"

    from layout.buildDirectory.dir("releases")
    include "${saxoncReleaseName}/**"
    archiveFileName = "${saxoncReleaseName}.zip"
  }
  all_saxonc_releases.dependsOn t

  tasks.register("buildCPP_${edition}") {
    dependsOn "${edition}c_release_dir"

    def buildCPPScript = (systemOs.isMacOsX()
            ? "./build64-mac.sh"
            : (systemOs.isLinux()
            ? "./build64-linux.sh"
            : ".\\build-windows.bat"))

    doLast {
      exec {
        workingDir layout.buildDirectory.dir("${saxoncReleasePath}/samples/cppTests")
        if(systemOs.isLinux() || systemOs.isMacOsX()) {
          commandLine "${buildCPPScript}", "-L${file(layout.buildDirectory.file("${edition}c"))}"
        } else {
          commandLine "cmd","/c","${buildCPPScript}"
        }
        println "built C++ Wrappers"
      }
    }
  }

  ["XSLT30", "XPath", "XQuery", "Validator"].each { proc ->
    tasks.register("runCPP_${edition}_${proc}") {
       dependsOn "buildCPP_${edition}"

       doLast {
         exec {
           workingDir layout.buildDirectory.dir("${saxoncReleasePath}/samples/cppTests")
           commandLine "./test${proc}"
           println "built C++ Wrappers"
         }
       }
     }
  }
}

def pythonPackageDirPath(String edition) {
  layout.buildDirectory.dir("${edition}c/python/saxonc${edition}")
}


["he", "pe", "ee"].each { edition ->
  //def graalEdition = edition == "he" ? "graal_ce_home" : "graal_ee_home"
  def graalEdition = "graal_ce_home"
  def pythonPackageDir = pythonPackageDirPath(edition)

  def libpath = systemOs.isWindows() ? 'libs\\\\win\\\\' : ''

  /**
   * eec/build/graalvm/*.jar
   * eec/build/graalvm/jar
   * eec/jar/libsaxon-eec-12.4.2.jar
   * eec/libsaxon/*.h
   * eec/libsaxon/*.dylib/so/dll
   * eec/python/.whl
   * eec/python/build
   * eec/python/saxoncee/requirements.txt
   * eec/python/installed_wheel.txt
   *
   * eec/jars/saxon-ee-12.4.2.jar vs
   * libs/libsaxon-eec-12.4.2.jar
   */

  tasks.register("setup_${edition}c_pypi") {
    inputs.files(tasks.named("${edition}c_build_graal_image").map { it.outputs.files })
    inputs.dir layout.projectDirectory.dir("src/main/c/pypi")
    inputs.dir layout.projectDirectory.dir("src/main/c/Saxon.C.API")

    outputs.dir pythonPackageDir

    doLast {
      copy {
        into pythonPackageDir
        from layout.projectDirectory.dir("src/main/c/pypi")
        filter textReplacementFilter(edition, '', libpath)
      }
    }

    doLast {
      def platformDir = (systemOs.isMacOsX() ? "darwin" : (systemOs.isLinux() ? "nix" : "win"))
      def SAXONC_HOME = pythonPackageDir.map { it.file("libs/${platformDir}") }

      if (SAXONC_HOME == null) {
        throw GradleException("Don't know how to create Python packages on this OS.");
      }
      copy {
        println("\"${edition}c_build_graal_image\" files:")
        println(tasks.named("${edition}c_build_graal_image").map { it.outputs.files}.get().files)
        into SAXONC_HOME
        from(tasks.named("${edition}c_build_graal_image").map { it.outputs.files})
      }
    }

    // What does this do?
    doLast {
      copy {
        from(tasks.named("${edition}c_build_graal_image").map { it.headerFiles })
        into pythonPackageDir.map{ it.dir("Saxon.C.API/graalvm") }
      }
      copy {
        from layout.projectDirectory.dir("src/main/c/pypi/python_saxon")
        into pythonPackageDir.map{ it.dir("python_saxon") }
        include "saxonc.pyx"
        include "saxoncClasses.pxd"
        include "readme.txt"
        filter textReplacementFilter(edition)
      }
      copy {
        from layout.projectDirectory.dir("src/main/c/pypi/python_saxon")
        into pythonPackageDir
        include "test_saxonc.py"
        include "test_saxon_schema.py"
        filter textReplacementFilter(edition)
      }
      copy {
        from layout.projectDirectory.dir("src/main/c/pypi/python_saxon")
        into pythonPackageDir.map{ it.dir("samples") }
        include "saxon_example.py"
        include "saxon_example2.py"
        include "saxon_example3.py"
        filter textReplacementFilter(edition)
      }
      copy {
        from layout.projectDirectory.dir("src/main/c/Saxon.C.API")
        into pythonPackageDir.map{ it.dir("Saxon.C.API") }

        include "*.h"
        include "*.c"
        include "*.cpp"
        exclude "php*"

        filter textReplacementFilter(edition)
      }
    }
  }

  tasks.register("${edition}c_pypi_pip_install", PipInstall) {
    pipExe = tasks.named("branchVenv").map { it.pipExe.get() }
    requirements = tasks.named("setup_${edition}c_pypi").map {pythonPackageDir.map { it.file("requirements.txt") }.get() }
  }

  tasks.register("${edition}c_python_build_wheel", BuildWheel) {
    pythonExe = tasks.named("branchVenv").map { it.pythonExe.get() }
    productEdition = edition
    productVersion = saxonVersion3
    // This weirdness is because we can't get just the dir from the outputs of the setup task,
    // but without a link to the setup task it won't get counted as a dependency and run.
    sourceDir = tasks.named("setup_${edition}c_pypi").map { pythonPackageDir.get() }
    libraryDir = tasks.named("${edition}c_build_graal_image").map { it.libraryDir.get() }
    outputDir = layout.buildDirectory.dir("${edition}c/python")
  }

  task "saxon_${edition}c_stage_wheel"(
    dependsOn: ["setup_${edition}c_pypi"]
  ) {
    def wheelDir = "wheels/${systemOsName}/${edition}c_pypi"

    inputs.files tasks.named("${edition}c_python_build_wheel").map { it.outputs.files }
    outputs.dir  layout.buildDirectory.dir(wheelDir)

    doLast {
      def libdir = (systemOs.isMacOsX()
                    ? "libs/darwin"
                    : (systemOs.isLinux()
                       ? "libs/nix"
                       : "libs/win"))
      if (libdir == null) {
        throw GradleException("Don't know how to create Python wheels on this OS.");
      }
     
      copy {
        into layout.buildDirectory.dir("${wheelDir}/${libdir}")
        from layout.buildDirectory.dir("c")
        include "graal*.h"
        include "libsaxon-${edition}c-${saxonVersion3}.*"
      }
    }

    doLast {
      copy {
        into layout.buildDirectory.dir(wheelDir)
        from layout.buildDirectory.dir("${edition}c_pypi")
      }
    }
  }
}

// I'd be inclined to give saxonc_stage_wheels, saxonc_prepare_wheels, and
// saxonc_build_wheels different names, but two of the names have been in use
// for a while, so I'm not changing them

task saxonc_stage_wheels(
  type: Tar,
  dependsOn: ['saxon_eec_stage_wheel', 'saxon_pec_stage_wheel', 'saxon_hec_stage_wheel']

) {
  inputs.files fileTree(dir: "${buildDir}/wheels/${systemOsName}")
  outputs.file "${buildDir}/distributions/${systemOsName}-${systemOsArch}.wheels.tar.gz"

  archiveFileName = "${systemOsName}-${systemOsArch}.wheels.tar.gz"
  from "${buildDir}/wheels"
  include "${systemOsName}/**"
  exclude "${systemOsName}/*/build/**"
  exclude "${systemOsName}/*/*.egg-info/**"
  compression = Compression.GZIP

  doLast {
    delete "${buildDir}/wheels/${systemOsName}"
  }
}

task saxonc_prepare_wheels(
  dependsOn: ['saxonc_stage_wheels']
) {
  def user = project.findProperty('wheelUser') ?: System.getProperty('user.name')
  if (user == 'ndw') {
    user = 'norm' // HACK
  }

  doFirst {
    if (awscli == null) {
      throw new GradleException("Did not find 'aws' on path")
    }
  }

  def wheels = "${systemOsName}-${systemOsArch}.wheels.tar.gz"
  if (project.findProperty("skipWheelUpload") == null
      && project.findProperty('wheelDryRun') == null) {
    doLast {
      println("Copying ${systemOsName} staging files to s3://saxonica-wheel-staging/${user}/${wheels}")
      exec {
        workingDir "${buildDir}/distributions"
        commandLine awscli, "--profile", "saxonica",
          "s3", "cp", "${wheels}",
          "s3://saxonica-wheel-staging/${user}/${wheels}"
      }
    }
  } else {
    doLast {
      println("Skipping upload of ${wheels}")
    }
  }
}

task saxonc_build_wheels(
  dependsOn: ['saxonc_prepare_wheels']
) {
  def user = project.findProperty('wheelUser') ?: System.getProperty('user.name')
  if (user == 'ndw') {
    user = 'norm' // HACK
  }

  def now = new Date()
  def isodate = "${now.format('yyyy-MM-dd')}T${now.format('HH-mm-ss')}"

  def buildMacA64    = project.findProperty('macWheels_aarch64') != null
  def buildMacX86    = project.findProperty('macWheels_x86_64') != null
  def buildLinuxA64  = project.findProperty('linuxWheels_aarch64') != null
  def buildLinuxX86  = project.findProperty('linuxWheels_x86_64') != null
  def buildWindows   = project.findProperty('windowsWheels') != null

  if (!buildMacA64 && !buildMacX86 && !buildLinuxA64 && !buildLinuxX86 && !buildWindows) {
    if (systemOs.isMacOsX()) {
      if (systemOsArch == 'x86_64') {
        buildMacX86 = true
      } else {
        buildMacA64 = true
      }
    }
    if (systemOs.isLinux()) {
      if (systemOsArch == 'x86_64') {
        buildLinuxX86 = true
      } else {
        buildLinuxA64 = true
      }
    }
    buildWindows = systemOs.isWindows()
  }

  def arch = []
  if (buildMacX86) {
    arch.add("macx86_64")
  }
  if (buildMacA64) {
    arch.add("macaarch64")
  }
  if (buildLinuxX86) {
    arch.add("linuxx86_64")
  }
  if (buildLinuxA64) {
    arch.add("linuxaarch64")
  }
  if (buildWindows) {
    arch.add("windows")
  }

  doFirst {
    delete "${buildDir}/BuildWheels"
  }

  doLast {
    println("Cloning BuildWheels")
    exec {
      workingDir buildDir
      commandLine 'git', 'clone', 'git@github.com:Saxonica/BuildWheels.git'
    }
  }

  doLast {
    println("Creating build configuration")
    def m = new PrintStream(new File("${buildDir}/BuildWheels/config.json"))
    m.println("{")
    m.println("  \"user\": \"${user}\",")
    m.println("  \"macx86_64\": ${buildMacX86},")
    m.println("  \"macaarch64\": ${buildMacA64},")
    m.println("  \"linuxx86_64\": ${buildLinuxX86},")
    m.println("  \"linuxaarch64\": ${buildLinuxA64},")
    m.println("  \"windows\": ${buildWindows},")

    if (buildMacX86) {
      def path = project.findProperty('macWheels_x86_64') ?: projectDir
      m.println("  \"macpath\": \"${path}\",")
    }

    if (buildMacA64) {
      def path = project.findProperty('macWheels_aarch64') ?: projectDir
      m.println("  \"macpath\": \"${path}\",")
    }

    m.println("  \"date\": \"${isodate}\"")
    m.println("}")
    m.close()
  }

  if (project.findProperty('wheelDryRun') == null) {
    doLast {
      def msg = "Triggered by ${user} on ${isodate} for ${arch.join(', ')}"

      exec {
        workingDir "${buildDir}/BuildWheels"
        commandLine 'git', 'commit', '-m', msg, 'config.json'
      }
    }

    doLast {
      println("Pushing build trigger")
      exec {
        workingDir "${buildDir}/BuildWheels"
        commandLine 'git', 'push'
      }
    }
  } else {
    doLast {
      println("Dry run: trigger not pushed.")
    }
  }
}

// ============================================================
// Tasks for running the Python test suites


tasks.register("all_python_test_suites") {
  description "Runs all the Python test suites for HE, PE, and EE"
}

["ee", "pe", "he"].each { edition ->
  def pythonPackageDir = pythonPackageDirPath(edition)

  def editionSuites = tasks.register("python_${edition}_test_suites") {
    description "Runs all Python the test suites for ${edition}"
  }
  tasks.named("all_python_test_suites") {
    dependsOn editionSuites
  }

  tasks.register("${edition}c_python_install_wheel", InstallLocalWheel) {
    pipExe = tasks.named("branchVenv").map { it.pipExe.get() }
    wheel = tasks.named("${edition}c_python_build_wheel").map { it.wheel.get() }
  }

  tasks.register("${edition}c_pytest_data", Copy) {
    from layout.projectDirectory.dir("src/main/c/samples/data")
    into pythonPackageDir.map { it.dir("samples/data") }
  }

  tasks.register("${edition}c_pytest") {
    dependsOn "${edition}c_pypi_pip_install"
    dependsOn "${edition}c_python_install_wheel"

    def Provider<Directory> pytestDataDir = tasks.named("${edition}c_pytest_data").map { it.destinationDir }
    def Provider<RegularFile> pytest = pythonEnv.venvBinHostedExe("pytest")

    inputs.dir pytestDataDir

    doLast {
      exec {
        workingDir pythonPackageDir
        executable pytest.get()
        args "--data-dir", file(pytestDataDir), "./test_saxonc.py"
        environment SAXONC_HOME: saxonLicenseDir
//        environment SAXONC_DEBUG_FLAG: "true", SAXONC_TESTSUITE_DEBUG: "true"
      }
    }
  }

  ["xslt30", "qt3"].each { testsuite ->
    def langs
    if (testsuite == "qt3") {
      langs = ["XP31", "XQ31", "XP40", "XQ40"]
    } else {
      langs = ["all"]
    }

    def suiteTask = tasks.register("${edition}c_python_${testsuite}_test_suite")

    editionSuites.configure {
      dependsOn suiteTask
    }

    langs.each { lang ->
      def langslug
      if (lang == "") {
        langslug = ""
      } else {
        langslug = "_${lang}"
      }

      tasks.register("${edition}c_python_${testsuite}_test_suite${langslug}") {
        dependsOn "${edition}c_python_install_wheel"

        def output_path = layout.buildDirectory.dir("test-results/${edition}c/${saxonVersion3}/${testsuite}/${DSTAMP}")
        def pythonExe = tasks.named("branchVenv").map { it.pythonExe.get() }
        def pipExe = tasks.named("branchVenv").map { it.pipExe.get() }

        inputs.file pythonExe
        inputs.file pipExe
        inputs.files layout.buildDirectory.dir("${edition}c_pypi/testsuite_driver")
        outputs.dir output_path

        doLast {
          copy {
            from layout.projectDirectory.dir("src/main/c/pypi/testsuite_driver")
            into layout.buildDirectory.dir("${edition}c/${edition}c_testsuite_driver")
            filter textReplacementFilter(edition)
          }

          exec {
            workingDir layout.buildDirectory.dir("${edition}c_pypi/testsuite_driver")

            executable pipExe.get()
            args "install", "-r", "requirements.txt"
          }

          exec {
            workingDir layout.buildDirectory.dir("${edition}c_pypi/testsuite_driver")

            def suitedir
            if (testsuite == "xslt30") {
              suitedir = "${testsuites.w3cXslt30TestSuiteDir}/.."
            } else if (testsuite == "qt3") {
              suitedir = testsuites.w3cQT3TestSuiteDir
            } else {
              throw new GradleException("Unexpected test suite: ${testsuite}")
            }

            executable pythonExe.get()
            args "./${testsuite}_test_suite_driver.py",
                    suitedir,
                    "-o", file(output_path)
            if (testsuite == "qt3") {
              args "-l", lang
            }
            environment SAXONC_HOME: saxonLicenseDir
//            environment SAXONC_DEBUG_FLAG: "true", SAXONC_TESTSUITE_DEBUG: "true"
          }
        }
      }

      suiteTask.configure {
        dependsOn "${edition}c_python_${testsuite}_test_suite${langslug}"
      }
    }
  }
}

