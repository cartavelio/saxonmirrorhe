["he", "pe", "ee"].each { edition ->
  //def graalEdition = edition == "he" ? "ce" : "ee"
  def graalEdition = "ce"

  tasks.register("graal_setup_${edition}c_jar", Copy) {
    from(zipTree(tasks.named("graal_${edition}c_jar").map { it.archiveFile })) {
      exclude "META-INF/TE*"
    }
    from(layout.projectDirectory.dir("src/graalvm/")) {
