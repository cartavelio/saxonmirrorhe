task setup_pypi(
  dependsOn: ["graalImage"]
) {
  inputs.files fileTree(dir: "${projectDir}/src/main/c/Saxon.C.API")
  outputs.files fileTree(dir: "${buildDir}/pypi", exclude: "dist/**")

  doLast {
    copy {
      into "${buildDir}/pypi"
      from "${projectDir}/src/main/c/Saxon.C.API/python-saxon/pypi_saxonc-ee"
    }
  }

  def SAXONC_HOME = null
  if (systemOs.isMacOsX()) {
    SAXONC_HOME = "${buildDir}/pypi/libs/darwin"
  } else if (systemOs.isLinux()) {
    SAXONC_HOME = "${buildDir}/pypi/libs/nix"
  } else {
    throw GradleException("Don't know how to create Python packages on this OS.");
  }

  doLast {
    copy {
      into SAXONC_HOME
      from "${buildDir}/c"
      include "libsaxon-eec-*"
    }
  }

  doLast {
    copy {
      from SAXONC_HOME
      into "${buildDir}/pypi/src/saxonc_home"
    }
  }
      
  doLast {
    copy {
      from "${projectDir}/src/main/c/Saxon.C.API/graalvm"
      into "${buildDir}/pypi/Saxon.C.API/graalvm"
    }
  }

  doLast {
    copy {
      from "${projectDir}/src/main/c/Saxon.C.API/python-saxon"
      into "${buildDir}/pypi/python_saxon"
      include "saxonc.pyx"
      include "saxoncClasses.pxd"
      include "nodekind.py"
      include "readme.txt"
    }
  }

  doLast {
    copy {
      from "${projectDir}/src/main/c/Saxon.C.API"
      into "${buildDir}/pypi/Saxon.C.API"
      include "SaxonProcessor.cpp"
      include "SaxonCGlue.c"
      include "SaxonCProcessor.c"
      include "SaxonCXPath.c"
      include "XdmValue.cpp"
      include "XdmItem.cpp"
      include "XdmNode.cpp"
      include "XdmAtomicValue.cpp"
      include "XdmFunctionItem.cpp"
      include "XdmMap.cpp"
      include "XdmArray.cpp"
      include "DocumentBuilder.cpp"
      include "Xslt30Processor.cpp"
      include "XsltExecutable.cpp"
      include "XQueryProcessor.cpp"
      include "XPathProcessor.cpp"
      include "SchemaValidator.cpp"
      include "SaxonApiException.cpp"
      include "SaxonProcessor.h"
      include "SaxonCGlue.h"
      include "SaxonCProcessor.h"
      include "SaxonCXPath.h"
      include "XdmValue.h"
      include "XdmItem.h"
      include "XdmNode.h"
      include "XdmAtomicValue.h"
      include "XdmFunctionItem.h"
      include "XdmMap.h"
      include "XdmArray.h"
      include "DocumentBuilder.h"
      include "Xslt30Processor.h"
      include "XsltExecutable.h"
      include "XQueryProcessor.h"
      include "XPathProcessor.h"
      include "SchemaValidator.h"
      include "SaxonApiException.h"
    }
  }
}

task saxoncee_pypi(
  type: Exec,
  dependsOn: ["setup_pypi"]
) {
  inputs.files setup_pypi.outputs.getFiles()
  outputs.files fileTree(dir: "${buildDir}/pypi/dist")

  workingDir "${buildDir}/pypi"
  commandLine "python3", "setup.py", "bdist_wheel"
}
