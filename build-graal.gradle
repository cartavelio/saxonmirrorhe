    }
  }
}

private String findPyenv() {
  if (pyenvex != null || pyenvsearch) {
    return
  }
  pyenvsearch = true

  def spath = System.getenv("PATH").split(System.getProperty("path.separator"))
  spath.each { dir ->
    if (pyenvex == null) {
      def fn = new File(dir + "/pyenv")
      if (fn.exists() && fn.canExecute()) {
        pyenvex = fn.toString()
      } else {
        fn = new File(dir + "/pyenv.bat")     // ???
        if (fn.exists() && fn.canExecute()) {
          pyenvex = fn.toString()
        }
      }
    }
  }

  if (pyenvex == null) {
    println("WARNING: Failed to find pyenv[.bat]!")
  }
}

