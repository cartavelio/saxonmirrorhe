tasks.register("pyBuildVenv") {
  description "Ensure there is a Python Venv for the current branch, creating one if none exists"

  // only if the venv is not there
  // (caching this won't work - we don't know the outputs until the task is run)
  onlyIf {
    !file(project.pythonEnv.venvDirPath.map { "${it}/pyvenv.cfg" }).exists()
  }
  outputs.dir(project.pythonEnv.venvDirPath.map{ it.toString() })

  doFirst {
    exec {
      logger.info("Creating Python Venv for ${project.branches.current.get()}")
      executable project.pythonEnv.systemPythonBinary.get()
      args "-m", "venv", project.pythonEnv.venvDirPath.get()
    }
  }
}

