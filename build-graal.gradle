// I'd be inclined to give saxonc_stage_wheels, saxonc_prepare_wheels, and
// saxonc_build_wheels different names, but two of the names have been in use
// for a while, so I'm not changing them

def saxoncStageWheels = tasks.register("saxonc_stage_wheels", Tar) {
  inputs.files tasks.named("saxon_hec_stage_wheel")
  inputs.files tasks.named("saxon_pec_stage_wheel")
  inputs.files tasks.named("saxon_eec_stage_wheel")

  archiveFileName = "${systemOsName}-${systemOsArch}.wheels.tar.gz"
  from layout.buildDirectory.dir("wheels")
  include "${systemOsName}/**"
  exclude "${systemOsName}/*/build/**"
  exclude "${systemOsName}/*/*.egg-info/**"
  compression = Compression.GZIP

  doLast {
    delete layout.buildDirectory.dir("wheels/${systemOsName}")
  }
}

tasks.register("saxonc_prepare_wheels") {
  inputs.files saxoncStageWheels

  def user = project.findProperty('wheelUser') ?: System.getProperty('user.name')
  if (user == 'ndw') {
    user = 'norm' // HACK
  }

  doFirst {
    if (awscli == null) {
      throw new GradleException("Did not find 'aws' on path")
    }
  }

  def wheels = "${systemOsName}-${systemOsArch}.wheels.tar.gz"
  if (project.findProperty("skipWheelUpload") == null
          && project.findProperty('wheelDryRun') == null) {
    doLast {
      println("Copying ${systemOsName} staging files to s3://saxonica-wheel-staging/${user}/${wheels}")
      exec {
        workingDir layout.buildDirectory.dir("distributions")
        commandLine awscli, "--profile", "saxonica",
                "s3", "cp", saxoncStageWheels.map { it.archiveFile.get().asFile.toString() }.get(),
                "s3://saxonica-wheel-staging/${user}/${wheels}"
      }
    }
  } else {
    doLast {
      println("Skipping upload of ${wheels}")
    }
  }
}

task saxonc_build_wheels(
        dependsOn: ['saxonc_prepare_wheels']
) {
  def user = project.findProperty('wheelUser') ?: System.getProperty('user.name')
  if (user == 'ndw') {
    user = 'norm' // HACK
  }

  def now = new Date()
  def isodate = "${now.format('yyyy-MM-dd')}T${now.format('HH-mm-ss')}"

  def buildMacA64    = project.findProperty('macWheels_aarch64') != null
  def buildMacX86    = project.findProperty('macWheels_x86_64') != null
  def buildLinuxA64  = project.findProperty('linuxWheels_aarch64') != null
  def buildLinuxX86  = project.findProperty('linuxWheels_x86_64') != null
  def buildWindows   = project.findProperty('windowsWheels') != null

  if (!buildMacA64 && !buildMacX86 && !buildLinuxA64 && !buildLinuxX86 && !buildWindows) {
    if (systemOs.isMacOsX()) {
      if (systemOsArch == 'x86_64') {
        buildMacX86 = true
      } else {
        buildMacA64 = true
      }
    }
    if (systemOs.isLinux()) {
      if (systemOsArch == 'x86_64') {
        buildLinuxX86 = true
      } else {
        buildLinuxA64 = true
      }
    }
    buildWindows = systemOs.isWindows()
  }

  def arch = []
  if (buildMacX86) {
    arch.add("macx86_64")
  }
  if (buildMacA64) {
    arch.add("macaarch64")
  }
  if (buildLinuxX86) {
    arch.add("linuxx86_64")
  }
  if (buildLinuxA64) {
    arch.add("linuxaarch64")
  }
  if (buildWindows) {
    arch.add("windows")
  }

  doFirst {
    delete "${buildDir}/BuildWheels"
  }

  doLast {
    println("Cloning BuildWheels")
    exec {
      workingDir buildDir
      commandLine 'git', 'clone', 'git@github.com:Saxonica/BuildWheels.git'
    }
  }

  doLast {
    println("Creating build configuration")
    def m = new PrintStream(new File("${buildDir}/BuildWheels/config.json"))
    m.println("{")
    m.println("  \"user\": \"${user}\",")
    m.println("  \"macx86_64\": ${buildMacX86},")
    m.println("  \"macaarch64\": ${buildMacA64},")
    m.println("  \"linuxx86_64\": ${buildLinuxX86},")
    m.println("  \"linuxaarch64\": ${buildLinuxA64},")
    m.println("  \"windows\": ${buildWindows},")

    if (buildMacX86) {
      def path = project.findProperty('macWheels_x86_64') ?: projectDir
      m.println("  \"macpath\": \"${path}\",")
    }

    if (buildMacA64) {
      def path = project.findProperty('macWheels_aarch64') ?: projectDir
      m.println("  \"macpath\": \"${path}\",")
    }

    m.println("  \"date\": \"${isodate}\"")
    m.println("}")
    m.close()
  }

  if (project.findProperty('wheelDryRun') == null) {
    doLast {
      def msg = "Triggered by ${user} on ${isodate} for ${arch.join(', ')}"

      exec {
        workingDir "${buildDir}/BuildWheels"
        commandLine 'git', 'commit', '-m', msg, 'config.json'
      }
    }

    doLast {
      println("Pushing build trigger")
      exec {
        workingDir "${buildDir}/BuildWheels"
        commandLine 'git', 'push'
      }
    }
  } else {
    doLast {
      println("Dry run: trigger not pushed.")
    }
  }
}

// ============================================================
// Tasks for running the Python test suites


tasks.register("all_python_test_suites") {
  description "Runs all the Python test suites for HE, PE, and EE"
}

["ee", "pe", "he"].each { edition ->
  def pythonPackageDir = pythonPackageDirPath(edition)

  def editionSuites = tasks.register("python_${edition}_test_suites") {
    description "Runs all Python the test suites for ${edition}"
  }
  tasks.named("all_python_test_suites") {
    dependsOn editionSuites
  }

  tasks.register("${edition}c_python_install_wheel", InstallLocalWheel) {
    pipExe = branchVenvTask.map { it.pipExe.get() }
    wheel = tasks.named("${edition}c_python_repair_wheel").map { it.repairedWheel.get() }
  }

  tasks.register("${edition}c_python_install_debug_wheel", InstallLocalWheel) {
    pipExe = branchDebugVenvTask.map { it.pipExe.get() }
    wheel = tasks.named("${edition}c_python_repair_debug_wheel").map { it.repairedWheel.get() }
  }

  tasks.register("${edition}c_pytest_data", Copy) {
    from layout.projectDirectory.dir("src/main/c/samples/data")
    into pythonBuildRootPath(edition).map { it.dir("samples") }
  }

  tasks.register("${edition}c_python_repair_test_wheel", RepairLocalWheel) {
    outputDir = pythonBuildRootPath(edition)
    pythonExe = branchVenvTask.map { it.pythonExe.get() }
    manylinuxTarget = "linux"
    pythonVenvTask = branchVenvTask
    productEdition = edition
    repairedWheelFilePlatformSuffix = wheelPlatformTagTask.flatMap { it.wheelSuffix }
    libraryDir = tasks.named("${edition}c_build_graal_image").map { it.libraryDir.get() }
    wheel = tasks.named("${edition}c_python_build_wheel").map { it.wheel.get() }
  }

  tasks.register("${edition}c_python_install_test_wheel", InstallLocalWheel) {
    pipExe = branchVenvTask.map { it.pipExe.get() }
    wheel = tasks.named("${edition}c_python_repair_test_wheel").map { it.repairedWheel.get() }
  }

  tasks.register("${edition}c_pytest", PytestRunner) {
    dependsOn "${edition}c_pypi_pip_install"
    dependsOn "${edition}c_python_install_test_wheel"
    dependsOn "${edition}c_pytest_data"

    pytest = branchVenvTask.map { it.venvBinHostedExe("pytest").get() }

    workingDir pythonPackageDir
    environment SAXONC_HOME: saxonLicenseDir
    //environment SAXONC_DEBUG_FLAG: "true"//, SAXONC_TESTSUITE_DEBUG: "true"

    baseArgs "--import-mode=importlib", "--data-dir", file(tasks.named("${edition}c_pytest_data").map { it.destinationDir })
    tests "test_saxonc.py", "tests"
  }

  tasks.register("${edition}c_python_test_suite_pip_install", PipInstall) {
    pipExe = branchVenvTask.map { it.pipExe.get() }
    requirements = tasks.named("setup_${edition}c_pypi").map { it.packageDir.map { it.file("testsuite_driver/requirements.txt") }.get() }
  }


  ["xslt30", "qt3"].each { testsuite ->
    def langs
    if (testsuite == "qt3") {
      langs = ["XP31", "XQ31", "XP40", "XQ40"]
    } else {
      langs = ["all"]
    }

    def suiteTask = tasks.register("${edition}c_python_${testsuite}_test_suite")

    editionSuites.configure {
      dependsOn suiteTask
    }

    langs.each { lang ->
      def langslug
      if (lang == "") {
        langslug = ""
      } else {
        langslug = "_${lang}"
      }

      tasks.register("${edition}c_python_${testsuite}_test_suite${langslug}") {
        dependsOn "${edition}c_python_install_test_wheel"
        dependsOn "${edition}c_python_test_suite_pip_install"

        def output_path = layout.buildDirectory.dir("test-results/${edition}c/${saxonVersion3}/${testsuite}/${DSTAMP}")
        def pythonExe = branchVenvTask.map { it.pythonExe.get() }
        def pipExe = branchVenvTask.map { it.pipExe.get() }
        def testsuiteDriverDir = pythonPackageDir.map { it.dir("testsuite_driver") }
        inputs.file pythonExe
        inputs.file pipExe
        inputs.files testsuiteDriverDir
        outputs.dir output_path

        doLast {
          exec {
            workingDir testsuiteDriverDir

            def suitedir
            if (testsuite == "xslt30") {
              suitedir = "${testsuites.w3cXslt30TestSuiteDir}"
            } else if (testsuite == "qt3") {
              suitedir = testsuites.w3cQT3TestSuiteDir
            } else {
              throw new GradleException("Unexpected test suite: ${testsuite}")
            }

            executable pythonExe.get()
            args "./${testsuite}_test_suite_driver.py",
                    suitedir, "-c", "catalog.xml",
                    "-o", file(output_path)
            if (testsuite == "qt3") {
              args "-l", lang
            }
            environment SAXONC_HOME: saxonLicenseDir
//            environment SAXONC_DEBUG_FLAG: "true", SAXONC_TESTSUITE_DEBUG: "true"
          }
        }
      }

      suiteTask.configure {
        dependsOn "${edition}c_python_${testsuite}_test_suite${langslug}"
      }
    }
  }
}
