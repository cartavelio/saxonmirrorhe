  def saxoncReleaseName = "libsaxon-${EDITION}C-${systemOsName}-v${saxonVersion}"
  if (systemOs.isMacOsX()) {
    def arch = System.getProperty("os.arch") 
    saxoncReleaseName = "libsaxon-${EDITION}C-${systemOsName}-${arch}-v${saxonVersion}"
  }
  def saxoncReleaseDir = "${buildDir}/releases/${saxoncReleaseName}"

  task "setup_${edition}c_release"(
          dependsOn: [graalEdition, "${edition}c_graalImage"]
  ) {
    inputs.files fileTree(dir: "${projectDir}/src/main/c")
    outputs.files fileTree(dir: saxoncReleaseDir, exclude: "dist/**")

    def libdir = (systemOs.isMacOsX()
                        ? "libs/darwin"
                        : (systemOs.isLinux()
                           ? "libs/nix"
                           : "libs/win"))

    def location = "../"

    def libpath = ''
    def saxonc_lib = ''
    if (systemOs.isLinux()) {
      libpath = "../libs/nix"
      saxonc_lib = "libsaxon-${edition}c-*.so"
    } else if (systemOs.isMacOsX()) {
      libpath = "../libs/darwin"
      saxonc_lib = "libsaxon-${edition}c-*.dylib"
    } else {
      libpath = "..\\\\libs\\\\win\\\\"
      saxonc_lib = "libsaxon-${edition}c-*.*"
    }

    doLast {
      copy {
        into "${saxoncReleaseDir}/${libdir}"
        from "${buildDir}/c"
        include "${saxonc_lib}"
      }
    }

    doLast {
      copy {
        from "${projectDir}/src/main/c"
        into "${saxoncReleaseDir}"
        include "README.md"
        filter { line ->
          line.replaceAll('@@VERSION@@', saxonVersion)
                  .replace('@@edition@@', edition)
                  .replace('@@EDITION@@', edition.toUpperCase())
        }
      }
    }

    doLast {
      copy {
        from "${buildDir}/c/"
        into "${saxoncReleaseDir}/Saxon.C.API/graalvm"
        include "graal*.h"
        include "libsaxon-${edition}c*.h"
      }
    }

    doLast {
      copy {
        from "${projectDir}/src/main/c/pypi"
        into "${saxoncReleaseDir}/pypi"
        filter { line ->
          line.replaceAll('@@VERSION@@', saxonVersion)
                  .replace('@@edition@@', edition)
                  .replace('@@EDITION@@', edition.toUpperCase())
                  .replace('@@libpath@@', libpath)
                  .replace('@@location@@', location)
        }
      }
    }
    doLast {
      copy {
        from "${projectDir}/src/main/c/samples"
        into "${saxoncReleaseDir}/samples"
        filter { line ->
          line.replaceAll('@@VERSION@@', saxonVersion)
                  .replace('@@edition@@', edition)
                  .replace('@@EDITION@@', edition.toUpperCase())
        }
      }
    }

    doLast {
      copy {
        from "${projectDir}/src/main/c/command"
        into "${saxoncReleaseDir}/command"
        filter { line ->
          line.replaceAll('@@VERSION@@', saxonVersion)
                  .replace('@@edition@@', edition)
                  .replace('@@EDITION@@', edition.toUpperCase())
                  .replace('@@libdir@@', libdir)
        }
      }
    }

    doLast {
      copy {
        from "${projectDir}/src/main/c/Saxon.C.API"
        into "${saxoncReleaseDir}/Saxon.C.API"
        include "SaxonProcessor.cpp"
        include "SaxonCGlue.c"
        include "SaxonCProcessor.c"
        include "SaxonCXPath.c"
        include "XdmValue.cpp"
        include "XdmItem.cpp"
        include "XdmNode.cpp"
        include "XdmAtomicValue.cpp"
        include "XdmFunctionItem.cpp"
        include "XdmMap.cpp"
        include "XdmArray.cpp"
        include "DocumentBuilder.cpp"
        include "Xslt30Processor.cpp"
        include "XsltExecutable.cpp"
        include "XQueryProcessor.cpp"
        include "XPathProcessor.cpp"
        include "SchemaValidator.cpp"
        include "SaxonApiException.cpp"
        include "SaxonProcessor.h"
        include "SaxonCGlue.h"
        include "SaxonCProcessor.h"
        include "SaxonCXPath.h"
        include "XdmValue.h"
        include "XdmItem.h"
        include "XdmNode.h"
        include "XdmAtomicValue.h"
        include "XdmFunctionItem.h"
        include "XdmMap.h"
        include "XdmArray.h"
        include "DocumentBuilder.h"
        include "Xslt30Processor.h"
        include "XsltExecutable.h"
        include "XQueryProcessor.h"
        include "XPathProcessor.h"
        include "SchemaValidator.h"
        include "SaxonApiException.h"
        include "php8_DocumentBuilder.cpp"
        include "php8_Xslt30Processor.cpp"
        include "php8_saxon_arginfo.h"
        include "php8_SchemaValidator.cpp"
        include "php8_XsltExecutable.cpp"
        include "php8_saxon.cpp"
        include "php8_XPathProcessor.cpp"
        include "php8_saxon.h"
        include "php8_XQueryProcessor.cpp"
        include "config.m4"
        include "config.w32"
        filter { line ->
          line.replaceAll('@@VERSION@@', saxonVersion)
                  .replace('@@edition@@', edition)
                  .replace('@@EDITION@@', edition.toUpperCase())
        }
      }
    }

    doLast {
      copy {
        into "${saxoncReleaseDir}/notices"
        from "${projectDir}/src/docs/notices"
        include "JAMESCLARK.txt"
        include "JLINE2.txt"
        include "LICENSE.txt"
      }
    }
  }

  Task t = task "zip_${edition}c_release"(
    type: Zip,
    dependsOn: ["setup_${edition}c_release"]
  ) {
    from "${buildDir}/releases"
    include "${saxoncReleaseName}/**"
    archiveFileName = "${saxoncReleaseName}.zip"
  }
  all_saxonc_releases.dependsOn t

  task "buildCPP_${edition}"(
          dependsOn: ["setup_${edition}c_release"]
  ) {
    def buildCPPScript = (systemOs.isMacOsX()
            ? "./build64-mac.sh"
            : (systemOs.isLinux()
            ? "./build64-linux.sh"
            : ".\\build-windows.bat"))

    doLast {
      exec {
        workingDir "${saxoncReleaseDir}/samples/cppTests"
        if(systemOs.isLinux() || systemOs.isMacOsX()) {
          commandLine "${buildCPPScript}", "-L${sharedLibDir}"
        } else {
          commandLine "cmd","/c","${buildCPPScript}"
        }
        println "built C++ Wrappers"
      }
    }
  }

  ["XSLT30", "XPath", "XQuery", "Validator"].each { proc ->
    task "runCPP_${edition}_${proc}"(
             dependsOn: ["buildCPP_${edition}"]
     ) {
       doLast {
         exec {
           workingDir "${saxoncReleaseDir}/samples/cppTests"
           commandLine "./test${proc}"
           println "built C++ Wrappers"
         }
       }
     }
  }
}

["he", "pe", "ee"].each { edition ->
  //def graalEdition = edition == "he" ? "graal_ce_home" : "graal_ee_home"
  def graalEdition = "graal_ce_home"
  def pypiDir = "${buildDir}/${edition}c_pypi"

  def libpath = ''
  def lastLinePatch = ''
  if (systemOsName == 'linux') {
    lastLinePatch = ('[tool.cibuildwheel]\n'
                     + 'build = "*"\n'
                     + 'skip = ["cp36*", "cp37*", "pp37*", "cp*musl*"]\n'
                     + 'archs = ["x86_64"]\n'
                     + 'environment.LD_LIBRARY_PATH = "/project/libs/nix"\n')
  } else if (systemOsName == 'windows') {
    lastLinePatch = ('[tool.cibuildwheel]\n'
                     + 'build = "*"\n'
                     + 'archs = ["AMD64"]\n'
                     + 'skip = ["*-win32", "cp36*", "cp37*", "pp37*", "cp*musl*"]\n')
    libpath = "libs\\\\win\\\\"
  }

  task "setup_${edition}c_pypi"(
    dependsOn: [graalEdition, "${edition}c_graalImage"]
  ) {
    inputs.files fileTree(dir: "${projectDir}/src/main/c/pypi")
    inputs.files fileTree(dir: "${projectDir}/src/main/c/Saxon.C.API")
    outputs.files fileTree(dir: pypiDir, exclude: "dist/**")

    doLast {
      copy {
        into pypiDir
        from "${projectDir}/src/main/c/pypi"
        filter { line ->
          line.replaceAll('@@VERSION@@', saxonVersion)
            .replace('@@edition@@', edition)
            .replace('@@EDITION@@', edition.toUpperCase())
            .replace('@@location@@', '')
	    .replace('@@libpath@@', libpath)
            .replace('[LAST-LINE-BUILD-PATCH]', lastLinePatch)
        }
      }
    }
    
    def SAXONC_HOME = (systemOs.isMacOsX()
                       ? "${pypiDir}/libs/darwin"
                       : (systemOs.isLinux()
                          ? "${pypiDir}/libs/nix"
                          : "libs/win"))

    doLast {
      if (SAXONC_HOME == null) {
        throw GradleException("Don't know how to create Python packages on this OS.");
      }
      copy {
        into SAXONC_HOME
        from "${buildDir}/c"
        include "libsaxon-${edition}c-*"
      }
    }

    doLast {
      copy {
        from "${buildDir}/c/"
        into "${buildDir}/${edition}c_pypi/Saxon.C.API/graalvm"
        include "graal*.h"
        include "libsaxon-${edition}c*.h"
      }
    }
    
    doLast {
      copy {
        from "${projectDir}/src/main/c/pypi/python_saxon"
        into "${buildDir}/${edition}c_pypi/python_saxon"
        include "saxonc.pyx"
        include "saxoncClasses.pxd"
        include "readme.txt"
        filter { line ->
          line.replace('@@edition@@', edition)
        }
      }
    }

    doLast {
      copy {
        from "${projectDir}/src/main/c/pypi/python_saxon"
        into "${buildDir}/${edition}c_pypi"
        include "test_saxonc.py"
        include "test_saxon_schema.py"
        filter { line ->
          line.replace('@@edition@@', edition)
        }
      }
    }

    doLast {
      copy {
        from "${projectDir}/src/main/c/pypi/python_saxon"
        into "${buildDir}/${edition}c_pypi/samples"
        include "saxon_example.py"
        include "saxon_example2.py"
        include "saxon_example3.py"
        filter { line ->
          line.replace('@@edition@@', edition)
        }
      }
    }

    doLast {
      copy {
        from "${projectDir}/src/main/c/Saxon.C.API"
        into "${buildDir}/${edition}c_pypi/Saxon.C.API"
        include "SaxonProcessor.cpp"
        include "SaxonCGlue.c"
        include "SaxonCProcessor.c"
        include "SaxonCXPath.c"
        include "XdmValue.cpp"
        include "XdmItem.cpp"
        include "XdmNode.cpp"
        include "XdmAtomicValue.cpp"
        include "XdmFunctionItem.cpp"
        include "XdmMap.cpp"
        include "XdmArray.cpp"
        include "DocumentBuilder.cpp"
        include "Xslt30Processor.cpp"
        include "XsltExecutable.cpp"
        include "XQueryProcessor.cpp"
        include "XPathProcessor.cpp"
        include "SchemaValidator.cpp"
        include "SaxonApiException.cpp"
        include "SaxonProcessor.h"
        include "SaxonCGlue.h"
        include "SaxonCProcessor.h"
        include "SaxonCXPath.h"
        include "XdmValue.h"
        include "XdmItem.h"
        include "XdmNode.h"
        include "XdmAtomicValue.h"
        include "XdmFunctionItem.h"
        include "XdmMap.h"
        include "XdmArray.h"
        include "DocumentBuilder.h"
        include "Xslt30Processor.h"
        include "XsltExecutable.h"
        include "XQueryProcessor.h"
        include "XPathProcessor.h"
        include "SchemaValidator.h"
        include "SaxonApiException.h"
        filter { line ->
          line.replaceAll('@@VERSION@@', saxonVersion)
            .replace('@@edition@@', edition)
            .replace('@@EDITION@@', edition.toUpperCase())
        }
      }
    }
  }

  task "saxon_${edition}c_pypi"(
    dependsOn: ["setup_${edition}c_pypi"]
  ) {
    inputs.files tasks.findByName("setup_${edition}c_pypi").outputs.getFiles()
    outputs.files fileTree(dir: "${buildDir}/${edition}c_pypi/dist")

    doLast {
      exec {
        workingDir "${buildDir}/${edition}c_pypi"
        if(systemOs.isMacOsX() || systemOs.isLinux()) {
          commandLine "python3", "-mpip", "install", "-r", "requirements.txt"
        } else {
          commandLine "python", "-mpip", "install", "-r", "requirements.txt"
        }
      }
    }

    if(systemOs.isMacOsX() || systemOs.isLinux()) {
      doLast {
        exec {
          workingDir "${buildDir}/${edition}c_pypi"
          commandLine "python3", "setup.py", "bdist_wheel"
	}
      }
    }
  }

  task "saxon_${edition}c_stage_wheel"(
    dependsOn: [graalEdition, "${edition}c_graalImage", "setup_${edition}c_pypi"]
  ) {
    doLast {
      def libdir = (systemOs.isMacOsX()
                    ? "libs/darwin"
                    : (systemOs.isLinux()
                       ? "libs/nix"
                       : "libs/win"))
      if (libdir == null) {
        throw GradleException("Don't know how to create Python wheels on this OS.");
      }
     
      copy {
        into "${buildDir}/wheels/${systemOsName}/${edition}c_pypi/${libdir}"
        from "${buildDir}/c"
        include "graal*.h"
        include "libsaxon-${edition}c-${saxonVersion}.*"
      }
    }

    doLast {
      copy {
        into "${buildDir}/wheels/${systemOsName}/${edition}c_pypi"
        from "${buildDir}/${edition}c_pypi"
      }
    }
  }
}

task saxonc_stage_wheels(
  type: Tar,
  dependsOn: ['saxon_eec_stage_wheel', 'saxon_pec_stage_wheel', 'saxon_hec_stage_wheel']

) {
  inputs.files fileTree(dir: "${buildDir}/wheels/${systemOsName}")
  outputs.file "${buildDir}/distributions/${systemOsName}.wheels.tar.gz"

  archiveFileName = "${systemOsName}.wheels.tar.gz"
  from "${buildDir}/wheels"
  include "${systemOsName}/**"
  exclude "${systemOsName}/*/build/**"
  exclude "${systemOsName}/*/*.egg-info/**"
  compression = Compression.GZIP

  doLast {
    delete "${buildDir}/wheels/${systemOsName}"
  }
}

task saxonc_build_wheels(
) {
  def user = project.findProperty('wheelUser') ?: System.getProperty('user.name')

  if (user == 'ndw') {
    user = 'norm' // HACK
  }

  def osarch = System.getProperty("os.arch") 
  def now = new Date()
  def isodate = "${now.format('yyyy-MM-dd')}T${now.format('HH-mm-ss')}"

  def buildMacA64  = project.findProperty('macWheels_aarch64') != null
  def buildMacX86  = project.findProperty('macWheels_x86_64') != null
  def buildLinux   = project.findProperty('linuxWheels') != null
  def buildWindows = project.findProperty('windowsWheels') != null

  if (!buildMacA64 && !buildMacX86 && !buildLinux && !buildWindows) {
    if (systemOs.isMacOsX()) {
      if (osarch == 'x86_64') {
        buildMacX86 = true
      } else {
        buildMacA64 = true
      }
    }
    buildLinux = systemOs.isLinux()
    buildWindows = systemOs.isWindows()
  }

  def arch = []
  if (buildMacX86) {
    arch.add("macx86_64")
  }
  if (buildMacA64) {
    arch.add("macaarch64")
  }
  if (buildLinux) {
    arch.add("linux")
  }
  if (buildWindows) {
    arch.add("windows")
  }

  doFirst {
    if (scp == null) {
      throw new GradleException("Did not find 'scp' on path")
    }
    delete "${buildDir}/BuildWheels"
  }

  doLast {
    println("Cloning BuildWheels")
    exec {
      workingDir buildDir
      commandLine 'git', 'clone', 'git@github.com:Saxonica/BuildWheels.git'
    }
  }

  if (project.findProperty("skipWheelUpload") == null
      && project.findProperty('wheelDryRun') == null) {
    doLast {
      def wheels = "${systemOsName}.wheels.tar.gz"
      if (systemOsName == "mac") {
        wheels = "${systemOsName}-${osarch}.wheels.tar.gz"
      }
      def path = "/var/www/html/dev.saxonica.com/github-wheel-sources"

      println("Copying ${systemOsName} staging files to dev.saxonica.com/${wheels}")
      exec {
        workingDir "${buildDir}/distributions"
        commandLine scp, "${systemOsName}.wheels.tar.gz",
          "dev.saxonica.com:${path}/${user}/${wheels}"
      }
    }
  } else {
    doLast {
      println("Skipping upload of ${systemOsName}.wheels.tar.gz")
    }
  }

  doLast {
    println("Creating build configuration")
    def m = new PrintStream(new File("${buildDir}/BuildWheels/config.json"))
    m.println("{")
    m.println("  \"user\": \"${user}\",")
    m.println("  \"macx86_64\": ${buildMacX86},")
    m.println("  \"macaarch64\": ${buildMacA64},")
    m.println("  \"linux\": ${buildLinux},")
    m.println("  \"windows\": ${buildWindows},")

    if (buildMacX86) {
      def path = project.findProperty('macWheels_x86_64') ?: projectDir
      m.println("  \"macpath\": \"${path}\",")
    }

    if (buildMacA64) {
      def path = project.findProperty('macWheels_aarch64') ?: projectDir
      m.println("  \"macpath\": \"${path}\",")
    }

    m.println("  \"date\": \"${isodate}\"")
    m.println("}")
    m.close()
  }

  if (project.findProperty('wheelDryRun') == null) {
    doLast {
      def msg = "Triggered by ${user} on ${isodate} for ${arch.join(', ')}"

      exec {
        workingDir "${buildDir}/BuildWheels"
        commandLine 'git', 'commit', '-m', msg, 'config.json'
      }
    }
  }

  if (project.findProperty('wheelDryRun') == null) {
    doLast {
      println("Pushing build trigger")
      exec {
        workingDir "${buildDir}/BuildWheels"
        commandLine 'git', 'push'
      }
    }
  } else {
    doLast {
      println("Dry run: trigger not pushed.")
    }
  }
}
