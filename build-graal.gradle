def graalCeHome = null
def graalEeHome = null

private String findGraalHome(String edition) {
  String home = System.getenv("GRAALVM_${edition.toUpperCase()}_HOME")
  if (home == null) {
    String prefix = "graalvm-${edition.toLowerCase()}"
    // Where might we find GraalVM?
    ["/Library/Java/JavaVirtualMachines", "/lib/jvm", "C:/GraalVM"].each { root ->
      File rdir = new File(root)
      if (rdir.exists() && rdir.isDirectory()) {
        rdir.list().each { fn ->
          if (fn.startsWith(prefix) && fn.contains(graalVersion)) {
            home = "${root}/${fn}"
          }
          if (fn.startsWith(prefix) && fn.contains(graalVersion)) {
            home = "${root}/${fn}"
          }
        }
      }
    }
  }
  def vm = "GraalVM ${edition.toUpperCase()}"
  if (home == null) {
    throw new GradleException("Cannot build SaxonC, cannot find ${vm}")
  }
  File bin = new File("${home}/bin")
  if (! bin.exists()) {
    bin = new File("${home}/Contents/Home/bin")
    if (! bin.exists()) {
      throw new GradleException("Cannot build SaxonC, unknown ${vm} configuration")
    }
  }      

  File image = new File("${bin}/native-image")
  if (!image.exists()) {
    throw new GradleException("Cannot build SaxonC, cannot find ${vm} native-image")
  }

  return bin.toString()
}

task graal_ce_home(
) {
  doLast {
    graalCeHome = findGraalHome("ce")
  }
}

task graal_ee_home(
) {
  doLast {
    graalEeHome = findGraalHome("ee")
  }
}

