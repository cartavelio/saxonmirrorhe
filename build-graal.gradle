task graal_hec_jar(
  type: Jar,
  dependsOn: ["graal_hecCompile", "hej_MetaInf", "rejar_Xerces", "compile_function_library"],
  description: "Build the HE jar file for SaxonC"
) {
  inputs.files fileTree(dir: "${buildDir}/services/saxon-he/META-INF")
  inputs.files fileTree(dir: "${buildDir}/classes/hec")
  inputs.files fileTree(dir: "${projectDir}/src/main/resources/net")
  inputs.files fileTree(dir: "${buildDir}/xerces")
  inputs.files fileTree(dir: "${buildDir}/icu")
  inputs.file  "${buildDir}/resources/main/net/sf/saxon/data/sef/function-library.sef.xml"
  outputs.file "${buildDir}/c/jars/hec/saxon-he-${saxonVersion}.jar"

  archiveBaseName = "saxon-he-${saxonVersion}"
  destinationDirectory = file("${buildDir}/c/jars/hec")
  manifest {
    attributes "Project-Name": "Saxon-HE"
    attributes "Main-Class": "net.sf.saxon.Transform"
  }
  from ("build/services/saxon-he") {
    include "META-INF/**"
  }
  from ("build/classes/hec") {
    include "net/**/*.class"
  }
  from ("src/main/resources") {
    include "net/**"
  }
  from ("${buildDir}/xerces") {
      include "**/*.class"
      include "**/*.properties"
      exclude "org.w3c.dom.html.HTMLDOMImplementation.class"
      exclude "META-INF/MANIFEST.MF"
    }
  from("${buildDir}/resources/main"){
    include "net/sf/saxon/data/sef/function-library.sef.xml"
  }
  doFirst {
    mkdir "build/c/jars/hec"
  }
}

