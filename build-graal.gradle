def saxonApiDir = "${buildDir}/../src/main/c/Saxon.C.API"
def commandDir = "${buildDir}/../src/main/c/command"
def sharedLibDir = "${buildDir}/c"

task buildSaxonGlue(type: Exec) {
  dependsOn 'graalImage'
  workingDir "${commandDir}"
  commandLine "/usr/bin/gcc", "-m64", "-fPIC", "-I${saxonApiDir}/graalvm", "-c", "${saxonApiDir}/SaxonCGlue.c", "-o", "${commandDir}/SaxonCGlue.o"
  doLast {
    println "built Saxon glue"
  }
}

task buildTransform(type: Exec) {
  dependsOn 'buildSaxonGlue'
  workingDir "${commandDir}"
  commandLine "/usr/bin/gcc", "-m64", "-fPIC", "-I${saxonApiDir}/graalvm", "${commandDir}/Transform.c", "-o", "${commandDir}/transform", "-ldl", "-lc", "-DEEC", "${commandDir}/SaxonCGlue.o", "-L${sharedLibDir}", "-lsaxon-eec-12.1" 
  doLast {
    println "built transform wrapper"
  }
}

task buildQuery(type: Exec) {
  dependsOn 'buildSaxonGlue'
  workingDir "${commandDir}"
  commandLine "/usr/bin/gcc", "-m64", "-fPIC", "-I${saxonApiDir}/graalvm", "${commandDir}/Query.c", "-o", "${commandDir}/query", "-ldl", "-lc", "-DEEC", "${commandDir}/SaxonCGlue.o", "-L${sharedLibDir}", "-lsaxon-eec-12.1" 
  doLast {
    println "built query wrapper"
  } 
}

task buildValidate(type: Exec) {
  dependsOn 'buildSaxonGlue'
  workingDir "${commandDir}"
  commandLine "/usr/bin/gcc", "-m64", "-fPIC", "-I${saxonApiDir}/graalvm", "${commandDir}/Validate.c", "-o", "${commandDir}/validate", "-ldl", "-lc", "-DEEC", "${commandDir}/SaxonCGlue.o", "-L${sharedLibDir}", "-lsaxon-eec-12.1" 
  doLast {
    println "built validate wrapper"
  }
}

task buildCWrappers (
  dependsOn: ['buildTransform', 'buildQuery', 'buildValidate']){
}

["he", "pe", "ee"].each { saxonEdition ->
  def graalEdition = saxonEdition == "he" ? "ce" : "ee"
  
  task "setup_${saxonEdition}c_graalJar"(
    dependsOn: ["graal_${saxonEdition}c_jar"],
    description: "Setup the ${saxonEdition.toUpperCase()} jar file for GraalVM"
  ) {
    inputs.file "${buildDir}/c/jars/${saxonEdition}c/saxon-${saxonEdition}-${saxonVersion}.jar"
    inputs.files fileTree(dir: "${projectDir}/src/graalvm/META-INF")
    outputs.files fileTree(dir: "${buildDir}/graalvm/META-INF");

    doLast {
      mkdir("${buildDir}/graalvm");
    }
    doLast {
      copy {
        def zipFile = file("${buildDir}/c/jars/${saxonEdition}c/saxon-${saxonEdition}-${saxonVersion}.jar")
        def outputDir = "${buildDir}/graalvm"
        from(zipTree(zipFile)) {
          exclude "META-INF/TE*"
        }
        into outputDir
      }
    }
    doLast {
      copy {
        from("${projectDir}/src/graalvm/META-INF")
        into("${buildDir}/graalvm/META-INF")
      }
    }
  }

  task "${saxonEdition}c_graalJar"(
    type: Jar,
    dependsOn: ["setup_${saxonEdition}c_graalJar"],
    description: "Build the ${saxonEdition.toUpperCase()} jar file for GraalVM"
  ) {
    inputs.files fileTree(dir: "${buildDir}/graalvm")
    outputs.file "${buildDir}/libs/libsaxon-${saxonEdition}c-${saxonVersion}.jar"

    def prefixLen = "${buildDir}/graalvm".length()

    archiveBaseName = "libsaxon-${saxonEdition}c-${saxonVersion}"
    manifest {
      from "${buildDir}/graalvm/META-INF/MANIFEST.MF"
    }
    from("${buildDir}/graalvm")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  }

  task "${saxonEdition}c_graalImage"(
    dependsOn: ["${saxonEdition}c_graalJar", "graal_${graalEdition}_home"],
    description: "Builds the GraalVM native image, add '-g' and \"-H:Log=registerResource:3\" option for debugging add :${icu4jJar} for icu"
  ) {
    inputs.file "${buildDir}/libs/libsaxon-${saxonEdition}c-${saxonVersion}.jar"
    outputs.files fileTree(dir: "${buildDir}/c",
                           include: "libsaxon-${saxonEdition}c-${saxonVersion}.*")

    doLast {
      def home = graalEdition == "ce" ? graalCeHome : graalEeHome
      exec {
        commandLine "${home}/native-image",
          "-cp", "${buildDir}/libs/libsaxon-${saxonEdition}c-${saxonVersion}.jar",
          "-o","${buildDir}/c/libsaxon-${saxonEdition}c-${saxonVersion}",
          "--no-fallback", "-H:Path=${buildDir}/c",
          "-H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.msg.SAXMessages",
          "-H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.msg.XMLMessages",
          "-H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.msg.XMLMessages",
          "-H:+ReportExceptionStackTraces",
          "--trace-class-initialization=javax.xml.parsers.FactoryFinder",
          "--trace-class-initialization=net.sf.saxon.s9api.streams.Steps",
          "--trace-class-initialization=jdk.xml.internal.SecuritySupport",
          "--enable-url-protocols=https",
          "--shared"
      }
    }
  }

  task "${saxonEdition}c_graalImageExe"(
    type: Exec,
    dependsOn: ["${saxonEdition}c_graalJar", "graal_${graalEdition}_home"],
    description: "Builds the GraalVM native image, add '-g' and \"-H:Log=registerResource:3\" option for debugging add :${icu4jJar} for icu"
  ) {
    def home = graalEdition == "ce" ? graalCeHome : graalEeHome
    commandLine "${home}/native-image",
      "-cp", "${buildDir}/libs/libsaxon-${saxonEdition}c-${saxonVersion}.jar",
      "net.sf.saxon.Transform", "-o","${buildDir}/c/saxon-${saxonEdition}c-${saxonVersion}",
      "--no-fallback", "-H:Path=${buildDir}/c",
      "-H:+AllowVMInspection",
      "-H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.msg.SAXMessages",
      "-H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.msg.XMLMessages",
      "-H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.msg.XMLMessages",
      "-H:+ReportExceptionStackTraces",
      "--trace-class-initialization=javax.xml.parsers.FactoryFinder",
      "--trace-class-initialization=net.sf.saxon.s9api.streams.Steps",
      "--trace-class-initialization=jdk.xml.internal.SecuritySupport"
  }
}

